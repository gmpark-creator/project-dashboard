<!doctype html>
<html lang="ko" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralex · TOEIC® RC 대비 cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { base:'#0b1020', para:'#2dd4bf', lex:'#818cf8', news:'#38bdf8', biz:'#f59e0b' },
      fontFamily: { sans: ['Pretendard','-apple-system','Segoe UI','Malgun Gothic','sans-serif'] }
    }}
  };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- ★Codex R3 락: file:// 지원 위해 ES module/fetch 금지. classic script 전역만. -->
<script src="data/manifest.js"></script>
<script src="data/guide.js"></script>
<script src="data/strategy-seed.js"></script>
<!-- 콘텐츠(reading/grammar/vocab)는 manifest.content[]를 읽어 아래 loader가 동적 주입 -->
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; }
  body{ background:#0b1020; color:#e2e8f0; font-family:'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif; line-height:1.6; word-break:keep-all; }
  a{ color:#38bdf8; }
  button{ cursor:pointer; font-family:inherit; color:inherit; }
  #appLayout{ display:flex; min-height:100vh; }
  #sidebar{ width:236px; min-width:236px; background:#070b18; border-right:1px solid #1e293b; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; }
  #root{ flex:1; min-width:0; overflow-x:hidden; padding:26px 30px 80px; }
  .wrap{ max-width:920px; margin:0 auto; }
  .sb-logo{ padding:18px 16px 12px; border-bottom:1px solid #1e293b; }
  .sb-brand{ font-size:17px; font-weight:800; color:#fff; letter-spacing:.02em; }
  .sb-brand .x{ color:#2dd4bf; }
  .sb-tag{ font-size:10px; color:#64748b; margin-top:3px; letter-spacing:.04em; }
  .sb-label{ font-size:10px; font-weight:700; color:#475569; letter-spacing:.1em; text-transform:uppercase; padding:14px 14px 5px; }
  .sb-item{ width:100%; text-align:left; padding:9px 14px; border:none; background:transparent; color:#94a3b8; font-size:13.5px; display:flex; align-items:center; gap:9px; line-height:1.3; transition:background .12s,color .12s; }
  .sb-item:hover{ background:#111a2e; color:#e2e8f0; }
  .sb-item.on{ background:#111a2e; color:#2dd4bf; box-shadow:inset 3px 0 0 #2dd4bf; }
  .sb-foot{ margin-top:auto; padding:14px; border-top:1px solid #1e293b; font-size:9.5px; color:#475569; line-height:1.5; }
  .card{ background:#111a2e; border:1px solid #243049; border-radius:16px; padding:22px; }
  .h-title{ font-size:22px; font-weight:800; color:#f1f5f9; }
  .h-sub{ font-size:13px; color:#94a3b8; margin-top:6px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; letter-spacing:.02em; }
  .pill-news{ color:#7dd3fc; background:#082f49; border:1px solid #0ea5e955; }
  .pill-biz{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-orig{ color:#cbd5e1; background:#1e293b; border:1px solid #475569; }
  .pill-band{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-cap{ color:#c4b5fd; background:#1e1b4b; border:1px solid #6d28d966; }
  .doc-head{ font-size:11.5px; font-weight:800; color:#7dd3fc; margin:16px 0 5px; display:flex; align-items:center; gap:6px; }
  .set-row{ display:flex; align-items:center; gap:14px; padding:16px 18px; background:#111a2e; border:1px solid #243049; border-radius:14px; margin-bottom:11px; text-align:left; width:100%; transition:border-color .12s, transform .08s; }
  .set-row:hover{ border-color:#2dd4bf66; transform:translateY(-1px); }
  .set-ic{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .set-ic.news{ background:#082f49; color:#7dd3fc; }
  .set-ic.biz{ background:#2a1a04; color:#fcd34d; }
  .para-p{ background:#0d1424; border:1px solid #243049; border-radius:11px; padding:13px 16px; margin-top:10px; line-height:1.85; font-size:14.5px; color:#dbe4f0; }
  .ck-en-inline{ color:#dbe4f0; }
  .sl{ color:#2dd4bf; font-weight:800; margin:0 3px; }
  .ck-row{ border-left:2px solid #2dd4bf44; padding:5px 0 5px 13px; margin:9px 0; }
  .ck-en{ color:#f1f5f9; font-size:14px; font-weight:600; line-height:1.5; }
  .ck-ko{ color:#5eead4; font-size:13px; margin-top:3px; line-height:1.55; }
  .ck-note{ color:#94a3b8; font-size:11px; margin-left:8px; background:#0b1020; border:1px solid #334155; border-radius:5px; padding:1px 7px; white-space:nowrap; }
  .sec-h{ font-size:13px; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:7px; margin:24px 0 8px; }
  .sec-h i{ color:#2dd4bf; }
  .kv{ background:#0d1424; border:1px solid #243049; border-radius:9px; padding:10px 13px; font-size:13px; margin-top:7px; }
  .kv .en{ color:#f1f5f9; font-weight:600; }
  .kv .ko{ color:#94a3b8; font-size:12px; margin-top:2px; }
  .kv .meta{ color:#64748b; font-size:11px; margin-top:3px; }
  .vtag{ font-size:9px; font-weight:800; padding:1px 6px; border-radius:5px; color:#a5b4fc; background:#1e1b4b; border:1px solid #4338ca66; margin-left:6px; }
  .pp{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; background:#0d1424; border:1px solid #243049; border-radius:9px; padding:11px 13px; margin-top:7px; }
  .pp .orig{ color:#cbd5e1; font-size:13px; }
  .pp .arr{ color:#2dd4bf; font-size:13px; }
  .pp .par{ color:#5eead4; font-size:13px; font-weight:600; }
  .pp.hide .par{ filter:blur(5px); user-select:none; }
  .q-card{ background:#0d1424; border:1px solid #243049; border-radius:13px; padding:18px; margin-top:12px; }
  .q-stem{ font-size:14px; font-weight:700; color:#f1f5f9; line-height:1.6; }
  .q-choice{ width:100%; text-align:left; padding:10px 14px; border-radius:9px; font-size:13px; color:#cbd5e1; border:1px solid #243049; background:#0b1020; display:flex; gap:9px; line-height:1.5; margin-top:7px; transition:border-color .12s,background .12s; }
  .q-choice:hover{ border-color:#475569; }
  .q-choice.correct{ border-color:#10b981; background:#052e1a; color:#6ee7b7; font-weight:700; }
  .q-choice.wrong{ border-color:#f43f5e; background:#2a0e12; color:#fda4af; }
  .q-lab{ font-weight:800; color:#64748b; }
  .q-exp{ background:#0a1f16; border:1px solid #10b98144; border-radius:9px; padding:11px 14px; font-size:12.5px; color:#86efac; line-height:1.65; margin-top:9px; }
  .q-dr{ background:#1a1206; border:1px solid #f59e0b33; border-radius:9px; padding:10px 13px; font-size:12px; color:#fcd34d; line-height:1.6; margin-top:7px; }
  .q-dr b{ color:#fde68a; }
  .btn{ padding:8px 16px; border-radius:9px; font-size:12.5px; font-weight:700; border:1px solid #2dd4bf55; background:#042f2a; color:#5eead4; transition:background .12s; }
  .btn:hover{ background:#063f38; }
  .btn-ghost{ border-color:#334155; background:#111a2e; color:#94a3b8; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; color:#2dd4bf; font-size:15px; }
  .empty{ text-align:center; color:#64748b; padding:60px 20px; font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat-box{ background:#0d1424; border:1px solid #243049; border-radius:12px; padding:15px; }
  .stat-n{ font-size:26px; font-weight:800; color:#2dd4bf; }
  .stat-l{ font-size:11px; color:#94a3b8; margin-top:3px; }
  .disc{ font-size:10px; color:#475569; margin-top:18px; line-height:1.6; border-top:1px solid #1e293b; padding-top:12px; }
  .tk{ display:flex; align-items:center; gap:15px; padding:16px 18px; background:#0d1424; border:1px solid #243049; border-radius:14px; margin-top:11px; }
  .tk.done{ opacity:.55; }
  .tk-ic{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#042f2a; color:#5eead4; }
  .tk-b{ flex:1; min-width:0; }
  .tk-t{ font-size:15px; font-weight:800; color:#f1f5f9; display:flex; align-items:center; gap:8px; }
  .tk-target{ font-size:12.5px; color:#5eead4; font-weight:700; margin-top:2px; }
  .tk-desc{ font-size:11.5px; color:#94a3b8; margin-top:3px; line-height:1.5; }
  .tk-go{ padding:9px 17px; border-radius:10px; font-size:13px; font-weight:800; border:1px solid #2dd4bf66; background:#042f2a; color:#5eead4; white-space:nowrap; }
  .tk-go:hover{ background:#063f38; }
  .today-hero{ background:linear-gradient(135deg,#0d1f1c,#111a2e); border:1px solid #2dd4bf33; border-radius:16px; padding:20px 22px; }
  .g-sec{ background:#0d1424; border:1px solid #243049; border-radius:14px; padding:18px 20px; margin-top:14px; }
  .g-h{ font-size:15.5px; font-weight:800; color:#f1f5f9; display:flex; align-items:center; gap:9px; }
  .g-h i{ color:#2dd4bf; }
  .g-sub{ font-size:12.5px; font-weight:800; color:#7dd3fc; margin:13px 0 5px; }
  .g-p{ font-size:13.5px; color:#cbd5e1; line-height:1.75; margin-top:9px; }
  .g-note{ background:#042f2a; border:1px solid #2dd4bf44; border-radius:10px; padding:11px 14px; font-size:12.5px; color:#a7f3d0; line-height:1.7; margin-top:11px; }
  .g-ul{ margin:9px 0 0 2px; padding:0; list-style:none; }
  .g-ul li{ font-size:13px; color:#cbd5e1; line-height:1.7; padding-left:18px; position:relative; margin-top:5px; }
  .g-ul li:before{ content:"▪"; color:#2dd4bf; position:absolute; left:0; }
  .g-ol{ margin:9px 0 0 0; padding-left:20px; }
  .g-ol li{ font-size:13px; color:#cbd5e1; line-height:1.75; margin-top:7px; }
  .g-kv{ display:grid; grid-template-columns:1fr; gap:7px; margin-top:10px; }
  .g-kv .row{ display:grid; grid-template-columns:150px 1fr; gap:10px; background:#0b1020; border:1px solid #243049; border-radius:8px; padding:9px 12px; }
  .g-kv .k{ font-size:12.5px; font-weight:800; color:#5eead4; }
  .g-kv .v{ font-size:12.5px; color:#cbd5e1; line-height:1.6; }
  .rd-passage{ font-size:15px; line-height:1.95; }
  .rd-para{ display:block; }
  .rd-para + .rd-para{ margin-top:13px; }
  .vlayout{ display:flex; gap:16px; align-items:flex-start; margin-top:14px; }
  .vrail{ width:122px; min-width:122px; display:flex; flex-direction:column; gap:6px; position:sticky; top:18px; }
  .vrail button{ text-align:left; padding:9px 12px; border-radius:9px; border:1px solid #243049; background:#0d1424; color:#94a3b8; line-height:1.2; }
  .vrail button:hover{ border-color:#2dd4bf55; color:#e2e8f0; }
  .vrail button.on{ background:#042f2a; color:#5eead4; border-color:#2dd4bf66; box-shadow:inset 3px 0 0 #2dd4bf; }
  .vmain{ flex:1; min-width:0; }
  .vlegend{ background:#0d1424; border:1px solid #243049; border-radius:10px; padding:11px 14px; margin-top:11px; font-size:11.5px; color:#94a3b8; }
  .vlegend summary{ cursor:pointer; color:#7dd3fc; font-weight:700; }
  .vg{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:10px; margin-top:10px; }
  .vg-card{ position:relative; background:#0d1424; border:1px solid #243049; border-radius:11px; padding:12px 14px; text-align:left; transition:border-color .12s; }
  .vg-card:hover{ border-color:#2dd4bf55; }
  .vg-eye{ position:absolute; top:8px; right:8px; width:28px; height:28px; padding:0; border:1px solid #243049; border-radius:8px; background:#111c30; color:#5eead4; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; z-index:2; transition:border-color .12s,background .12s; }
  .vg-eye:hover{ border-color:#2dd4bf; background:#16233b; }
  .vg-card.hide .vg-eye{ color:#64748b; }
  .vg-lem{ font-size:15px; font-weight:800; color:#f1f5f9; }
  .vg-pos{ font-size:10.5px; color:#64748b; margin-left:5px; font-weight:600; }
  .vg-mean{ font-size:12.5px; color:#5eead4; margin-top:6px; line-height:1.55; }
  /* 예문 글자 확대 — 디렉터 지시 2026-07-05 (PC·모바일에서 눈에 잘 안 보임) */
  .vg-ex{ font-size:14px; color:#d4deee; margin-top:7px; font-style:italic; line-height:1.65; }
  .vg-exko{ font-size:13px; color:#a8bcd8; margin-top:4px; line-height:1.6; }
  .vg-card.hide .vg-mean, .vg-card.hide .vg-ex, .vg-card.hide .vg-exko, .vg-card.hide .vg-gp{ filter:blur(5px); user-select:none; }
  /* 문법 포인트(gp) — 예문 하나로 Part 5/6 어법까지 병행 학습 (디렉터 지시 2026-07-05) */
  .vg-gp{ margin-top:9px; border-top:1px dashed #2a3a58; padding-top:8px; }
  .vg-form{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b55; border-radius:6px; padding:2px 8px; }
  .vg-pt{ display:flex; gap:7px; margin-top:6px; align-items:flex-start; }
  .vg-pt-t{ flex-shrink:0; font-size:10px; font-weight:800; padding:1.5px 7px; border-radius:5px; margin-top:1.5px; }
  .vg-pt-t.u{ color:#5eead4; background:#042f2a; border:1px solid #2dd4bf44; }
  .vg-pt-t.g{ color:#a5b4fc; background:#1e1b4b; border:1px solid #4338ca66; }
  .vg-pt-t.x{ color:#fda4af; background:#2a0e12; border:1px solid #f43f5e44; }
  .vg-pt-d{ font-size:12.5px; color:#b9c8e0; line-height:1.6; }
  .seg-h{ font-size:11.5px; font-weight:800; color:#7dd3fc; letter-spacing:.04em; margin:16px 0 2px; }
  @media(max-width:680px){ .vlayout{ flex-direction:column } .vrail{ width:100%; flex-direction:row; flex-wrap:wrap; position:static } .vrail button{ flex:1; min-width:72px } }
  /* 반응형: 좁은 화면(폰)에서 사이드바를 가로 스크롤 바로 — 모바일 단일 앱 */
  @media(max-width:760px){
    #appLayout{ flex-direction:column; }
    #sidebar{ width:100%; min-width:0; height:auto; position:static; flex-direction:row; flex-wrap:nowrap; overflow-x:auto; border-right:none; border-bottom:1px solid #1e293b; align-items:center; }
    #sidebar .sb-logo{ border-bottom:none; border-right:1px solid #1e293b; padding:10px 13px; flex-shrink:0; }
    #sidebar .sb-label, #sidebar .sb-foot{ display:none; }
    #sidebar .sb-item{ width:auto; white-space:nowrap; box-shadow:none !important; flex-shrink:0; }
    #sidebar .sb-item span{ display:none; }
    #root{ padding:18px 16px 64px; }
  }
  /* 회독 1~5 스탬프 */
  .rstamps{ display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .rstamp-l{ font-size:11px; color:#64748b; font-weight:700; margin-right:3px; }
  .rstamp{ width:27px; height:27px; border-radius:50%; border:1px solid #334155; background:#0d1424; color:#64748b; font-size:11px; font-weight:800; }
  .rstamp:hover{ border-color:#2dd4bf66; }
  .rstamp.on{ background:#042f2a; color:#5eead4; border-color:#2dd4bf88; }
  .rstamp-n{ font-size:11px; color:#5eead4; font-weight:800; margin-left:5px; }
  /* 페이지네이션 */
  .pgbar{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin:8px 0 4px; }
  .pg{ min-width:30px; height:30px; padding:0 8px; border-radius:8px; border:1px solid #243049; background:#0d1424; color:#94a3b8; font-size:12px; font-weight:700; }
  .pg:hover{ border-color:#2dd4bf66; color:#e2e8f0; }
  .pg.on{ background:#042f2a; color:#5eead4; border-color:#2dd4bf66; }
  .pg:disabled{ opacity:.4; cursor:default; }
  /* 개념 강의 */
  .cn-ul{ margin:8px 0 0 2px; padding:0; list-style:none; }
  .cn-ul li{ font-size:13.5px; color:#dbe4f0; line-height:1.7; padding-left:18px; position:relative; margin-top:6px; }
  .cn-ul li:before{ content:"▸"; color:#2dd4bf; position:absolute; left:0; }
  .cn-trap li:before{ content:"⚠"; color:#f59e0b; }
  .cn-ol{ margin:8px 0 0; padding-left:22px; }
  .cn-ol li{ font-size:13.5px; color:#dbe4f0; line-height:1.7; margin-top:6px; }
  .cn-ex{ background:#0d1424; border:1px solid #243049; border-radius:10px; padding:12px 15px; margin-top:9px; }
  .cn-ex-en{ font-size:14.5px; color:#f1f5f9; font-weight:600; line-height:1.6; }
  .cn-ex-ko{ font-size:12.5px; color:#94a3b8; margin-top:4px; }
  .cn-ex-pt{ font-size:12px; color:#5eead4; margin-top:6px; background:#042f2a; border:1px solid #2dd4bf33; border-radius:7px; padding:6px 10px; }
  .cn-pr{ background:#0d1424; border:1px dashed #334155; border-radius:10px; padding:12px 15px; margin-top:9px; }
  .cn-pr-task{ font-size:12px; color:#fcd34d; margin-top:6px; }
</style>
</head>
<body>
<div id="appLayout">
  <aside id="sidebar">
    <div class="sb-logo">
      <div class="sb-brand">Para<span class="x">lex</span></div>
      <div class="sb-tag">읽은 영어 → TOEIC® 950 cockpit</div>
    </div>
    <div class="sb-label">오늘</div>
    <button class="sb-item" data-view="today" onclick="setState({view:'today'})"><i class="fa-solid fa-bullseye w-4 text-center"></i>Today <span style="font-size:9px;color:#64748b;margin-left:auto">오늘 할 일</span></button>
    <button class="sb-item" data-view="guide" onclick="setState({view:'guide'})"><i class="fa-solid fa-compass w-4 text-center"></i>학습 가이드</button>
    <div class="sb-label">콘텐츠</div>
    <button class="sb-item" data-view="concept" onclick="setState({view:'concept',conceptId:null})"><i class="fa-solid fa-graduation-cap w-4 text-center"></i>개념 <span style="font-size:9px;color:#64748b;margin-left:auto">강의</span></button>
    <button class="sb-item" data-view="workbench" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-book-open w-4 text-center"></i>Reading Workbench</button>
    <button class="sb-item" data-view="grammar" onclick="setState({view:'grammar',glabId:null})"><i class="fa-solid fa-spell-check w-4 text-center"></i>Grammar Lab <span style="font-size:9px;color:#64748b;margin-left:auto">P5·6</span></button>
    <button class="sb-item" data-view="vocab" onclick="setState({view:'vocab'})"><i class="fa-solid fa-layer-group w-4 text-center"></i>Vocab Deck</button>
    <button class="sb-item" data-view="strategy" onclick="setState({view:'strategy'})"><i class="fa-solid fa-chess-knight w-4 text-center"></i>Strategy &amp; Traps</button>
    <div class="sb-foot">
      <div style="margin:0 0 10px;padding:9px 10px;background:#0d1424;border:1px solid #243049;border-radius:8px;color:#94a3b8;font-size:9.5px;line-height:1.55">⚠️ 기본기·전략·어휘 <b style="color:#cbd5e1">보조 트레이너</b>입니다. 고득점은 <b style="color:#cbd5e1">공식 합법 기출 실전서 + LC 훈련 + 시간제 모의고사</b> 병행이 필요합니다.</div>
      TOEIC is a registered trademark of ETS.<br>This product is not endorsed or approved by ETS.
    </div>
  </aside>
  <div id="root"><div class="wrap"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> 콘텐츠 로딩 중…</div></div></div>
</div>

<script>
/* ===== Paralex viewer engine (무빌드 단일HTML · self-register registry · localStorage) ===== */
window.PARALEX_SETS = window.PARALEX_SETS || {};
window.PARALEX_CONCEPTS = window.PARALEX_CONCEPTS || [];
const $ = (id)=>document.getElementById(id);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB = ['A','B','C','D','E'];

/* --- 수동 1회독 체크 저장소 (성능·정답 자동기록 폐지 → 디렉터 지시). paralex:v1:read = {reading:{},grammar:{},vocab:{}} --- */
const PKEY='paralex:v1:';
function pget(k,def){ try{ var v=localStorage.getItem(PKEY+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function pset(k,val){ try{ localStorage.setItem(PKEY+k, JSON.stringify(val)); }catch(e){} }
function loadRead(){ var r=pget('read', {}); ['reading','grammar','vocab','concept'].forEach(function(k){ if(!r[k]) r[k]={}; }); return r; }
function saveRead(r){ pset('read', r); }
/* normalize: 기존 boolean(true)=1회독, 숫자는 0~5 clamp */
function readGet(kind,id){ var r=loadRead(); var v=r[kind]&&r[kind][id]; if(v===true) return 1; return (typeof v==='number')?Math.max(0,Math.min(5,v)):0; }
function readSet(kind,id,n){ var r=loadRead(); if(!r[kind]) r[kind]={}; n=Math.max(0,Math.min(5,n)); if(n<=0) delete r[kind][id]; else r[kind][id]=n; saveRead(r); render(); }
function isRead(kind,id){ return readGet(kind,id)>0; }
function readCount(kind){ var r=loadRead(); var o=r[kind]||{}, n=0; for(var k in o){ if(o[k]===true||o[k]>0) n++; } return n; }
/* 1~5 회독 스탬프: 동그라미 i 클릭 → n=i(현재값 클릭 시 i-1로 감소) */
function readStamps(kind,id){ var n=readGet(kind,id), dots='';
  for(var i=1;i<=5;i++){ dots += `<button class="rstamp ${i<=n?'on':''}" title="${i}회독" onclick="readSet('${kind}','${id}',${i===n?i-1:i})">${i}</button>`; }
  return `<div class="rstamps"><span class="rstamp-l"><i class="fa-solid fa-repeat"></i> 회독</span>${dots}<span class="rstamp-n">${n>0?n+'회독':'미독'}</span></div>`;
}

/* --- state --- */
const S = Object.assign({ view:'today', setId:null, reveal:{}, ppHide:true, showGloss:false, glabId:null, greveal:{}, vocabDay:null, vocabRevealAll:false, vocabReveal:{}, conceptId:null, readPage:{} }, loadState());
function loadState(){ try{ return JSON.parse(localStorage.getItem('paralex-state'))||{}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem('paralex-state', JSON.stringify({view:S.view,setId:S.setId,vocabDay:S.vocabDay})); }catch(e){} }
function setState(patch){ Object.assign(S, patch); if(patch.setId!==undefined){ S.reveal={}; S.ppHide=true; } if(patch.glabId!==undefined){ S.greveal={}; } if(patch.vocabDay!==undefined){ S.vocabReveal={}; S.vocabRevealAll=false; } saveState(); render(); }

/* --- registry access --- */
function allSets(){ return Object.values(window.PARALEX_SETS); }
function getSet(id){ return window.PARALEX_SETS[id] || null; }
function setsByTrack(track){ return allSets().filter(s=>s.track===track); }
function manifestContent(kind){ var m=window.PARALEX_MANIFEST; if(!m||!m.content) return []; return m.content.filter(c=>c.kind===kind).sort((a,b)=>(a.order||0)-(b.order||0)); }

/* --- render dispatch --- */
function render(){
  document.querySelectorAll('.sb-item').forEach(b=> b.classList.toggle('on', b.dataset.view===S.view));
  const r = $('root');
  if(S.view==='today') r.innerHTML = renderToday();
  else if(S.view==='guide') r.innerHTML = renderGuide();
  else if(S.view==='concept') r.innerHTML = S.conceptId ? renderConcept(S.conceptId) : renderConceptList();
  else if(S.view==='workbench') r.innerHTML = S.setId ? renderSet(S.setId) : renderWorkbenchList();
  else if(S.view==='strategy') r.innerHTML = renderStrategy();
  else if(S.view==='grammar') r.innerHTML = S.glabId ? renderGrammar(S.glabId) : renderGrammarList();
  else if(S.view==='vocab') r.innerHTML = renderVocab();
  else r.innerHTML = renderToday();
  if(S.view==='workbench' && S.setId) startTimer();
}

/* ===================== TODAY (수동 1회독 기반) ===================== */
function nextReading(){ var list=manifestContent('reading'); for(var i=0;i<list.length;i++){ if(getSet(list[i].id) && !isRead('reading',list[i].id)) return list[i].id; } return null; }
function nextGrammar(){ var list=manifestContent('grammar'); for(var i=0;i<list.length;i++){ if((window.PARALEX_GLAB||{})[list[i].id] && !isRead('grammar',list[i].id)) return list[i].id; } return null; }
function nextVocabDay(){ var days=(window.PARALEX_VOCAB_DAYS||[]).slice().sort((a,b)=>(a.day||0)-(b.day||0)); for(var i=0;i<days.length;i++){ if(!isRead('vocab',days[i].day)) return days[i].day; } return null; }
function taskCard(ic,title,target,desc,goLabel,onclick,done){
  return `<div class="tk ${done?'done':''}">
    <div class="tk-ic"><i class="fa-solid ${ic}"></i></div>
    <div class="tk-b">
      <div class="tk-t">${esc(title)} ${done?'<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:13px"></i>':''}</div>
      <div class="tk-target">${target}</div>
      <div class="tk-desc">${esc(desc)}</div>
    </div>
    <button class="tk-go" onclick="${onclick}">${esc(goLabel)} <i class="fa-solid fa-arrow-right"></i></button>
  </div>`;
}
function conceptList(){ var mc=manifestContent('concept'); var arr=window.PARALEX_CONCEPTS||[]; if(mc.length){ var byId={}; arr.forEach(c=>byId[c.id]=c); var ordered=mc.map(m=>byId[m.id]).filter(Boolean); if(ordered.length) return ordered; } return arr.slice(); }
function nextConcept(){ var list=conceptList(); for(var i=0;i<list.length;i++){ if(readGet('concept',list[i].id)===0) return list[i].id; } return null; }
function renderToday(){
  var nc=nextConcept(), ng=nextGrammar(), nv=nextVocabDay(), nr=nextReading();
  var cTot=conceptList().length, rTot=manifestContent('reading').length, gTot=manifestContent('grammar').length, vTot=(window.PARALEX_VOCAB_DAYS||[]).length;
  var cards='';
  if(nc){ var cn=conceptList().find(x=>x.id===nc)||{}; cards += taskCard('fa-graduation-cap','개념', `${esc(cn.title||nc)}`, '먼저 개념을 읽어 체득하세요. 여러 번 읽고 회독을 올리면 좋아요.', '읽기', `setState({view:'concept',conceptId:'${nc}'})`, false); }
  else cards += taskCard('fa-graduation-cap','개념', '개념 강의 모두 1독 완료 🎉', '여러 번 반복해 회독을 올려 보세요.', '목록', `setState({view:'concept',conceptId:null})`, true);
  if(ng) cards += taskCard('fa-spell-check','문법', `${esc(ng)}`, '풀어 보고 해설을 확인하세요. 점수·정답은 기록하지 않습니다.', '시작', `setState({view:'grammar',glabId:'${ng}'})`, false);
  else cards += taskCard('fa-spell-check','문법', '문법 세트 모두 1독 🎉', '복습하려면 목록에서 고르세요.', '목록', `setState({view:'grammar'})`, true);
  if(nv!=null) cards += taskCard('fa-layer-group','어휘', `Day ${nv}`, '뜻·예문 해석과 문법 포인트(용법·출제)까지 익히고, 다 봤으면 회독을 올리세요.', '시작', `setState({view:'vocab',vocabDay:${nv}})`, false);
  else cards += taskCard('fa-layer-group','어휘', '어휘 Day 모두 1독 🎉', '복습하려면 왼쪽에서 Day를 고르세요.', '어휘', `setState({view:'vocab'})`, true);
  if(nr){ var set=getSet(nr); var mc=(manifestContent('reading').find(c=>c.id===nr)||{}); cards += taskCard('fa-book-open','독해', `${esc(set.title)} <span class="pill pill-orig" style="margin-left:4px">${esc(mc.band||'')}</span>`, '타이머 켜고 읽은 뒤 회독을 올리세요.', '시작', `setState({view:'workbench',setId:'${nr}'})`, false); }
  else cards += taskCard('fa-book-open','독해', '독해 세트 모두 1독 🎉', '복습하려면 목록에서 고르세요.', '목록', `setState({view:'workbench',setId:null})`, true);
  return `<div class="wrap">
    <div class="today-hero">
      <div class="h-title" style="font-size:24px">오늘의 학습</div>
      <div class="h-sub"><b style="color:#5eead4">개념 먼저</b>, 그다음 문법·어휘·독해. 아직 안 본 다음 것을 띄워 드려요. 점수·정답은 기록하지 않으니, 본 만큼 <b style="color:#5eead4">회독(1~5)</b>만 올리세요.</div>
    </div>
    ${cards}
    <div class="stat-grid" style="margin-top:18px">
      <div class="stat-box"><div class="stat-n">${readCount('concept')}/${cTot}</div><div class="stat-l">개념 1독+</div></div>
      <div class="stat-box"><div class="stat-n">${readCount('reading')}/${rTot}</div><div class="stat-l">독해 1독+</div></div>
      <div class="stat-box"><div class="stat-n">${readCount('grammar')}/${gTot}</div><div class="stat-l">문법 1독+</div></div>
      <div class="stat-box"><div class="stat-n">${readCount('vocab')}/${vTot}</div><div class="stat-l">어휘 1독+</div></div>
    </div>
    <div class="disc">처음이라면 <b>학습 가이드</b>와 <b>개념</b>부터. <button class="btn" style="padding:3px 11px;font-size:11px;margin-left:6px" onclick="setState({view:'guide'})">가이드</button> <button class="btn" style="padding:3px 11px;font-size:11px" onclick="setState({view:'concept',conceptId:null})">개념</button></div>
  </div>`;
}

/* ===================== GUIDE ===================== */
function gBlock(b){
  if(b.t==='p') return `<div class="g-p">${b.text}</div>`;
  if(b.t==='h') return `<div class="g-sub">${esc(b.text)}</div>`;
  if(b.t==='note') return `<div class="g-note">💡 ${b.text}</div>`;
  if(b.t==='ul') return `<ul class="g-ul">${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(b.t==='ol') return `<ol class="g-ol">${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ol>`;
  if(b.t==='kv') return `<div class="g-kv">${(b.rows||[]).map(r=>`<div class="row"><div class="k">${esc(r.k)}</div><div class="v">${r.v}</div></div>`).join('')}</div>`;

}
function renderGuide(){

}

/* ===================== Reading Workbench ===================== */
function setReadPage(key,p){ if(!S.readPage) S.readPage={}; S.readPage[key]=p; render(); }
function pageControls(key,page,pages){
  if(pages<=1) return '';
  var btns='';
  for(var i=0;i<pages;i++){ btns += `<button class="pg ${i===page?'on':''}" onclick="setReadPage('${key}',${i})">${i+1}</button>`; }
  return `<div class="pgbar"><button class="pg"${page<=0?' disabled':''} onclick="setReadPage('${key}',${Math.max(0,page-1)})">←</button>${btns}<button class="pg"${page>=pages-1?' disabled':''} onclick="setReadPage('${key}',${Math.min(pages-1,page+1)})">→</button></div>`;
}
function trackBlock(track, title, icon, cls, pageKey){
  const sets = setsByTrack(track);
  let h = `<div class="sec-h"><i class="fa-solid ${icon}"></i>${title} <span class="pill pill-${cls}" style="margin-left:6px">${sets.length}세트</span></div>`;
  if(!sets.length){ h += `<div class="kv" style="color:#64748b">아직 세트가 없습니다.</div>`; return h; }
  const per=10, pages=Math.ceil(sets.length/per); var page=(S.readPage&&S.readPage[pageKey])||0; if(page>=pages)page=pages-1; if(page<0)page=0;
  const slice=sets.slice(page*per, page*per+per);
  h += slice.map(s=>{
    var rn=readGet('reading', s.id);
    const done = rn>0 ? ` <span style="color:#10b981;font-size:11px;font-weight:800">${rn}회독</span>` : '';
    return `<button class="set-row" onclick="setState({view:'workbench',setId:'${s.id}'})">
      <div class="set-ic ${cls}"><i class="fa-solid ${icon}"></i></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:#f1f5f9;font-size:14.5px">${esc(s.title)}${done}</div>
        <div style="font-size:11.5px;color:#94a3b8;margin-top:3px">${esc(s.genre)} · ${s.wordCount||'?'}단어 · 목표 ${Math.round((s.targetTimeSec||0)/60)}분</div>
      </div>
      <div class="pill pill-orig">${esc(s.license)}</div>
    </button>`;
  }).join('');
  h += pageControls(pageKey, page, pages);
  return h;
}
function renderWorkbenchList(){
  return `<div class="wrap">

    <div class="h-sub">실제 영어를 <b style="color:#2dd4bf">정밀 독해 근육</b>으로, 비즈니스 지문을 <b style="color:#f59e0b">토익 전이</b>로 — 두 카테고리로 나눠 훈련한다. <span style="color:#64748b">(한 페이지에 10개씩)</span></div>

    <div class="disc">⚠️ 세트는 6게이트(Legal·Originality·Answerability·Distractor·TOEIC-likeness·Human) 검수 후 정식 반영됩니다. 현재는 모두 practice 버킷입니다.</div>
  </div>`;
}

let _timerInt=null, _timerSec=0;
function startTimer(){ clearInterval(_timerInt); _timerSec=0; _timerInt=setInterval(()=>{ _timerSec++; const el=$('pxTimer'); if(!el){clearInterval(_timerInt);return;} const m=String(Math.floor(_timerSec/60)).padStart(2,'0'),s=String(_timerSec%60).padStart(2,'0'); el.textContent=`${m}:${s}`; },1000); }

function renderSet(id){
  const set = getSet(id);
  if(!set) return `<div class="wrap"><div class="empty">세트를 찾을 수 없습니다.</div></div>`;
  const trackCls = set.track==='news'?'news':'biz';
  const trackLabel = set.track==='news'?'Authentic News':'Business RC';
  const showG = !!S.showGloss;
  const docs = (set.passage&&set.passage.documents) || [{id:'d1',label:'',paragraphs:(set.passage&&set.passage.paragraphs)||[]}];
  /* 디렉터 지시: functionLabel(주제제시/부연/유보) 제거 → 단일 지문(구조 힌트 차단). 문단 id는 근거 span용으로 유지. */
  const renderDoc = (d)=>{
    const head = (docs.length>1 && d.label) ? `<div class="doc-head"><i class="fa-solid fa-file-lines"></i> ${esc(d.label)}</div>` : '';
    if(showG){
      const body = (d.paragraphs||[]).map(p=>{
        const rows = (p.chunks||[]).map(c=>`<div class="ck-row"><div class="ck-en">${esc(c.en)} <span class="sl">/</span></div><div class="ck-ko">${esc(c.ko)}${c.note?`<span class="ck-note">${esc(c.note)}</span>`:''}</div></div>`).join('');
        return `<div id="span-${esc(p.id)}">${rows}</div>`;
      }).join('');
      return head + `<div class="para-p">${body}</div>`;
    }
    const body = (d.paragraphs||[]).map(p=>{
      const text = (p.chunks||[]).map(c=>esc(c.en)).join(' ');
      return `<span class="rd-para" id="span-${esc(p.id)}">${text}</span>`;
    }).join('');
    return head + `<div class="para-p rd-passage">${body}</div>`;
  };
  const paras = docs.map(renderDoc).join('');
  const keyS = (set.keyStructures||[]).map(k=>`<div class="kv"><div class="en">${esc(k.span)}</div><div class="ko">${esc(k.note)}</div></div>`).join('');
  const vocab = (set.vocabulary||[]).map(v=>`<div class="kv"><div class="en">${esc(v.lemma)} <span style="color:#64748b;font-size:11px">${esc(v.pos||'')}</span><span class="vtag">${esc(v.listTag||'')}</span></div><div class="ko">${esc(v.glossKo)}</div>${v.collocation?`<div class="meta">▪ ${esc(v.collocation)}</div>`:''}</div>`).join('');
  const pps = (set.paraphrases||[]).map(p=>`<div class="pp ${S.ppHide?'hide':''}"><div class="orig">${esc(p.original)}</div><div class="arr"><i class="fa-solid fa-arrow-right-arrow-left"></i></div><div class="par">${esc(p.paraphrase)}</div></div>`).join('');
  const qs = (set.questions||[]).map((q,qi)=> renderQuestion(set,q,qi)).join('');
  const refl = (set.reflectionPrompts||[]).map(r=>`<div class="kv" style="color:#cbd5e1">🤔 ${esc(r)}</div>`).join('');

  return `<div class="wrap">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-ghost" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-arrow-left"></i> 목록</button>
      ${readStamps('reading', set.id)}
    </div>
    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="pill pill-${trackCls}">${trackLabel}</span>
        ${set.scoreBandTarget?`<span class="pill pill-band">🎯 ${esc(set.scoreBandTarget)}</span>`:''}
        <span class="pill pill-orig">${esc(set.genre)}</span>
        ${(set.partFocus||[]).map(p=>`<span class="pill pill-orig">${esc(p)}</span>`).join('')}
        ${set.setKind==='ladder_capsule'?`<span class="pill pill-cap">Ladder Capsule</span>`:''}
        <span style="margin-left:auto" class="timer" id="pxTimer">00:00</span>
      </div>
      <div class="h-title" style="margin-top:12px">${esc(set.title)}</div>
      <div class="h-sub">출처: ${esc(set.source&&set.source.name||'')} · 라이선스: ${esc(set.license)} ${set.attribution?'· '+esc(set.attribution):''} · 목표 ${Math.round((set.targetTimeSec||0)/60)}분 · ${set.wordCount||'?'}단어</div>
    </div>

    <div class="sec-h"><i class="fa-solid fa-book-open"></i>지문 ${showG?'— 슬래시 끊기 + 직독직해':'(원문)'} <button class="btn" style="margin-left:auto;padding:4px 13px" onclick="setState({showGloss:!S.showGloss})">${showG?'원문만 보기':'해석 보기'}</button></div>${paras}
    ${keyS?`<div class="sec-h"><i class="fa-solid fa-diagram-project"></i>핵심 구문</div>${keyS}`:''}
    ${vocab?`<div class="sec-h"><i class="fa-solid fa-spell-check"></i>어휘 (NGSL/TSL/BSL/NAWL 매칭)</div>${vocab}`:''}
    ${pps?`<div class="sec-h"><i class="fa-solid fa-arrow-right-arrow-left"></i>패러프레이즈 훈련 <button class="btn" style="margin-left:auto;padding:4px 12px" onclick="setState({ppHide:!S.ppHide})">${S.ppHide?'정답 보기':'가리기'}</button></div>${pps}`:''}
    ${qs?`<div class="sec-h"><i class="fa-solid fa-circle-question"></i>이해 문항 (근거 span 기반)</div>${qs}`:''}
    ${refl?`<div class="sec-h"><i class="fa-solid fa-pen-to-square"></i>회고</div>${refl}`:''}
    <div style="margin-top:18px;text-align:center">${readStamps('reading', set.id)}</div>
    <div class="disc">정답·해설은 자체 작성입니다. 점수는 기록하지 않으니, 다 읽었으면 위 버튼으로 1회독만 체크하세요.</div>
  </div>`;
}

function renderQuestion(set,q,qi){
  const revealed = S.reveal[q.no];
  const ans = (q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const choices = (q.choices||[]).map((c,ci)=>{
    const lab = c.label || LAB[ci];
    let cls='q-choice';
    if(revealed){ if(ans.includes(lab)) cls+=' correct'; else if(revealed===lab) cls+=' wrong'; }
    return `<button class="${cls}" onclick="answerQ('${set.id}','${q.no}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(revealed){
    const picked = revealed===true?null:revealed;
    const dr = (q.distractorRationales||[]).find(d=>d.label===picked);
    const evid = (q.evidenceSpanIds||[]).join(', ');
    exp = `${dr?`<div class="q-dr"><b>오답 [${esc(picked)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}
      <div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b>${evid?` · 근거 ${esc(evid)}`:''}<br>${esc(q.explanation)}</div>`;
  }
  return `<div class="q-card"><div class="q-stem">${q.no}. ${esc(q.stem)}</div>${choices}${exp}</div>`;
}
/* 자기확인용 정답 표시만 — 점수/정답 기록하지 않음 */
function answerQ(setId,qno,lab){
  const set=getSet(setId); const q=(set.questions||[]).find(x=>String(x.no)===String(qno));
  if(S.reveal[qno]) return;
  S.reveal[qno]=lab;
  render();
  (q.evidenceSpanIds||[]).forEach(sid=>{ const el=$('span-'+sid); if(el) el.style.boxShadow='0 0 0 2px #2dd4bf55'; });
}

/* ===================== Strategy & Traps ===================== */

/* ===================== Grammar Lab ===================== */
function glabCount(g){ return g.items ? g.items.length : (g.passages||[]).reduce((n,p)=>n+(p.items||[]).length,0); }
function renderGrammarList(){
  const gs = manifestContent('grammar').map(c=>(window.PARALEX_GLAB||{})[c.id]).filter(Boolean);
  const all = gs.length?gs:Object.values(window.PARALEX_GLAB||{});
  let h = `<div class="wrap"><div class="h-title">Grammar Lab</div>
    <div class="h-sub">Part 5(단문 빈칸)·Part 6(장문 빈칸)의 문법·어법·어휘 문제. 독해(Workbench)와 별도 트랙.</div>`;
  if(!all.length){ h += `<div class="kv" style="color:#64748b">문법 세트 준비 중.</div></div>`; return h; }
  h += all.map(g=>{ var tot=glabCount(g), rn=readGet('grammar',g.id);
    return `<button class="set-row" onclick="setState({view:'grammar',glabId:'${g.id}'})">
      <div class="set-ic biz"><i class="fa-solid fa-spell-check"></i></div>
      <div style="flex:1;min-width:0"><div style="font-weight:700;color:#f1f5f9;font-size:14.5px">${esc(g.title)}${rn>0?` <span style="color:#10b981;font-size:11px;font-weight:800">${rn}회독</span>`:''}</div>
      <div style="font-size:11.5px;color:#94a3b8;margin-top:3px">${(g.partFocus||[]).join('·')} · ${tot}문항</div></div>
      <div class="pill pill-orig">${esc(g.scoreBandTarget||'')}</div></button>`;
  }).join('');
  h += `<div class="disc">⚠️ 자체작성 연습문제(practice). 정답 유일성·문법 정확성은 박사 검수 후 확정됩니다.</div></div>`;
  return h;
}
function renderGItem(glabId, it, pid){
  const key = pid ? `${pid}-${it.no}` : `g${it.no}`;
  const rv = S.greveal[key];
  const ans = (it.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const stemHtml = it.sentence
    ? esc(it.sentence).replace(/_{2,}/, '<b style="color:#2dd4bf">_____</b>')
    : `<span style="color:#94a3b8">빈칸 ${esc(String(it.blankId||it.no))}${it.questionType==='sentence_insertion'?' · 문장 삽입':''}</span>`;
  const choices = (it.choices||[]).map((c,ci)=>{ const lab=c.label||LAB[ci]; let cls='q-choice';
    if(rv){ if(ans.includes(lab))cls+=' correct'; else if(rv===lab)cls+=' wrong'; }
    return `<button class="${cls}" onclick="answerGrammar('${glabId}','${key}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(rv){ const dr=(it.distractorRationales||[]).find(d=>d.label===rv);
    exp = `${dr?`<div class="q-dr"><b>오답 [${esc(rv)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}
      <div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b> · <span style="color:#7dd3fc">${esc(it.grammarPoint||'')}</span><br>${esc(it.explanation||'')}${it.trapNote?`<br><span style="color:#fcd34d">함정: ${esc(it.trapNote)}</span>`:''}</div>`;
  }
  return `<div class="q-card"><div class="q-stem">${it.no}. ${stemHtml}</div>${choices}${exp}</div>`;
}
function renderGrammar(id){
  const g=(window.PARALEX_GLAB||{})[id];
  if(!g) return `<div class="wrap"><div class="empty">세트를 찾을 수 없습니다.</div></div>`;
  let body;
  if(g.items){ body = g.items.map(it=>renderGItem(id,it,null)).join(''); }
  else if(g.passages){ body = g.passages.map(p=>`<div class="sec-h"><i class="fa-solid fa-file-lines"></i>${esc(p.label||'')}</div><div class="para-p">${esc(p.text||'')}</div>${(p.items||[]).map(it=>renderGItem(id,it,p.pid)).join('')}`).join(''); }
  else body='';
  return `<div class="wrap"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-ghost" onclick="setState({view:'grammar',glabId:null})"><i class="fa-solid fa-arrow-left"></i> 목록</button>${readStamps('grammar', g.id)}</div>
    <div class="card" style="margin-top:14px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill pill-biz">${(g.partFocus||[]).join('·')}</span><span class="pill pill-orig">${esc(g.scoreBandTarget||'')}</span></div>
    <div class="h-title" style="margin-top:10px;font-size:19px">${esc(g.title)}</div></div>
    ${body}<div style="margin-top:18px;text-align:center">${readStamps('grammar', g.id)}</div><div class="disc">자체작성 연습문제 — 점수는 기록하지 않습니다. 다 풀었으면 1회독을 체크하세요.</div></div>`;
}
function answerGrammar(glabId,key,lab){ if(S.greveal[key]) return; S.greveal[key]=lab; render(); }

/* ===================== Vocab Deck — 30 한눈에 그리드 + 왼쪽 세로 레일 ===================== */
function tagFull(t){ return ({NGSL:'New General Service List · 일상 고빈도어',NGSL2k:'NGSL 상위 2천 · 일상 고빈도어',TSL:'TOEIC Service List · 토익 빈출어',BSL:'Business Service List · 비즈니스 빈출어',NAWL:'New Academic Word List · 학술 빈출어'}[t]||t); }
function ptCls(t){ return t==='용법'?'u':(t==='문법'?'g':'x'); }
function vRevealCard(day,id){ S.vocabReveal[id]=!S.vocabReveal[id]; render(); }
function vRevealAll(day){ S.vocabRevealAll=!S.vocabRevealAll; render(); }

        <div style="padding-right:32px"><span class="vg-lem">${esc(c.lemma)}</span><span class="vg-pos">${esc(c.pos||'')}</span><span class="vtag" title="${esc(tagFull(c.listTag))}">${esc(c.listTag||'')}</span></div>

        ${!c.example&&c.collocation?`<div class="vg-ex">▪ ${esc(c.collocation)}</div>`:''}
        ${c.gp?`<div class="vg-gp"><span class="vg-form"><i class="fa-solid fa-sitemap" style="font-size:9px"></i>${esc(c.gp.form)}</span>${(c.gp.points||[]).map(p=>`<div class="vg-pt"><span class="vg-pt-t ${ptCls(p.t)}">${esc(p.t)}</span><span class="vg-pt-d">${esc(p.d)}</span></div>`).join('')}</div>`:''}

    <details class="vlegend"><summary><i class="fa-solid fa-circle-info"></i> 리스트 태그(NGSL·TSL·BSL·NAWL)란?</summary>
      <div style="margin-top:7px;line-height:1.75">빈도 연구 기반 영어 단어 목록입니다 — 이 단어가 어떤 목록에 속하는지 보여줘요.<br>

      • <b style="color:#a5b4fc">TSL</b> (TOEIC Service List): 토익에 특히 자주 나오는 단어(약 1,200).<br>
      • <b style="color:#a5b4fc">BSL</b> (Business Service List): 비즈니스 영어 빈출어.<br>
      • <b style="color:#a5b4fc">NAWL</b> (New Academic Word List): 학술 영어 빈출어.</div>
    </details>
    <div class="vlayout">
      <div class="vrail">${rail}</div>
      <div class="vmain">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div><span style="color:#f1f5f9;font-size:16px;font-weight:800">Day ${d.day}</span> <span style="color:#94a3b8;font-size:12.5px">${esc(d.title||'')}</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${readStamps('vocab', d.day)}<button class="btn" onclick="vRevealAll(${d.day})">${showAll?'전체 뜻 가리기':'전체 뜻 보기'}</button></div>
        </div>
        ${seg('A',0,10)}${seg('B',10,20)}${seg('C',20,30)}
        <div class="disc">셀프테스트: '전체 뜻 가리기'에서 lemma만 보고 뜻을 떠올린 뒤 카드 우상단 <i class="fa-solid fa-eye"></i> 버튼으로 확인하세요. 예문 아래 <b>용법</b>(이 단어는 이렇게 쓴다)·<b>문법</b>(예문 속 구조)·<b>출제</b>(토익이 속이는 방식)까지 읽으면 어휘와 Part 5·6 어법이 같이 늘어요. 다 익혔으면 회독을 체크하세요.</div>

/* ===================== boot + dynamic loader ===================== */
function boot(){
  try{
    const q=new URLSearchParams(location.search);
    const v=q.get('view'); if(['today','guide','concept','workbench','strategy','vocab','grammar'].includes(v)) S.view=v;
    const sid=q.get('set'); if(sid && getSet(sid)){ S.view='workbench'; S.setId=sid; }
  }catch(e){}
  if(window.PARALEX_VOCAB_DAYS&&window.PARALEX_VOCAB_DAYS.sort) window.PARALEX_VOCAB_DAYS.sort((a,b)=>(a.day||0)-(b.day||0));
  render();
}
/* ★Codex R3 락: classic <script> 주입(ES module/fetch 금지 → file:// 호환). async=false로 실행 순서 보장. */
(function loadContent(){
  var m=window.PARALEX_MANIFEST;
  var files=(m&&m.content)? m.content.map(c=>c.file) : [];
  var total=files.length, settled=0;
  if(!total){ boot(); return; }
  function done(){ settled++; if(settled>=total) boot(); }
  files.forEach(function(f){
    var sc=document.createElement('script'); sc.src=f; sc.async=false;
    sc.onload=done; sc.onerror=function(){ console.warn('[Paralex] content load 실패:', f); done(); };
    document.head.appendChild(sc);
  });
})();
</script>
