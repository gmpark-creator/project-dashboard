<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; }
  body{ background:#0b1020; color:#e2e8f0;
    font-family:'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif; line-height:1.6; word-break:keep-all; }
  a{ color:#38bdf8; }
  button{ cursor:pointer; font-family:inherit; color:inherit; }
  /* layout */
  #appLayout{ display:flex; min-height:100vh; }
  #sidebar{ width:236px; min-width:236px; background:#070b18; border-right:1px solid #1e293b;
    position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; }
  #root{ flex:1; min-width:0; overflow-x:hidden; padding:26px 30px 80px; }
  .wrap{ max-width:920px; margin:0 auto; }
  .sb-logo{ padding:18px 16px 12px; border-bottom:1px solid #1e293b; }
  .sb-brand{ font-size:17px; font-weight:800; color:#fff; letter-spacing:.02em; }
  .sb-brand .x{ color:#2dd4bf; }
  .sb-tag{ font-size:10px; color:#64748b; margin-top:3px; letter-spacing:.04em; }
  .sb-label{ font-size:10px; font-weight:700; color:#475569; letter-spacing:.1em; text-transform:uppercase; padding:14px 14px 5px; }
  .sb-item{ width:100%; text-align:left; padding:9px 14px; border:none; background:transparent; color:#94a3b8;
    font-size:13.5px; display:flex; align-items:center; gap:9px; line-height:1.3; transition:background .12s,color .12s; }
  .sb-item:hover{ background:#111a2e; color:#e2e8f0; }
  .sb-item.on{ background:#111a2e; color:#2dd4bf; box-shadow:inset 3px 0 0 #2dd4bf; }
  .sb-foot{ margin-top:auto; padding:14px; border-top:1px solid #1e293b; font-size:9.5px; color:#475569; line-height:1.5; }
  /* cards */
  .card{ background:#111a2e; border:1px solid #243049; border-radius:16px; padding:22px; }
  .h-title{ font-size:22px; font-weight:800; color:#f1f5f9; }
  .h-sub{ font-size:13px; color:#94a3b8; margin-top:6px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; letter-spacing:.02em; }
  .pill-news{ color:#7dd3fc; background:#082f49; border:1px solid #0ea5e955; }
  .pill-biz{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-orig{ color:#cbd5e1; background:#1e293b; border:1px solid #475569; }
  .pill-para{ color:#5eead4; background:#042f2a; border:1px solid #2dd4bf55; }
  .pill-band{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-cap{ color:#c4b5fd; background:#1e1b4b; border:1px solid #6d28d966; }
  .doc-head{ font-size:11.5px; font-weight:800; color:#7dd3fc; margin:16px 0 5px; display:flex; align-items:center; gap:6px; }
  /* set list */
  .set-row{ display:flex; align-items:center; gap:14px; padding:16px 18px; background:#111a2e; border:1px solid #243049;
    border-radius:14px; margin-bottom:11px; text-align:left; width:100%; transition:border-color .12s, transform .08s; }
  .set-row:hover{ border-color:#2dd4bf66; transform:translateY(-1px); }
  .set-ic{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .set-ic.news{ background:#082f49; color:#7dd3fc; }
  .set-ic.biz{ background:#2a1a04; color:#fcd34d; }
  /* passage */
  .para-p{ background:#0d1424; border:1px solid #243049; border-radius:11px; padding:13px 16px; margin-top:10px; line-height:1.85; font-size:14.5px; color:#dbe4f0; }
  .fn-tag{ font-size:9.5px; font-weight:800; color:#94a3b8; background:#1e293b; border:1px solid #334155; border-radius:5px; padding:1px 7px; margin-right:8px; vertical-align:middle; }
  .ev-hi{ background:#042f2a; box-shadow:0 0 0 2px #2dd4bf55; border-radius:4px; padding:0 2px; }
  /* 직독직해 */
  .ck-en-inline{ color:#dbe4f0; }
  .sl{ color:#2dd4bf; font-weight:800; margin:0 3px; }
  .ck-row{ border-left:2px solid #2dd4bf44; padding:5px 0 5px 13px; margin:9px 0; }
  .ck-en{ color:#f1f5f9; font-size:14px; font-weight:600; line-height:1.5; }
  .ck-ko{ color:#5eead4; font-size:13px; margin-top:3px; line-height:1.55; }
  .ck-note{ color:#94a3b8; font-size:11px; margin-left:8px; background:#0b1020; border:1px solid #334155; border-radius:5px; padding:1px 7px; white-space:nowrap; }
  /* sections */
  .sec-h{ font-size:13px; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:7px; margin:24px 0 8px; }
  .sec-h i{ color:#2dd4bf; }
  .kv{ background:#0d1424; border:1px solid #243049; border-radius:9px; padding:10px 13px; font-size:13px; margin-top:7px; }
  .kv .en{ color:#f1f5f9; font-weight:600; }
  .kv .ko{ color:#94a3b8; font-size:12px; margin-top:2px; }
  .kv .meta{ color:#64748b; font-size:11px; margin-top:3px; }
  .vtag{ font-size:9px; font-weight:800; padding:1px 6px; border-radius:5px; color:#a5b4fc; background:#1e1b4b; border:1px solid #4338ca66; margin-left:6px; }
  /* paraphrase */
  .pp{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; background:#0d1424; border:1px solid #243049; border-radius:9px; padding:11px 13px; margin-top:7px; }
  .pp .orig{ color:#cbd5e1; font-size:13px; }
  .pp .arr{ color:#2dd4bf; font-size:13px; }
  .pp .par{ color:#5eead4; font-size:13px; font-weight:600; }
  .pp.hide .par{ filter:blur(5px); user-select:none; }
  /* questions */
  .q-card{ background:#0d1424; border:1px solid #243049; border-radius:13px; padding:18px; margin-top:12px; }
  .q-stem{ font-size:14px; font-weight:700; color:#f1f5f9; line-height:1.6; }
  .q-choice{ width:100%; text-align:left; padding:10px 14px; border-radius:9px; font-size:13px; color:#cbd5e1;
    border:1px solid #243049; background:#0b1020; display:flex; gap:9px; line-height:1.5; margin-top:7px; transition:border-color .12s,background .12s; }
  .q-choice:hover{ border-color:#475569; }
  .q-choice.correct{ border-color:#10b981; background:#052e1a; color:#6ee7b7; font-weight:700; }
  .q-choice.wrong{ border-color:#f43f5e; background:#2a0e12; color:#fda4af; }
  .q-lab{ font-weight:800; color:#64748b; }
  .q-exp{ background:#0a1f16; border:1px solid #10b98144; border-radius:9px; padding:11px 14px; font-size:12.5px; color:#86efac; line-height:1.65; margin-top:9px; }
  .q-dr{ background:#1a1206; border:1px solid #f59e0b33; border-radius:9px; padding:10px 13px; font-size:12px; color:#fcd34d; line-height:1.6; margin-top:7px; }
  .q-dr b{ color:#fde68a; }
  /* misc */
  .btn{ padding:8px 16px; border-radius:9px; font-size:12.5px; font-weight:700; border:1px solid #2dd4bf55; background:#042f2a; color:#5eead4; transition:background .12s; }
  .btn:hover{ background:#063f38; }
  .btn-ghost{ border-color:#334155; background:#111a2e; color:#94a3b8; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; color:#2dd4bf; font-size:15px; }
  .empty{ text-align:center; color:#64748b; padding:60px 20px; font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat-box{ background:#0d1424; border:1px solid #243049; border-radius:12px; padding:15px; }
  .stat-n{ font-size:26px; font-weight:800; color:#2dd4bf; }
  .stat-l{ font-size:11px; color:#94a3b8; margin-top:3px; }
  .disc{ font-size:10px; color:#475569; margin-top:18px; line-height:1.6; border-top:1px solid #1e293b; padding-top:12px; }
</style>
</head>
<body>
<div id="appLayout">
  <aside id="sidebar">
    <div class="sb-logo">
      <div class="sb-brand">Para<span class="x">lex</span></div>
      <div class="sb-tag">읽은 영어 → TOEIC® 950 cockpit</div>

    <div class="sb-label">학습</div>
    <button class="sb-item" data-view="workbench" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-dumbbell w-4 text-center"></i>Reading Workbench</button>
    <button class="sb-item" data-view="dashboard" onclick="setState({view:'dashboard'})"><i class="fa-solid fa-chart-line w-4 text-center"></i>Score Dashboard</button>
    <button class="sb-item" data-view="strategy" onclick="setState({view:'strategy'})"><i class="fa-solid fa-chess-knight w-4 text-center"></i>Strategy &amp; Traps</button>

    <button class="sb-item" data-view="vocab" onclick="setState({view:'vocab'})"><i class="fa-solid fa-layer-group w-4 text-center"></i>Vocab Deck</button>

      <a href="mobile/" style="color:#2dd4bf;font-size:11px;font-weight:700"><i class="fa-solid fa-mobile-screen"></i> 모바일로 열기</a>

  </aside>
  <div id="root"></div>

<script>
/* ===== Paralex viewer engine (무빌드 단일HTML · self-register registry · localStorage) ===== */
window.PARALEX_SETS = window.PARALEX_SETS || {};

/* --- helpers --- */
const $ = (id)=>document.getElementById(id);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB = ['A','B','C','D','E'];
const BANDS = ['750-800','800-850','850-900','900-950','950+'];
function emptyBucket(){ return {attempts:0,correct:0,wrong:0,tags:{},skills:{}}; }

/* --- state --- */
const S = Object.assign({ view:'workbench', setId:null, reveal:{}, ppHide:true, showGloss:false, glabId:null, greveal:{}, vocabDay:null, vocabIdx:0, vocabReveal:false }, loadState());
function loadState(){ try{ return JSON.parse(localStorage.getItem('paralex-state'))||{}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem('paralex-state', JSON.stringify({view:S.view,setId:S.setId})); }catch(e){} }
function setState(patch){ Object.assign(S, patch); if(patch.setId!==undefined){ S.reveal={}; S.ppHide=true; } if(patch.glabId!==undefined){ S.greveal={}; } saveState(); render(); }

/* --- stats (오답통계) --- */
function loadStats(){ try{ const s=JSON.parse(localStorage.getItem('paralex-stats')); if(!s||!s.official) return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; return s; }catch(e){ return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; } }
function saveStats(st){ try{ localStorage.setItem('paralex-stats', JSON.stringify(st)); }catch(e){} }
function recordAnswer(setId, qno, picked, correct, drType, skillFocus){
  const set=getSet(setId);
  // 버킷은 세트에서 파생(외부 인자 불신) — human.pass===true면 official, 아니면 practice
  const bucket=(set&&set.reviewGates&&set.reviewGates.human&&set.reviewGates.human.pass===true)?'official':'practice';
  const st=loadStats(); const b=st[bucket]||(st[bucket]=emptyBucket());
  b.attempts++; if(correct){ b.correct++; } else { b.wrong++; if(drType){ b.tags[drType]=(b.tags[drType]||0)+1; } }
  (skillFocus||[]).forEach(sk=>{ b.skills[sk]=b.skills[sk]||{a:0,c:0}; b.skills[sk].a++; if(correct)b.skills[sk].c++; });
  st.bySet[setId]=st.bySet[setId]||{a:0,c:0}; st.bySet[setId].a++; if(correct)st.bySet[setId].c++;
  saveStats(st);
}

/* --- registry access --- */
function allSets(){ return Object.values(window.PARALEX_SETS); }
function getSet(id){ return window.PARALEX_SETS[id] || null; }
function setsByTrack(track){ return allSets().filter(s=>s.track===track); }

/* --- render dispatch --- */
function render(){
  document.querySelectorAll('.sb-item').forEach(b=> b.classList.toggle('on', b.dataset.view===S.view));
  const r = $('root');
  if(S.view==='workbench') r.innerHTML = S.setId ? renderSet(S.setId) : renderWorkbenchList();
  else if(S.view==='dashboard') r.innerHTML = renderDashboard();
  else if(S.view==='strategy') r.innerHTML = renderStrategy();
  else if(S.view==='grammar') r.innerHTML = S.glabId ? renderGrammar(S.glabId) : renderGrammarList();
  else if(S.view==='vocab') r.innerHTML = renderVocab();
  else r.innerHTML = renderWorkbenchList();
  if(S.view==='workbench' && S.setId) startTimer();
}

/* --- Reading Workbench: list --- */
function trackBlock(track, title, icon, cls){
  const sets = setsByTrack(track);
  let h = `<div class="sec-h"><i class="fa-solid ${icon}"></i>${title} <span class="pill pill-${cls}" style="margin-left:6px">${sets.length}세트</span></div>`;
  if(!sets.length){ h += `<div class="kv" style="color:#64748b">아직 세트가 없습니다.</div>`; return h; }
  h += sets.map(s=>{
    const st = loadStats().bySet[s.id];
    const prog = st ? ` · 정답 ${st.c}/${st.a}` : '';
    return `<button class="set-row" onclick="setState({view:'workbench',setId:'${s.id}'})">
      <div class="set-ic ${cls}"><i class="fa-solid ${icon}"></i></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:#f1f5f9;font-size:14.5px">${esc(s.title)}</div>
        <div style="font-size:11.5px;color:#94a3b8;margin-top:3px">${esc(s.genre)} · ${s.wordCount||'?'}단어 · 목표 ${Math.round((s.targetTimeSec||0)/60)}분${prog}</div>
      </div>
      <div class="pill pill-orig">${esc(s.license)}</div>
    </button>`;
  }).join('');
  return h;
}
function renderWorkbenchList(){
  return `<div class="wrap">
    <div class="h-title">Reading Workbench</div>
    <div class="h-sub">실제 영어를 <b style="color:#2dd4bf">정밀 독해 근육</b>으로, 비즈니스 지문을 <b style="color:#f59e0b">토익 전이</b>로 — 두 트랙을 분리해 훈련한다.</div>
    ${trackBlock('news','Authentic News (독해 근육)','fa-newspaper','news')}
    ${trackBlock('business','TOEIC-like Business RC (전이 장치)','fa-briefcase','biz')}
    <div class="disc">⚠️ MVP는 950 완성판이 아니라 <b>제품 검증용</b>입니다. 세트는 6게이트(Legal·Originality·Answerability·Distractor·TOEIC-likeness·Human) 검수 후 정식 반영됩니다.</div>
  </div>`;
}

/* --- Reading Workbench: single set --- */
let _timerInt=null, _timerSec=0;
function startTimer(){ clearInterval(_timerInt); _timerSec=0; _timerInt=setInterval(()=>{ _timerSec++; const el=$('pxTimer'); if(!el){clearInterval(_timerInt);return;} const m=String(Math.floor(_timerSec/60)).padStart(2,'0'),s=String(_timerSec%60).padStart(2,'0'); el.textContent=`${m}:${s}`; },1000); }

function renderSet(id){
  const set = getSet(id);
  if(!set) return `<div class="wrap"><div class="empty">세트를 찾을 수 없습니다.</div></div>`;
  const trackCls = set.track==='news'?'news':'biz';
  const trackLabel = set.track==='news'?'Authentic News':'Business RC';
  // passage with evidence highlight handled per-question on reveal; base render plain
  const showG = !!S.showGloss;
  const docs = (set.passage&&set.passage.documents) || [{id:'d1',label:'',paragraphs:(set.passage&&set.passage.paragraphs)||[]}];
  const renderPara = (p)=>{
    const chunks = p.chunks || [];
    let inner;
    if(showG){
      inner = chunks.map(c=>`<div class="ck-row"><div class="ck-en">${esc(c.en)} <span class="sl">/</span></div><div class="ck-ko">${esc(c.ko)}${c.note?`<span class="ck-note">${esc(c.note)}</span>`:''}</div></div>`).join('');
    } else {
      inner = chunks.map(c=>`<span class="ck-en-inline">${esc(c.en)}</span>`).join(' ');
    }
    return `<div class="para-p" id="span-${esc(p.id)}"><span class="fn-tag">${esc(p.functionLabel||'')}</span>${inner}</div>`;
  };
  const paras = docs.map(d=>{
    const head = (docs.length>1 && d.label) ? `<div class="doc-head"><i class="fa-solid fa-file-lines"></i> ${esc(d.label)}</div>` : '';
    return head + (d.paragraphs||[]).map(renderPara).join('');
  }).join('');
  const keyS = (set.keyStructures||[]).map(k=>`<div class="kv"><div class="en">${esc(k.span)}</div><div class="ko">${esc(k.note)}</div></div>`).join('');
  const vocab = (set.vocabulary||[]).map(v=>`<div class="kv"><div class="en">${esc(v.lemma)} <span style="color:#64748b;font-size:11px">${esc(v.pos||'')}</span><span class="vtag">${esc(v.listTag||'')}</span></div><div class="ko">${esc(v.glossKo)}</div>${v.collocation?`<div class="meta">▪ ${esc(v.collocation)}</div>`:''}</div>`).join('');
  const pps = (set.paraphrases||[]).map(p=>`<div class="pp ${S.ppHide?'hide':''}"><div class="orig">${esc(p.original)}</div><div class="arr"><i class="fa-solid fa-arrow-right-arrow-left"></i></div><div class="par">${esc(p.paraphrase)}</div></div>`).join('');
  const qs = (set.questions||[]).map((q,qi)=> renderQuestion(set,q,qi)).join('');
  const refl = (set.reflectionPrompts||[]).map(r=>`<div class="kv" style="color:#cbd5e1">🤔 ${esc(r)}</div>`).join('');

  return `<div class="wrap">
    <button class="btn btn-ghost" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-arrow-left"></i> 목록</button>
    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="pill pill-${trackCls}">${trackLabel}</span>
        ${set.scoreBandTarget?`<span class="pill pill-band">🎯 ${esc(set.scoreBandTarget)}</span>`:''}
        <span class="pill pill-orig">${esc(set.genre)}</span>
        ${(set.partFocus||[]).map(p=>`<span class="pill pill-orig">${esc(p)}</span>`).join('')}

function renderQuestion(set,q,qi){
  const revealed = S.reveal[q.no];
  const ans = (q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a); // 'B' 또는 2
  const choices = (q.choices||[]).map((c,ci)=>{
    const lab = c.label || LAB[ci];
    let cls='q-choice';
    if(revealed){
      if(ans.includes(lab)) cls+=' correct';
      else if(revealed===lab) cls+=' wrong';
    }
    return `<button class="${cls}" onclick="answerQ('${set.id}','${q.no}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(revealed){
    const picked = revealed===true?null:revealed;
    const dr = (q.distractorRationales||[]).find(d=>d.label===picked);
    const evid = (q.evidenceSpanIds||[]).join(', ');
    exp = `${dr?`<div class="q-dr"><b>오답 [${esc(picked)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}
      <div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b>${evid?` · 근거 ${esc(evid)}`:''}<br>${esc(q.explanation)}</div>`;
  }
  return `<div class="q-card"><div class="q-stem">${q.no}. ${esc(q.stem)}</div>${choices}${exp}</div>`;
}

function answerQ(setId,qno,lab){
  const set=getSet(setId); const q=(set.questions||[]).find(x=>String(x.no)===String(qno));
  const ans=(q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const correct=ans.includes(lab);
  if(S.reveal[qno]) return; // 1회만 기록
  S.reveal[qno]=lab;
  const dr=(q.distractorRationales||[]).find(d=>d.label===lab);
  recordAnswer(setId,qno,lab,correct, correct?null:(dr?dr.type:'unknown'), q.skillFocus);
  // evidence highlight
  render();
  (q.evidenceSpanIds||[]).forEach(sid=>{ const el=$('span-'+sid); if(el) el.style.boxShadow='0 0 0 2px #2dd4bf55'; });
}

function renderGItem(glabId, it, pid){
  const key = pid ? `${pid}-${it.no}` : `g${it.no}`;
  const rv = S.greveal[key];
  const ans = (it.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const stemHtml = it.sentence
    ? esc(it.sentence).replace(/_{2,}/, '<b style="color:#2dd4bf">_____</b>')
    : `<span style="color:#94a3b8">빈칸 ${esc(String(it.blankId||it.no))}${it.questionType==='sentence_insertion'?' · 문장 삽입':''}</span>`;
  const choices = (it.choices||[]).map((c,ci)=>{ const lab=c.label||LAB[ci]; let cls='q-choice';
    if(rv){ if(ans.includes(lab))cls+=' correct'; else if(rv===lab)cls+=' wrong'; }
    return `<button class="${cls}" onclick="answerGrammar('${glabId}','${key}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(rv){ const dr=(it.distractorRationales||[]).find(d=>d.label===rv);

/* --- Vocab Deck (Day 단위 · Leitner SRS) --- */
function vLoad(){ try{ return JSON.parse(localStorage.getItem('paralex-vocab-progress-v1'))||{cards:{},days:{}}; }catch(e){ return {cards:{},days:{}}; } }
function vSave(p){ try{ localStorage.setItem('paralex-vocab-progress-v1', JSON.stringify(p)); }catch(e){} }
function vRate(id, rating){
  const p=vLoad(); const c=p.cards[id]||(p.cards[id]={box:0,seen:0,correct:0,wrong:0,lastRating:null});
  c.seen++; c.lastRating=rating;
  if(rating==='again'){ c.box=1; c.wrong++; }
  else if(rating==='hard'){ c.box=Math.max(1,c.box||0); c.correct++; }
  else if(rating==='good'){ c.box=Math.min(5,(c.box||0)+1); c.correct++; }
  else if(rating==='easy'){ c.box=Math.min(5,(c.box||0)+2); c.correct++; }
  vSave(p);
}
function vStatus(id){ const c=vLoad().cards[id]; if(!c||!c.seen) return 'new'; if(c.box>=4) return 'mastered'; return 'learning'; }
function vNext(rating){
  const d=(window.PARALEX_VOCAB_DAYS||[]).find(x=>x.day===S.vocabDay); if(!d) return;
  const c=(d.cards||[])[S.vocabIdx]; if(c) vRate(c.id, rating);
  if(S.vocabIdx+1 >= (d.cards||[]).length){ setState({vocabDay:null, vocabIdx:0, vocabReveal:false}); }
  else { setState({vocabIdx:S.vocabIdx+1, vocabReveal:false}); }
}

        <div style="font-size:11.5px;color:#94a3b8;margin-top:3px">${cards.length}단어 · <span style="color:#7dd3fc">new ${nw}</span> · learning ${lr} · <span style="color:#6ee7b7">mastered ${ms}</span></div></div>
        <i class="fa-solid fa-chevron-right" style="color:#475569"></i></button>`;
    }).join('');
    return `<div class="wrap"><div class="h-title">Vocab Deck — Day별 학습</div>
      <div class="h-sub">하루 30단어씩, Leitner 간격반복(Again/Hard/Good/Easy). NGSL·TSL·BSL·NAWL 기반.</div>
      ${rows}<div class="disc">평가는 브라우저(localStorage)에 저장됩니다. Good/Easy로 박스가 오르고 box 4↑면 mastered.</div></div>`;
  }
  const d = days.find(x=>x.day===S.vocabDay); if(!d){ S.vocabDay=null; return renderVocab(); }
  const cards = d.cards||[]; const idx = Math.min(S.vocabIdx, cards.length-1); const c = cards[idx];

    <div style="color:#64748b;font-size:12px;margin-top:6px">${esc(c.pos||'')} <span class="vtag">${esc(c.listTag||'')}</span>${(c.tags||[]).map(t=>`<span class="vtag" style="color:#fcd34d;background:#2a1a04;border-color:#f59e0b55">${esc(t)}</span>`).join('')}</div>`;
  const back = S.vocabReveal

       ${c.example?`<div style="color:#cbd5e1;font-size:13px;margin-top:8px;font-style:italic">"${esc(c.example)}"</div>`:''}`
    : `<div style="margin-top:24px"><button class="btn" onclick="setState({vocabReveal:true})">뜻 보기</button></div>`;
  const rate = S.vocabReveal
    ? `<div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center">
       <button class="btn btn-ghost" onclick="vNext('again')">Again</button>
       <button class="btn btn-ghost" onclick="vNext('hard')">Hard</button>
       <button class="btn" onclick="vNext('good')">Good</button>
       <button class="btn" onclick="vNext('easy')">Easy</button></div>` : '';
  return `<div class="wrap"><button class="btn btn-ghost" onclick="setState({vocabDay:null})"><i class="fa-solid fa-arrow-left"></i> Day 목록</button>

    <div class="card" style="margin-top:8px;text-align:center;padding:40px 22px">${front}${back}${rate}</div></div>`;
}

(function boot(){
  const q=new URLSearchParams(location.search);
  const v=q.get('view'); if(['workbench','dashboard','strategy','vocab'].includes(v)) S.view=v;
  const sid=q.get('set'); if(sid && getSet(sid)){ S.view='workbench'; S.setId=sid; }
  render();
})();
