<!doctype html>
<html lang="ko" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralex · TOEIC® RC 대비 cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        base:  '#0b1020',
        para:  '#2dd4bf',   // paraphrase = teal
        lex:   '#818cf8',   // lexis = indigo
        news:  '#38bdf8',   // news track = sky
        biz:   '#f59e0b',   // business track = amber
      },
      fontFamily: { sans: ['Pretendard','-apple-system','Segoe UI','Malgun Gothic','sans-serif'] }
    }}
  };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- ★Codex R3 락: file:// 지원 위해 ES module/fetch 금지. classic script 전역만. -->
<!-- 단일 소스 + 앱 데이터(정적 로드) -->
<script src="data/manifest.js"></script>
<script src="data/guide.js"></script>
<script src="data/strategy-seed.js"></script>
<!-- 콘텐츠(reading/grammar/vocab)는 manifest.content[]를 읽어 아래 loader가 동적 주입 -->
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; }
  body{ background:#0b1020; color:#e2e8f0;
    font-family:'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif; line-height:1.6; word-break:keep-all; }
  a{ color:#38bdf8; }
  button{ cursor:pointer; font-family:inherit; color:inherit; }
  /* layout */
  #appLayout{ display:flex; min-height:100vh; }
  #sidebar{ width:236px; min-width:236px; background:#070b18; border-right:1px solid #1e293b;
    position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; }
  #root{ flex:1; min-width:0; overflow-x:hidden; padding:26px 30px 80px; }
  .wrap{ max-width:920px; margin:0 auto; }
  .sb-logo{ padding:18px 16px 12px; border-bottom:1px solid #1e293b; }
  .sb-brand{ font-size:17px; font-weight:800; color:#fff; letter-spacing:.02em; }
  .sb-brand .x{ color:#2dd4bf; }
  .sb-tag{ font-size:10px; color:#64748b; margin-top:3px; letter-spacing:.04em; }
  .sb-label{ font-size:10px; font-weight:700; color:#475569; letter-spacing:.1em; text-transform:uppercase; padding:14px 14px 5px; }
  .sb-item{ width:100%; text-align:left; padding:9px 14px; border:none; background:transparent; color:#94a3b8;
    font-size:13.5px; display:flex; align-items:center; gap:9px; line-height:1.3; transition:background .12s,color .12s; }
  .sb-item:hover{ background:#111a2e; color:#e2e8f0; }
  .sb-item.on{ background:#111a2e; color:#2dd4bf; box-shadow:inset 3px 0 0 #2dd4bf; }
  .sb-foot{ margin-top:auto; padding:14px; border-top:1px solid #1e293b; font-size:9.5px; color:#475569; line-height:1.5; }
  /* cards */
  .card{ background:#111a2e; border:1px solid #243049; border-radius:16px; padding:22px; }
  .h-title{ font-size:22px; font-weight:800; color:#f1f5f9; }
  .h-sub{ font-size:13px; color:#94a3b8; margin-top:6px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; letter-spacing:.02em; }
  .pill-news{ color:#7dd3fc; background:#082f49; border:1px solid #0ea5e955; }
  .pill-biz{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-orig{ color:#cbd5e1; background:#1e293b; border:1px solid #475569; }
  .pill-para{ color:#5eead4; background:#042f2a; border:1px solid #2dd4bf55; }
  .pill-band{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-cap{ color:#c4b5fd; background:#1e1b4b; border:1px solid #6d28d966; }
  .doc-head{ font-size:11.5px; font-weight:800; color:#7dd3fc; margin:16px 0 5px; display:flex; align-items:center; gap:6px; }
  /* set list */
  .set-row{ display:flex; align-items:center; gap:14px; padding:16px 18px; background:#111a2e; border:1px solid #243049;
    border-radius:14px; margin-bottom:11px; text-align:left; width:100%; transition:border-color .12s, transform .08s; }
  .set-row:hover{ border-color:#2dd4bf66; transform:translateY(-1px); }
  .set-ic{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .set-ic.news{ background:#082f49; color:#7dd3fc; }
  .set-ic.biz{ background:#2a1a04; color:#fcd34d; }
  /* passage */
  .para-p{ background:#0d1424; border:1px solid #243049; border-radius:11px; padding:13px 16px; margin-top:10px; line-height:1.85; font-size:14.5px; color:#dbe4f0; }
  .fn-tag{ font-size:9.5px; font-weight:800; color:#94a3b8; background:#1e293b; border:1px solid #334155; border-radius:5px; padding:1px 7px; margin-right:8px; vertical-align:middle; }
  .ev-hi{ background:#042f2a; box-shadow:0 0 0 2px #2dd4bf55; border-radius:4px; padding:0 2px; }
  /* 직독직해 */
  .ck-en-inline{ color:#dbe4f0; }
  .sl{ color:#2dd4bf; font-weight:800; margin:0 3px; }
  .ck-row{ border-left:2px solid #2dd4bf44; padding:5px 0 5px 13px; margin:9px 0; }
  .ck-en{ color:#f1f5f9; font-size:14px; font-weight:600; line-height:1.5; }
  .ck-ko{ color:#5eead4; font-size:13px; margin-top:3px; line-height:1.55; }
  .ck-note{ color:#94a3b8; font-size:11px; margin-left:8px; background:#0b1020; border:1px solid #334155; border-radius:5px; padding:1px 7px; white-space:nowrap; }
  /* sections */
  .sec-h{ font-size:13px; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:7px; margin:24px 0 8px; }
  .sec-h i{ color:#2dd4bf; }
  .kv{ background:#0d1424; border:1px solid #243049; border-radius:9px; padding:10px 13px; font-size:13px; margin-top:7px; }
  .kv .en{ color:#f1f5f9; font-weight:600; }
  .kv .ko{ color:#94a3b8; font-size:12px; margin-top:2px; }
  .kv .meta{ color:#64748b; font-size:11px; margin-top:3px; }
  .vtag{ font-size:9px; font-weight:800; padding:1px 6px; border-radius:5px; color:#a5b4fc; background:#1e1b4b; border:1px solid #4338ca66; margin-left:6px; }
  /* paraphrase */
  .pp{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; background:#0d1424; border:1px solid #243049; border-radius:9px; padding:11px 13px; margin-top:7px; }
  .pp .orig{ color:#cbd5e1; font-size:13px; }
  .pp .arr{ color:#2dd4bf; font-size:13px; }
  .pp .par{ color:#5eead4; font-size:13px; font-weight:600; }
  .pp.hide .par{ filter:blur(5px); user-select:none; }
  /* questions */
  .q-card{ background:#0d1424; border:1px solid #243049; border-radius:13px; padding:18px; margin-top:12px; }
  .q-stem{ font-size:14px; font-weight:700; color:#f1f5f9; line-height:1.6; }
  .q-choice{ width:100%; text-align:left; padding:10px 14px; border-radius:9px; font-size:13px; color:#cbd5e1;
    border:1px solid #243049; background:#0b1020; display:flex; gap:9px; line-height:1.5; margin-top:7px; transition:border-color .12s,background .12s; }
  .q-choice:hover{ border-color:#475569; }
  .q-choice.correct{ border-color:#10b981; background:#052e1a; color:#6ee7b7; font-weight:700; }
  .q-choice.wrong{ border-color:#f43f5e; background:#2a0e12; color:#fda4af; }
  .q-lab{ font-weight:800; color:#64748b; }
  .q-exp{ background:#0a1f16; border:1px solid #10b98144; border-radius:9px; padding:11px 14px; font-size:12.5px; color:#86efac; line-height:1.65; margin-top:9px; }
  .q-dr{ background:#1a1206; border:1px solid #f59e0b33; border-radius:9px; padding:10px 13px; font-size:12px; color:#fcd34d; line-height:1.6; margin-top:7px; }
  .q-dr b{ color:#fde68a; }
  /* misc */
  .btn{ padding:8px 16px; border-radius:9px; font-size:12.5px; font-weight:700; border:1px solid #2dd4bf55; background:#042f2a; color:#5eead4; transition:background .12s; }
  .btn:hover{ background:#063f38; }
  .btn-ghost{ border-color:#334155; background:#111a2e; color:#94a3b8; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; color:#2dd4bf; font-size:15px; }
  .empty{ text-align:center; color:#64748b; padding:60px 20px; font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat-box{ background:#0d1424; border:1px solid #243049; border-radius:12px; padding:15px; }
  .stat-n{ font-size:26px; font-weight:800; color:#2dd4bf; }
  .stat-l{ font-size:11px; color:#94a3b8; margin-top:3px; }
  .disc{ font-size:10px; color:#475569; margin-top:18px; line-height:1.6; border-top:1px solid #1e293b; padding-top:12px; }
  /* Today cockpit */
  .tk{ display:flex; align-items:center; gap:15px; padding:16px 18px; background:#0d1424; border:1px solid #243049; border-radius:14px; margin-top:11px; }
  .tk.done{ opacity:.55; }
  .tk-ic{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#042f2a; color:#5eead4; }
  .tk-b{ flex:1; min-width:0; }
  .tk-t{ font-size:15px; font-weight:800; color:#f1f5f9; display:flex; align-items:center; gap:8px; }
  .tk-target{ font-size:12.5px; color:#5eead4; font-weight:700; margin-top:2px; }
  .tk-desc{ font-size:11.5px; color:#94a3b8; margin-top:3px; line-height:1.5; }
  .tk-go{ padding:9px 17px; border-radius:10px; font-size:13px; font-weight:800; border:1px solid #2dd4bf66; background:#042f2a; color:#5eead4; white-space:nowrap; }
  .tk-go:hover{ background:#063f38; }
  .tk-min{ font-size:10px; color:#64748b; background:#0b1020; border:1px solid #334155; border-radius:5px; padding:1px 7px; }
  .today-hero{ background:linear-gradient(135deg,#0d1f1c,#111a2e); border:1px solid #2dd4bf33; border-radius:16px; padding:20px 22px; }
  /* Guide */
  .g-sec{ background:#0d1424; border:1px solid #243049; border-radius:14px; padding:18px 20px; margin-top:14px; }
  .g-h{ font-size:15.5px; font-weight:800; color:#f1f5f9; display:flex; align-items:center; gap:9px; }
  .g-h i{ color:#2dd4bf; }
  .g-sub{ font-size:12.5px; font-weight:800; color:#7dd3fc; margin:13px 0 5px; }
  .g-p{ font-size:13.5px; color:#cbd5e1; line-height:1.75; margin-top:9px; }
  .g-note{ background:#042f2a; border:1px solid #2dd4bf44; border-radius:10px; padding:11px 14px; font-size:12.5px; color:#a7f3d0; line-height:1.7; margin-top:11px; }
  .g-ul{ margin:9px 0 0 2px; padding:0; list-style:none; }
  .g-ul li{ font-size:13px; color:#cbd5e1; line-height:1.7; padding-left:18px; position:relative; margin-top:5px; }
  .g-ul li:before{ content:"▪"; color:#2dd4bf; position:absolute; left:0; }
  .g-ol{ margin:9px 0 0 0; padding-left:20px; }
  .g-ol li{ font-size:13px; color:#cbd5e1; line-height:1.75; margin-top:7px; }
  .g-kv{ display:grid; grid-template-columns:1fr; gap:7px; margin-top:10px; }
  .g-kv .row{ display:grid; grid-template-columns:150px 1fr; gap:10px; background:#0b1020; border:1px solid #243049; border-radius:8px; padding:9px 12px; }
  .g-kv .k{ font-size:12.5px; font-weight:800; color:#5eead4; }
  .g-kv .v{ font-size:12.5px; color:#cbd5e1; line-height:1.6; }
  /* Listening */
  .lc-stage{ background:#0d1424; border:1px solid #243049; border-radius:12px; padding:14px 16px; margin-top:10px; }
  .lc-stage .t{ font-size:13.5px; font-weight:800; color:#7dd3fc; }
  .lc-stage ol{ margin:7px 0 0; padding-left:20px; }
  .lc-stage li{ font-size:12.5px; color:#cbd5e1; line-height:1.7; margin-top:4px; }
  .lc-rec{ display:flex; align-items:center; gap:12px; background:#0d1424; border:1px solid #243049; border-radius:11px; padding:12px 14px; margin-top:9px; }
  .lc-rec .b{ flex:1; min-width:0; }
  .lc-rec .nm{ font-size:13.5px; font-weight:800; color:#f1f5f9; }
  .lc-rec .mt{ font-size:11px; color:#94a3b8; margin-top:2px; }
  /* Vocab grid (요구8: 30 한눈에) */
  .vg{ display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:10px; margin-top:10px; }
  .vg-card{ background:#0d1424; border:1px solid #243049; border-radius:11px; padding:12px 14px; text-align:left; transition:border-color .12s; }
  .vg-card:hover{ border-color:#2dd4bf55; }
  .vg-lem{ font-size:15px; font-weight:800; color:#f1f5f9; }
  .vg-pos{ font-size:10.5px; color:#64748b; margin-left:5px; font-weight:600; }
  .vg-mean{ font-size:12.5px; color:#5eead4; margin-top:6px; line-height:1.55; }
  .vg-ex{ font-size:11.5px; color:#94a3b8; margin-top:5px; font-style:italic; line-height:1.5; }
  .vg-card.hide .vg-mean, .vg-card.hide .vg-ex, .vg-card.hide .vg-exko{ filter:blur(5px); user-select:none; }
  .seg-h{ font-size:11.5px; font-weight:800; color:#7dd3fc; letter-spacing:.04em; margin:16px 0 2px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-top:14px; }
  .field label{ font-size:12px; font-weight:700; color:#94a3b8; }
  .field select, .field input{ background:#0d1424; border:1px solid #334155; border-radius:9px; color:#e2e8f0; padding:9px 12px; font-size:13px; font-family:inherit; }
  .seg{ display:inline-flex; border:1px solid #334155; border-radius:9px; overflow:hidden; }
  .seg button{ padding:8px 15px; background:#0d1424; color:#94a3b8; border:none; font-size:12.5px; font-weight:700; }
  .seg button.on{ background:#042f2a; color:#5eead4; }
  /* 독해 단일 지문(구조 힌트 제거) */
  .rd-passage{ font-size:15px; line-height:1.95; }
  .rd-para{ display:block; }
  .rd-para + .rd-para{ margin-top:13px; }
  /* Vocab 왼쪽 세로 레일 + 범례 + 예문해석 */
  .vlayout{ display:flex; gap:16px; align-items:flex-start; margin-top:14px; }
  .vrail{ width:122px; min-width:122px; display:flex; flex-direction:column; gap:6px; position:sticky; top:18px; }
  .vrail button{ text-align:left; padding:9px 12px; border-radius:9px; border:1px solid #243049; background:#0d1424; color:#94a3b8; line-height:1.2; }
  .vrail button:hover{ border-color:#2dd4bf55; color:#e2e8f0; }
  .vrail button.on{ background:#042f2a; color:#5eead4; border-color:#2dd4bf66; box-shadow:inset 3px 0 0 #2dd4bf; }
  .vmain{ flex:1; min-width:0; }
  .vlegend{ background:#0d1424; border:1px solid #243049; border-radius:10px; padding:11px 14px; margin-top:11px; font-size:11.5px; color:#94a3b8; }
  .vlegend summary{ cursor:pointer; color:#7dd3fc; font-weight:700; }
  .vg-exko{ font-size:11px; color:#8aa0c0; margin-top:3px; line-height:1.5; }
  @media(max-width:680px){ .vlayout{ flex-direction:column } .vrail{ width:100%; flex-direction:row; flex-wrap:wrap; position:static } .vrail button{ flex:1; min-width:72px } }
</style>
</head>
<body>
<div id="appLayout">
  <aside id="sidebar">
    <div class="sb-logo">
      <div class="sb-brand">Para<span class="x">lex</span></div>
      <div class="sb-tag">읽은 영어 → TOEIC® 950 cockpit</div>
    </div>
    <div class="sb-label">오늘</div>
    <button class="sb-item" data-view="today" onclick="setState({view:'today'})"><i class="fa-solid fa-bullseye w-4 text-center"></i>Today <span style="font-size:9px;color:#64748b;margin-left:auto">오늘 할 일</span></button>
    <button class="sb-item" data-view="guide" onclick="setState({view:'guide'})"><i class="fa-solid fa-compass w-4 text-center"></i>학습 가이드</button>
    <div class="sb-label">콘텐츠</div>
    <button class="sb-item" data-view="workbench" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-book-open w-4 text-center"></i>Reading Workbench</button>
    <button class="sb-item" data-view="grammar" onclick="setState({view:'grammar',glabId:null})"><i class="fa-solid fa-spell-check w-4 text-center"></i>Grammar Lab <span style="font-size:9px;color:#64748b;margin-left:auto">P5·6</span></button>
    <button class="sb-item" data-view="vocab" onclick="setState({view:'vocab'})"><i class="fa-solid fa-layer-group w-4 text-center"></i>Vocab Deck</button>
    <button class="sb-item" data-view="strategy" onclick="setState({view:'strategy'})"><i class="fa-solid fa-chess-knight w-4 text-center"></i>Strategy &amp; Traps</button>
    <div class="sb-label">기록</div>
    <button class="sb-item" data-view="dashboard" onclick="setState({view:'dashboard'})"><i class="fa-solid fa-chart-line w-4 text-center"></i>Score Dashboard</button>
    <button class="sb-item" data-view="control" onclick="setState({view:'control'})"><i class="fa-solid fa-sliders w-4 text-center"></i>Control Panel</button>

      <a href="mobile/" style="color:#2dd4bf;font-size:11px;font-weight:700"><i class="fa-solid fa-mobile-screen"></i> 모바일로 열기</a>
      <div style="margin:10px 0;padding:9px 10px;background:#0d1424;border:1px solid #243049;border-radius:8px;color:#94a3b8;font-size:9.5px;line-height:1.55">⚠️ 기본기·전략·어휘 <b style="color:#cbd5e1">보조 트레이너</b>입니다. 고득점은 <b style="color:#cbd5e1">공식 합법 기출 실전서 + LC 훈련 + 시간제 모의고사</b> 병행이 필요합니다.</div>
      TOEIC is a registered trademark of ETS.<br>This product is not endorsed or approved by ETS.
    </div>
  </aside>
  <div id="root"><div class="wrap"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> 콘텐츠 로딩 중…</div></div></div>
</div>

<script>
/* ===== Paralex viewer engine (무빌드 단일HTML · self-register registry · localStorage) ===== */
window.PARALEX_SETS = window.PARALEX_SETS || {};

/* --- helpers --- */
const $ = (id)=>document.getElementById(id);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB = ['A','B','C','D','E'];
const BANDS = ['750-800','800-850','850-900','900-950','950+'];
function emptyBucket(){ return {attempts:0,correct:0,wrong:0,tags:{},skills:{}}; }

/* --- stable-id progress (Codex R3 락: paralex:v1:*) --- */
const PKEY='paralex:v1:';
function pget(k,def){ try{ var v=localStorage.getItem(PKEY+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function pset(k,val){ try{ localStorage.setItem(PKEY+k, JSON.stringify(val)); }catch(e){} }
function loadProg(){ return pget('progress', {reading:{}, grammar:{}}); }
function saveProg(p){ pset('progress', p); }
function loadSettings(){ var d=(window.PARALEX_MANIFEST&&PARALEX_MANIFEST.defaults)||{}; return Object.assign({targetBand:'800-850',dailyMinutes:35,lcEnabled:false}, d, pget('settings',{})); }
function saveSettings(s){ pset('settings', s); }

/* --- state --- */
const S = Object.assign({ view:'today', setId:null, reveal:{}, ppHide:true, showGloss:false, glabId:null, greveal:{}, vocabDay:null, vocabRevealAll:false, vocabReveal:{} }, loadState());
function loadState(){ try{ return JSON.parse(localStorage.getItem('paralex-state'))||{}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem('paralex-state', JSON.stringify({view:S.view,setId:S.setId,vocabDay:S.vocabDay})); }catch(e){} }
function setState(patch){ Object.assign(S, patch); if(patch.setId!==undefined){ S.reveal={}; S.ppHide=true; } if(patch.glabId!==undefined){ S.greveal={}; } if(patch.vocabDay!==undefined){ S.vocabReveal={}; S.vocabRevealAll=false; } saveState(); render(); }

/* --- stats (오답통계) --- */
function loadStats(){ try{ const s=JSON.parse(localStorage.getItem('paralex-stats')); if(!s||!s.official) return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; return s; }catch(e){ return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; } }
function saveStats(st){ try{ localStorage.setItem('paralex-stats', JSON.stringify(st)); }catch(e){} }
function recordAnswer(setId, qno, picked, correct, drType, skillFocus){
  const set=getSet(setId);
  const bucket=(set&&set.reviewGates&&set.reviewGates.human&&set.reviewGates.human.pass===true)?'official':'practice';
  const st=loadStats(); const b=st[bucket]||(st[bucket]=emptyBucket());
  b.attempts++; if(correct){ b.correct++; } else { b.wrong++; if(drType){ b.tags[drType]=(b.tags[drType]||0)+1; } }
  (skillFocus||[]).forEach(sk=>{ b.skills[sk]=b.skills[sk]||{a:0,c:0}; b.skills[sk].a++; if(correct)b.skills[sk].c++; });
  st.bySet[setId]=st.bySet[setId]||{a:0,c:0}; st.bySet[setId].a++; if(correct)st.bySet[setId].c++;
  saveStats(st);
}

/* --- registry access --- */
function allSets(){ return Object.values(window.PARALEX_SETS); }
function getSet(id){ return window.PARALEX_SETS[id] || null; }
function setsByTrack(track){ return allSets().filter(s=>s.track===track); }
function manifestContent(kind){ var m=window.PARALEX_MANIFEST; if(!m||!m.content) return []; return m.content.filter(c=>c.kind===kind).sort((a,b)=>(a.order||0)-(b.order||0)); }

/* --- render dispatch --- */
function render(){
  document.querySelectorAll('.sb-item').forEach(b=> b.classList.toggle('on', b.dataset.view===S.view));
  const r = $('root');
  if(S.view==='today') r.innerHTML = renderToday();
  else if(S.view==='guide') r.innerHTML = renderGuide();
  else if(S.view==='workbench') r.innerHTML = S.setId ? renderSet(S.setId) : renderWorkbenchList();
  else if(S.view==='dashboard') r.innerHTML = renderDashboard();
  else if(S.view==='strategy') r.innerHTML = renderStrategy();
  else if(S.view==='grammar') r.innerHTML = S.glabId ? renderGrammar(S.glabId) : renderGrammarList();
  else if(S.view==='vocab') r.innerHTML = renderVocab();
  else if(S.view==='control') r.innerHTML = renderControl();
  else r.innerHTML = renderToday();
  if(S.view==='workbench' && S.setId) startTimer();
}

function profileNow(){ var s=loadSettings(); var t=(window.PARALEX_MANIFEST&&PARALEX_MANIFEST.today)||{}; var p=(t.minutesProfiles&&t.minutesProfiles[String(s.dailyMinutes)])||{grammar:6,vocabNew:10,vocabReview:10,reading:1}; return p; }
function readingDone(setId){ var set=getSet(setId); if(!set) return false; var p=loadProg(); var r=p.reading[setId]; var total=(set.questions||[]).length; return !!(r&&r.answered&&total&&r.answered.length>=total); }
function nextReading(){ var list=manifestContent('reading'); for(var i=0;i<list.length;i++){ if(getSet(list[i].id) && !readingDone(list[i].id)) return list[i].id; } return null; }
function readingProgress(){ var list=manifestContent('reading'); var done=0; list.forEach(c=>{ if(readingDone(c.id)) done++; }); return {done:done, total:list.length}; }
function glabItemKeys(g){ if(g.items) return g.items.map(it=>'g'+it.no); var arr=[]; (g.passages||[]).forEach(p=>(p.items||[]).forEach(it=>arr.push((p.pid?p.pid+'-':'')+it.no))); return arr; }
function grammarDoneKeys(glabId){ var p=loadProg(); return (p.grammar[glabId]&&p.grammar[glabId].answered)||[]; }
function nextGrammar(n){ var list=manifestContent('grammar'); for(var i=0;i<list.length;i++){ var g=(window.PARALEX_GLAB||{})[list[i].id]; if(!g) continue; var keys=glabItemKeys(g); var done=grammarDoneKeys(g.id); var undone=keys.filter(k=>done.indexOf(k)<0); if(undone.length) return {glabId:g.id, title:g.title||g.id, remaining:undone.length, take:Math.min(n,undone.length)}; } return null; }
function grammarProgress(){ var list=manifestContent('grammar'); var done=0,total=0; list.forEach(c=>{ var g=(window.PARALEX_GLAB||{})[c.id]; if(!g) return; var keys=glabItemKeys(g); total+=keys.length; done+=grammarDoneKeys(c.id).filter(k=>keys.indexOf(k)>=0).length; }); return {done:done,total:total}; }
function allVocabCards(){ var out=[]; (window.PARALEX_VOCAB_DAYS||[]).forEach(d=>(d.cards||[]).forEach(c=>out.push({day:d.day,card:c}))); return out; }
function vocabSeen(id){ var c=vLoad().cards[id]; return !!(c&&c.seen); }
function vocabPlan(){ var pr=profileNow(); var all=allVocabCards(); var unseen=all.filter(x=>!vocabSeen(x.card.id)); var seen=all.filter(x=>vocabSeen(x.card.id));
  return { newCount:Math.min(pr.vocabNew||10, unseen.length), reviewCount:Math.min(pr.vocabReview||10, seen.length), newAvail:unseen.length, seenAvail:seen.length, day:(unseen[0]&&unseen[0].day)|| (all.length?all[all.length-1].day:null), total:all.length, seen:seen.length }; }

}

function renderQuestion(set,q,qi){
  const revealed = S.reveal[q.no];
  const ans = (q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const choices = (q.choices||[]).map((c,ci)=>{
    const lab = c.label || LAB[ci];
    let cls='q-choice';
    if(revealed){
      if(ans.includes(lab)) cls+=' correct';
      else if(revealed===lab) cls+=' wrong';
    }
    return `<button class="${cls}" onclick="answerQ('${set.id}','${q.no}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(revealed){
    const picked = revealed===true?null:revealed;
    const dr = (q.distractorRationales||[]).find(d=>d.label===picked);
    const evid = (q.evidenceSpanIds||[]).join(', ');
    exp = `${dr?`<div class="q-dr"><b>오답 [${esc(picked)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}
      <div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b>${evid?` · 근거 ${esc(evid)}`:''}<br>${esc(q.explanation)}</div>`;
  }
  return `<div class="q-card"><div class="q-stem">${q.no}. ${esc(q.stem)}</div>${choices}${exp}</div>`;
}

function answerQ(setId,qno,lab){
  const set=getSet(setId); const q=(set.questions||[]).find(x=>String(x.no)===String(qno));
  const ans=(q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const correct=ans.includes(lab);
  if(S.reveal[qno]) return;
  S.reveal[qno]=lab;
  const dr=(q.distractorRationales||[]).find(d=>d.label===lab);
  recordAnswer(setId,qno,lab,correct, correct?null:(dr?dr.type:'unknown'), q.skillFocus);
  var p=loadProg(); var r=p.reading[setId]||(p.reading[setId]={answered:[]}); if(r.answered.indexOf(qno)<0) r.answered.push(qno); saveProg(p);
  render();
  (q.evidenceSpanIds||[]).forEach(sid=>{ const el=$('span-'+sid); if(el) el.style.boxShadow='0 0 0 2px #2dd4bf55'; });
}

function renderDashboard(){
  const st=loadStats();
  const off=st.official||emptyBucket(), pr=st.practice||emptyBucket();
  const offAcc=off.attempts?Math.round(off.correct/off.attempts*100):0;
  const prAcc=pr.attempts?Math.round(pr.correct/pr.attempts*100):0;
  const band=localStorage.getItem('paralex-band')||loadSettings().targetBand||'';

  const skillH=Object.entries(allSk).sort((a,b)=>(a[1].c/a[1].a)-(b[1].c/b[1].a)).map(([k,v])=>`<div class="kv"><div class="en">${esc(k)}</div><div class="ko">정답률 ${v.a?Math.round(v.c/v.a*100):0}% (${v.c}/${v.a})</div></div>`).join('')||`<div class="kv" style="color:#64748b">스킬 데이터 없음 — 문항을 풀면 집계됩니다.</div>`;

  return `<div class="wrap">
    <div class="h-title">Score Dashboard</div>
    <div class="h-sub">official(검수완료) 버킷만 진단·추천에 반영. 현재 세트는 모두 practice → 연습 버킷에 별도 집계됩니다.</div>
    <div class="sec-h"><i class="fa-solid fa-crosshairs"></i>목표 밴드 (자가선택 · 진단 근거 아님)</div>

    <div class="stat-grid" style="margin-top:16px">
      <div class="stat-box"><div class="stat-n">${off.attempts}</div><div class="stat-l">공식 시도</div></div>
      <div class="stat-box"><div class="stat-n">${offAcc}%</div><div class="stat-l">공식 정답률</div></div>
      <div class="stat-box"><div class="stat-n">${pr.attempts}</div><div class="stat-l">연습 시도</div></div>
      <div class="stat-box"><div class="stat-n">${prAcc}%</div><div class="stat-l">연습 정답률</div></div>
    </div>

    <div class="sec-h"><i class="fa-solid fa-chart-simple"></i>스킬별 정답률</div>${skillH}
    <div class="sec-h"><i class="fa-solid fa-triangle-exclamation"></i>오답 유형 (연습)</div>${prTags}
    <div style="margin-top:18px"><button class="btn btn-ghost" onclick="if(confirm('학습 통계를 초기화할까요?')){localStorage.removeItem('paralex-stats');render();}">통계 초기화</button></div>
  </div>`;
}

function drDesc(t){ return ({too_broad:'너무 포괄적 — 지문 범위를 넘어선 일반화',opposite:'반대 진술 — 지문과 역방향',not_mentioned:'미언급 — 지문에 근거 없음',wrong_referent:'지시대상 오류 — 가리키는 대상이 다름',chronology:'시점/순서 오류 — 시간 관계 뒤바뀜',partial_truth:'부분적 사실 — 일부만 맞고 나머지가 틀림',extreme_word:'극단어 함정 — always/never/only 등 단정',same_word:'동일어 함정 — 지문 단어를 그대로 쓴 매력 오답',unknown:'기타'}[t]||t); }

function glabCount(g){ return g.items ? g.items.length : (g.passages||[]).reduce((n,p)=>n+(p.items||[]).length,0); }
function renderGrammarList(){
  const gs = manifestContent('grammar').map(c=>(window.PARALEX_GLAB||{})[c.id]).filter(Boolean);

  let h = `<div class="wrap"><div class="h-title">Grammar Lab</div>
    <div class="h-sub">Part 5(단문 빈칸)·Part 6(장문 빈칸)의 문법·어법·어휘 문제. 독해(Workbench)와 별도 트랙.</div>`;
  if(!all.length){ h += `<div class="kv" style="color:#64748b">문법 세트 준비 중.</div></div>`; return h; }
  h += all.map(g=>{ var done=grammarDoneKeys(g.id).length, tot=glabCount(g);
    return `<button class="set-row" onclick="setState({view:'grammar',glabId:'${g.id}'})">

      <div style="font-size:11.5px;color:#94a3b8;margin-top:3px">${(g.partFocus||[]).join('·')} · ${tot}문항 · 완료 ${done}/${tot}</div></div>
      <div class="pill pill-orig">${esc(g.scoreBandTarget||'')}</div></button>`;
  }).join('');
  h += `<div class="disc">⚠️ 자체작성 연습문제(practice). 정답 유일성·문법 정확성은 박사 검수(human 게이트) 후 확정됩니다.</div></div>`;
  return h;
}
function renderGItem(glabId, it, pid){
  const key = pid ? `${pid}-${it.no}` : `g${it.no}`;
  const rv = S.greveal[key];
  const ans = (it.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const stemHtml = it.sentence
    ? esc(it.sentence).replace(/_{2,}/, '<b style="color:#2dd4bf">_____</b>')
    : `<span style="color:#94a3b8">빈칸 ${esc(String(it.blankId||it.no))}${it.questionType==='sentence_insertion'?' · 문장 삽입':''}</span>`;
  const choices = (it.choices||[]).map((c,ci)=>{ const lab=c.label||LAB[ci]; let cls='q-choice';
    if(rv){ if(ans.includes(lab))cls+=' correct'; else if(rv===lab)cls+=' wrong'; }
    return `<button class="${cls}" onclick="answerGrammar('${glabId}','${key}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(rv){ const dr=(it.distractorRationales||[]).find(d=>d.label===rv);
    exp = `${dr?`<div class="q-dr"><b>오답 [${esc(rv)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}
      <div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b> · <span style="color:#7dd3fc">${esc(it.grammarPoint||'')}</span><br>${esc(it.explanation||'')}${it.trapNote?`<br><span style="color:#fcd34d">함정: ${esc(it.trapNote)}</span>`:''}</div>`;
  }
  return `<div class="q-card"><div class="q-stem">${it.no}. ${stemHtml}</div>${choices}${exp}</div>`;
}
function renderGrammar(id){
  const g=(window.PARALEX_GLAB||{})[id];
  if(!g) return `<div class="wrap"><div class="empty">세트를 찾을 수 없습니다.</div></div>`;
  let body;
  if(g.items){ body = g.items.map(it=>renderGItem(id,it,null)).join(''); }
  else if(g.passages){ body = g.passages.map(p=>`<div class="sec-h"><i class="fa-solid fa-file-lines"></i>${esc(p.label||'')}</div><div class="para-p">${esc(p.text||'')}</div>${(p.items||[]).map(it=>renderGItem(id,it,p.pid)).join('')}`).join(''); }
  else body='';
  return `<div class="wrap"><button class="btn btn-ghost" onclick="setState({view:'grammar',glabId:null})"><i class="fa-solid fa-arrow-left"></i> 목록</button>
    <div class="card" style="margin-top:14px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill pill-biz">${(g.partFocus||[]).join('·')}</span><span class="pill pill-orig">${esc(g.scoreBandTarget||'')}</span></div>
    <div class="h-title" style="margin-top:10px;font-size:19px">${esc(g.title)}</div></div>
    ${body}<div class="disc">자체작성 연습문제(practice) — 정답·문법은 박사 검수 후 확정.</div></div>`;
}
function answerGrammar(glabId,key,lab){ if(S.greveal[key]) return; S.greveal[key]=lab;
  var p=loadProg(); var r=p.grammar[glabId]||(p.grammar[glabId]={answered:[]}); if(r.answered.indexOf(key)<0) r.answered.push(key); saveProg(p);

/* ===================== boot + dynamic loader ===================== */
function boot(){
  try{
    const q=new URLSearchParams(location.search);
    const v=q.get('view'); if(['today','guide','workbench','dashboard','strategy','vocab','grammar','control'].includes(v)) S.view=v;
    const sid=q.get('set'); if(sid && getSet(sid)){ S.view='workbench'; S.setId=sid; }
  }catch(e){}
  // 방어적 정렬: 콘텐츠 실행 순서와 무관하게 Day 오름차순 보장
  if(window.PARALEX_VOCAB_DAYS&&window.PARALEX_VOCAB_DAYS.sort) window.PARALEX_VOCAB_DAYS.sort((a,b)=>(a.day||0)-(b.day||0));
  render();
}
/* ★Codex R3 락: classic <script> 주입(ES module/fetch 금지 → file:// 호환). 자가등록 콘텐츠는 상호 독립이라 병렬 주입 후 전부 정착되면 boot. */
(function loadContent(){
  var m=window.PARALEX_MANIFEST;
  var files=(m&&m.content)? m.content.map(c=>c.file) : [];
  var total=files.length, settled=0;
  if(!total){ boot(); return; }
  function done(){ settled++; if(settled>=total) boot(); }
  files.forEach(function(f){
    var sc=document.createElement('script'); sc.src=f; sc.async=false; // ★실행 순서 보장(병렬 다운로드+삽입순 실행)
    sc.onload=done; sc.onerror=function(){ console.warn('[Paralex] content load 실패:', f); done(); };
    document.head.appendChild(sc);
  });
})();
</script>
</body>
</html>
