<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; }
  body{ background:#0b1020; color:#e2e8f0; font-family:'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
    line-height:1.6; word-break:keep-all; -webkit-tap-highlight-color:transparent; padding-bottom:64px; }
  a{ color:#38bdf8; }
  button{ cursor:pointer; font-family:inherit; color:inherit; }
  /* top bar */
  .topbar{ position:sticky; top:0; z-index:20; background:#070b18ee; backdrop-filter:blur(10px); border-bottom:1px solid #1e293b; padding:12px 16px 0; }
  .brand{ font-size:16px; font-weight:800; color:#fff; }
  .brand .x{ color:#2dd4bf; }
  .brand small{ font-size:10px; color:#64748b; font-weight:500; margin-left:6px; }
  .chips{ display:flex; gap:7px; overflow-x:auto; padding:11px 0 10px; }
  .chip{ flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; background:#111a2e; border:1px solid #243049; color:#94a3b8; }
  .chip.on{ background:#042f2a; border-color:#2dd4bf; color:#5eead4; }
  /* content */
  .ct{ padding:16px; max-width:680px; margin:0 auto; }
  .h-title{ font-size:20px; font-weight:800; color:#f1f5f9; }
  .h-sub{ font-size:12.5px; color:#94a3b8; margin-top:5px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .pill-news{ color:#7dd3fc; background:#082f49; border:1px solid #0ea5e955; }
  .pill-biz{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-orig{ color:#cbd5e1; background:#1e293b; border:1px solid #475569; }
  .pill-band{ color:#fcd34d; background:#2a1a04; border:1px solid #f59e0b66; }
  .pill-cap{ color:#c4b5fd; background:#1e1b4b; border:1px solid #6d28d966; }
  .doc-head{ font-size:11px; font-weight:800; color:#7dd3fc; margin:14px 0 5px; }
  .sec-h{ font-size:12.5px; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:7px; margin:20px 0 8px; }
  .sec-h i{ color:#2dd4bf; }
  .set-card{ display:flex; gap:12px; align-items:center; padding:14px; background:#111a2e; border:1px solid #243049; border-radius:14px; margin-bottom:10px; width:100%; text-align:left; }
  .set-ic{ width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .set-ic.news{ background:#082f49; color:#7dd3fc; } .set-ic.biz{ background:#2a1a04; color:#fcd34d; }
  .para-p{ background:#0d1424; border:1px solid #243049; border-radius:11px; padding:12px 14px; margin-top:10px; line-height:1.8; font-size:14.5px; color:#dbe4f0; }
  .fn-tag{ font-size:9.5px; font-weight:800; color:#94a3b8; background:#1e293b; border:1px solid #334155; border-radius:5px; padding:1px 7px; margin-right:7px; }
  .ck-en-inline{ color:#dbe4f0; } .sl{ color:#2dd4bf; font-weight:800; margin:0 2px; }
  .ck-row{ border-left:2px solid #2dd4bf44; padding:5px 0 5px 12px; margin:9px 0; }
  .ck-en{ color:#f1f5f9; font-size:14px; font-weight:600; }
  .ck-ko{ color:#5eead4; font-size:13px; margin-top:3px; }
  .ck-note{ display:inline-block; color:#94a3b8; font-size:11px; margin-top:4px; background:#0b1020; border:1px solid #334155; border-radius:5px; padding:1px 7px; }
  .kv{ background:#0d1424; border:1px solid #243049; border-radius:9px; padding:10px 13px; font-size:13px; margin-top:7px; }
  .kv .en{ color:#f1f5f9; font-weight:600; } .kv .ko{ color:#94a3b8; font-size:12px; margin-top:2px; } .kv .meta{ color:#64748b; font-size:11px; margin-top:3px; }
  .vtag{ font-size:9px; font-weight:800; padding:1px 6px; border-radius:5px; color:#a5b4fc; background:#1e1b4b; border:1px solid #4338ca66; margin-left:6px; }
  .pp{ background:#0d1424; border:1px solid #243049; border-radius:9px; padding:11px 13px; margin-top:7px; }
  .pp .orig{ color:#cbd5e1; font-size:13px; } .pp .par{ color:#5eead4; font-size:13px; font-weight:600; margin-top:5px; }
  .pp.hide .par{ filter:blur(5px); }
  .q-card{ background:#0d1424; border:1px solid #243049; border-radius:13px; padding:15px; margin-top:11px; }
  .q-stem{ font-size:14px; font-weight:700; color:#f1f5f9; line-height:1.55; }
  .q-choice{ width:100%; text-align:left; padding:11px 13px; border-radius:9px; font-size:13px; color:#cbd5e1; border:1px solid #243049; background:#0b1020; display:flex; gap:8px; margin-top:7px; }
  .q-choice.correct{ border-color:#10b981; background:#052e1a; color:#6ee7b7; font-weight:700; }
  .q-choice.wrong{ border-color:#f43f5e; background:#2a0e12; color:#fda4af; }
  .q-lab{ font-weight:800; color:#64748b; }
  .q-exp{ background:#0a1f16; border:1px solid #10b98144; border-radius:9px; padding:10px 13px; font-size:12.5px; color:#86efac; line-height:1.6; margin-top:8px; }
  .q-dr{ background:#1a1206; border:1px solid #f59e0b33; border-radius:9px; padding:9px 12px; font-size:12px; color:#fcd34d; margin-top:7px; }
  .q-dr b{ color:#fde68a; }
  .btn{ padding:8px 15px; border-radius:9px; font-size:12.5px; font-weight:700; border:1px solid #2dd4bf55; background:#042f2a; color:#5eead4; }
  .btn-ghost{ border-color:#334155; background:#111a2e; color:#94a3b8; }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; color:#2dd4bf; font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-box{ background:#0d1424; border:1px solid #243049; border-radius:12px; padding:14px; }
  .stat-n{ font-size:24px; font-weight:800; color:#2dd4bf; } .stat-l{ font-size:11px; color:#94a3b8; margin-top:3px; }
  .disc{ font-size:10px; color:#475569; margin-top:18px; line-height:1.6; border-top:1px solid #1e293b; padding-top:12px; }
  /* bottom nav */
  .botnav{ position:fixed; bottom:0; left:0; right:0; z-index:20; background:#070b18f5; border-top:1px solid #1e293b; display:flex; }
  .bn{ flex:1; padding:9px 0 11px; text-align:center; color:#64748b; font-size:10px; font-weight:700; background:transparent; border:none; }
  .bn i{ display:block; font-size:17px; margin-bottom:3px; }
  .bn.on{ color:#2dd4bf; }
</style>

<body>
<div class="topbar">
  <div class="brand">Para<span class="x">lex</span><small>읽은 영어 → TOEIC® 950</small></div>
  <div class="chips" id="chips"></div>
</div>
<div class="ct" id="root"></div>
<div class="botnav">
  <button class="bn" data-view="workbench" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-dumbbell"></i>Workbench</button>
  <button class="bn" data-view="dashboard" onclick="setState({view:'dashboard'})"><i class="fa-solid fa-chart-line"></i>점수</button>
  <button class="bn" data-view="strategy" onclick="setState({view:'strategy'})"><i class="fa-solid fa-chess-knight"></i>전략</button>
  <button class="bn" data-view="vocab" onclick="setState({view:'vocab'})"><i class="fa-solid fa-layer-group"></i>어휘</button>
</div>

<script>
/* ===== Paralex MOBILE — 데스크톱과 동일 데이터·로직, 모바일 UI (수동 미러링) ===== */
window.PARALEX_SETS = window.PARALEX_SETS || {};
const $ = (id)=>document.getElementById(id);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB = ['A','B','C','D','E'];
const BANDS = ['750-800','800-850','850-900','900-950','950+'];
function emptyBucket(){ return {attempts:0,correct:0,wrong:0,tags:{},skills:{}}; }

const S = Object.assign({ view:'workbench', setId:null, reveal:{}, ppHide:true, showGloss:false }, loadState());
function loadState(){ try{ return JSON.parse(localStorage.getItem('paralex-state-m'))||{}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem('paralex-state-m', JSON.stringify({view:S.view,setId:S.setId})); }catch(e){} }
function setState(patch){ Object.assign(S, patch); if(patch.setId!==undefined){ S.reveal={}; S.ppHide=true; } saveState(); render(); window.scrollTo(0,0); }

/* stats — 데스크톱과 동일 키 'paralex-stats' 공유 */
function loadStats(){ try{ const s=JSON.parse(localStorage.getItem('paralex-stats')); if(!s||!s.official) return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; return s; }catch(e){ return {official:emptyBucket(),practice:emptyBucket(),bySet:{}}; } }
function saveStats(st){ try{ localStorage.setItem('paralex-stats', JSON.stringify(st)); }catch(e){} }
function recordAnswer(setId, qno, picked, correct, drType, skillFocus){
  const set=getSet(setId);
  const bucket=(set&&set.reviewGates&&set.reviewGates.human&&set.reviewGates.human.pass===true)?'official':'practice';
  const st=loadStats(); const b=st[bucket]||(st[bucket]=emptyBucket());
  b.attempts++; if(correct){ b.correct++; } else { b.wrong++; if(drType){ b.tags[drType]=(b.tags[drType]||0)+1; } }
  (skillFocus||[]).forEach(sk=>{ b.skills[sk]=b.skills[sk]||{a:0,c:0}; b.skills[sk].a++; if(correct)b.skills[sk].c++; });
  st.bySet[setId]=st.bySet[setId]||{a:0,c:0}; st.bySet[setId].a++; if(correct)st.bySet[setId].c++; saveStats(st);
}
function allSets(){ return Object.values(window.PARALEX_SETS); }
function getSet(id){ return window.PARALEX_SETS[id] || null; }
function setsByTrack(t){ return allSets().filter(s=>s.track===t); }

const CHIPMAP = { workbench:'Reading Workbench', dashboard:'Score Dashboard', strategy:'Strategy & Traps', vocab:'Vocab Deck' };
function renderChips(){
  $('chips').innerHTML = Object.entries(CHIPMAP).map(([k,v])=>`<button class="chip ${S.view===k?'on':''}" onclick="setState({view:'${k}',setId:null})">${v}</button>`).join('');
  document.querySelectorAll('.bn').forEach(b=> b.classList.toggle('on', b.dataset.view===S.view));
}

function render(){
  renderChips();
  const r = $('root');
  if(S.view==='workbench') r.innerHTML = S.setId ? renderSet(S.setId) : renderList();
  else if(S.view==='dashboard') r.innerHTML = renderDashboard();
  else if(S.view==='strategy') r.innerHTML = renderStrategy();
  else if(S.view==='vocab') r.innerHTML = renderVocab();
  else r.innerHTML = renderList();
  if(S.view==='workbench' && S.setId) startTimer();
}

function trackBlock(track, title, icon, cls){
  const sets = setsByTrack(track);
  let h = `<div class="sec-h"><i class="fa-solid ${icon}"></i>${title} <span class="pill pill-${cls}" style="margin-left:5px">${sets.length}</span></div>`;
  if(!sets.length){ h += `<div class="kv" style="color:#64748b">아직 세트가 없습니다.</div>`; return h; }
  h += sets.map(s=>{ const st=loadStats().bySet[s.id]; const prog=st?` · ${st.c}/${st.a}`:'';
    return `<button class="set-card" onclick="setState({view:'workbench',setId:'${s.id}'})">
      <div class="set-ic ${cls}"><i class="fa-solid ${icon}"></i></div>
      <div style="flex:1;min-width:0"><div style="font-weight:700;color:#f1f5f9;font-size:14px">${esc(s.title)}</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:2px">${esc(s.genre)} · ${s.wordCount||'?'}단어${prog}</div></div></button>`;
  }).join('');
  return h;
}
function renderList(){
  return `<div class="h-title">Reading Workbench</div>
    <div class="h-sub">실제 영어 = 독해 근육, 비즈니스 = 토익 전이. 두 트랙 분리 훈련.</div>
    ${trackBlock('news','Authentic News','fa-newspaper','news')}
    ${trackBlock('business','Business RC','fa-briefcase','biz')}
    <div class="disc">⚠️ MVP는 제품 검증용. 세트는 6게이트 검수 후 정식 반영.</div>`;
}

let _ti=null,_ts=0;
function startTimer(){ clearInterval(_ti); _ts=0; _ti=setInterval(()=>{ _ts++; const el=$('pxTimer'); if(!el){clearInterval(_ti);return;} el.textContent=`${String(Math.floor(_ts/60)).padStart(2,'0')}:${String(_ts%60).padStart(2,'0')}`; },1000); }

function renderSet(id){
  const set=getSet(id); if(!set) return `<div class="kv">세트 없음</div>`;
  const cls=set.track==='news'?'news':'biz'; const tl=set.track==='news'?'Authentic News':'Business RC';
  const showG=!!S.showGloss;
  const docs=(set.passage&&set.passage.documents)||[{id:'d1',label:'',paragraphs:(set.passage&&set.passage.paragraphs)||[]}];
  const renderPara=(p)=>{
    const ch=p.chunks||[]; let inner;
    if(showG){ inner=ch.map(c=>`<div class="ck-row"><div class="ck-en">${esc(c.en)} <span class="sl">/</span></div><div class="ck-ko">${esc(c.ko)}</div>${c.note?`<div class="ck-note">${esc(c.note)}</div>`:''}</div>`).join(''); }
    else { inner=ch.map(c=>`<span class="ck-en-inline">${esc(c.en)}</span>`).join(' '); }
    return `<div class="para-p" id="span-${esc(p.id)}"><span class="fn-tag">${esc(p.functionLabel||'')}</span>${inner}</div>`;
  };
  const paras=docs.map(d=>{ const head=(docs.length>1&&d.label)?`<div class="doc-head"><i class="fa-solid fa-file-lines"></i> ${esc(d.label)}</div>`:''; return head+(d.paragraphs||[]).map(renderPara).join(''); }).join('');
  const keyS=(set.keyStructures||[]).map(k=>`<div class="kv"><div class="en">${esc(k.span)}</div><div class="ko">${esc(k.note)}</div></div>`).join('');
  const vocab=(set.vocabulary||[]).map(v=>`<div class="kv"><div class="en">${esc(v.lemma)} <span class="vtag">${esc(v.listTag||'')}</span></div><div class="ko">${esc(v.glossKo)}</div>${v.collocation?`<div class="meta">▪ ${esc(v.collocation)}</div>`:''}</div>`).join('');
  const pps=(set.paraphrases||[]).map(p=>`<div class="pp ${S.ppHide?'hide':''}"><div class="orig">${esc(p.original)}</div><div class="par">→ ${esc(p.paraphrase)}</div></div>`).join('');
  const qs=(set.questions||[]).map(q=>renderQ(set,q)).join('');
  const refl=(set.reflectionPrompts||[]).map(r=>`<div class="kv" style="color:#cbd5e1">🤔 ${esc(r)}</div>`).join('');
  return `<button class="btn btn-ghost" onclick="setState({view:'workbench',setId:null})"><i class="fa-solid fa-arrow-left"></i> 목록</button>
    <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px">
      <span class="pill pill-${cls}">${tl}</span>${set.scoreBandTarget?`<span class="pill pill-band">🎯 ${esc(set.scoreBandTarget)}</span>`:''}<span class="pill pill-orig">${esc(set.genre)}</span>${set.setKind==='ladder_capsule'?`<span class="pill pill-cap">Capsule</span>`:''}
      <span style="margin-left:auto" class="timer" id="pxTimer">00:00</span></div>
    <div class="h-title" style="margin-top:9px;font-size:18px">${esc(set.title)}</div>
    <div class="h-sub">출처 ${esc(set.source&&set.source.name||'')} · ${esc(set.license)} · 목표 ${Math.round((set.targetTimeSec||0)/60)}분</div>
    <div class="sec-h"><i class="fa-solid fa-book-open"></i>지문 — 직독직해 <button class="btn" style="margin-left:auto;padding:4px 12px" onclick="setState({showGloss:!S.showGloss})">${showG?'원문만':'해석 보기'}</button></div>${paras}
    ${keyS?`<div class="sec-h"><i class="fa-solid fa-diagram-project"></i>핵심 구문</div>${keyS}`:''}
    ${vocab?`<div class="sec-h"><i class="fa-solid fa-spell-check"></i>어휘</div>${vocab}`:''}
    ${pps?`<div class="sec-h"><i class="fa-solid fa-arrow-right-arrow-left"></i>패러프레이즈 <button class="btn" style="margin-left:auto;padding:4px 12px" onclick="setState({ppHide:!S.ppHide})">${S.ppHide?'보기':'가리기'}</button></div>${pps}`:''}
    ${qs?`<div class="sec-h"><i class="fa-solid fa-circle-question"></i>이해 문항</div>${qs}`:''}
    ${refl?`<div class="sec-h"><i class="fa-solid fa-pen-to-square"></i>회고</div>${refl}`:''}
    <div class="disc">정답·해설은 자체작성이며 6게이트 검수 기록은 validator 산출물에 남습니다.</div>`;
}
function renderQ(set,q){
  const rv=S.reveal[q.no];
  const ans=(q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a);
  const ch=(q.choices||[]).map((c,ci)=>{ const lab=c.label||LAB[ci]; let cls='q-choice';
    if(rv){ if(ans.includes(lab))cls+=' correct'; else if(rv===lab)cls+=' wrong'; }
    return `<button class="${cls}" onclick="answerQ('${set.id}','${q.no}','${lab}')"><span class="q-lab">${esc(lab)}</span><span>${esc(c.text)}</span></button>`;
  }).join('');
  let exp='';
  if(rv){ const picked=rv===true?null:rv; const dr=(q.distractorRationales||[]).find(d=>d.label===picked); const ev=(q.evidenceSpanIds||[]).join(', ');
    exp=`${dr?`<div class="q-dr"><b>오답 [${esc(picked)}]</b> (${esc(dr.type)}): ${esc(dr.note)}</div>`:''}<div class="q-exp"><b>정답 ${esc(ans.join('/'))}</b>${ev?` · 근거 ${esc(ev)}`:''}<br>${esc(q.explanation)}</div>`; }
  return `<div class="q-card"><div class="q-stem">${q.no}. ${esc(q.stem)}</div>${ch}${exp}</div>`;
}
function answerQ(setId,qno,lab){
  const set=getSet(setId); const q=(set.questions||[]).find(x=>String(x.no)===String(qno));
  const ans=(q.answer||[]).map(a=> typeof a==='number'?LAB[a-1]:a); const correct=ans.includes(lab);
  if(S.reveal[qno]) return; S.reveal[qno]=lab;
  const dr=(q.distractorRationales||[]).find(d=>d.label===lab);
  recordAnswer(setId,qno,lab,correct, correct?null:(dr?dr.type:'unknown'), q.skillFocus); render();
}

function drDesc(t){ return ({too_broad:'너무 포괄적',opposite:'반대 진술',not_mentioned:'미언급',wrong_referent:'지시대상 오류',chronology:'시점/순서 오류',partial_truth:'부분적 사실',extreme_word:'극단어 함정',same_word:'동일어 함정',unknown:'기타'}[t]||t); }
function renderDashboard(){
  const st=loadStats(); const off=st.official||emptyBucket(), pr=st.practice||emptyBucket();
  const offAcc=off.attempts?Math.round(off.correct/off.attempts*100):0, prAcc=pr.attempts?Math.round(pr.correct/pr.attempts*100):0;
  const band=localStorage.getItem('paralex-band')||'';
  const bandSel=BANDS.map(b=>`<button class="pill ${band===b?'pill-band':'pill-orig'}" onclick="setBand('${b}')">${esc(b)}</button>`).join(' ');
  let recH;
  if(off.attempts<5){ recH=`<div class="kv" style="color:#fcd34d"><b>insufficient_data</b> — 공식 표본 부족(${off.attempts}/5). 현재 세트는 practice라 진단 미반영. 박사 검수 후 official 승격 시 활성화.</div>`; }
  else { const weak=Object.entries(off.skills).map(([k,v])=>[k,v.a?v.c/v.a:1]).sort((a,b)=>a[1]-b[1])[0]; const wk=weak?weak[0]:null; const cand=allSets().filter(s=>(s.skillFocus||[]).includes(wk)).slice(0,3);
    recH=`<div class="kv">약한 스킬: <b style="color:#5eead4">${esc(wk||'-')}</b> (${weak?Math.round(weak[1]*100):0}%)</div>`+cand.map(s=>`<button class="set-card" onclick="setState({view:'workbench',setId:'${s.id}'})"><div class="set-ic ${s.track==='news'?'news':'biz'}"><i class="fa-solid ${s.track==='news'?'fa-newspaper':'fa-briefcase'}"></i></div><div style="flex:1"><div style="font-weight:700;color:#f1f5f9">${esc(s.title)}</div><div style="font-size:11px;color:#94a3b8">${esc(s.scoreBandTarget||'')}</div></div></button>`).join(''); }
  const allSk={}; [off,pr].forEach(bk=>Object.entries(bk.skills||{}).forEach(([k,v])=>{allSk[k]=allSk[k]||{a:0,c:0}; allSk[k].a+=v.a; allSk[k].c+=v.c;}));
  const skillH=Object.entries(allSk).sort((a,b)=>(a[1].c/a[1].a)-(b[1].c/b[1].a)).map(([k,v])=>`<div class="kv"><div class="en">${esc(k)}</div><div class="ko">${v.a?Math.round(v.c/v.a*100):0}% (${v.c}/${v.a})</div></div>`).join('')||`<div class="kv" style="color:#64748b">스킬 데이터 없음</div>`;
  const prTags=Object.entries(pr.tags).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><div class="en">${esc(k)} <span style="color:#f43f5e">×${v}</span></div><div class="ko">${drDesc(k)}</div></div>`).join('')||`<div class="kv" style="color:#64748b">연습 오답 없음</div>`;
  return `<div class="h-title">Score Dashboard</div><div class="h-sub">official만 진단 반영 · practice 별도 (데스크톱과 통계 공유)</div>
    <div class="sec-h"><i class="fa-solid fa-crosshairs"></i>목표 밴드</div><div style="display:flex;gap:6px;flex-wrap:wrap">${bandSel}</div>
    <div class="stat-grid" style="margin-top:14px"><div class="stat-box"><div class="stat-n">${off.attempts}</div><div class="stat-l">공식 시도</div></div><div class="stat-box"><div class="stat-n">${offAcc}%</div><div class="stat-l">공식 정답률</div></div><div class="stat-box"><div class="stat-n">${pr.attempts}</div><div class="stat-l">연습 시도</div></div><div class="stat-box"><div class="stat-n">${prAcc}%</div><div class="stat-l">연습 정답률</div></div></div>
    <div class="sec-h"><i class="fa-solid fa-wand-magic-sparkles"></i>진단·추천</div>${recH}
    <div class="sec-h"><i class="fa-solid fa-chart-simple"></i>스킬별 정답률</div>${skillH}
    <div class="sec-h"><i class="fa-solid fa-triangle-exclamation"></i>오답 유형(연습)</div>${prTags}`;
}
function setBand(b){ localStorage.setItem('paralex-band',b); render(); }
function renderStrategy(){
  const tr=(window.PARALEX_STRATEGY&&window.PARALEX_STRATEGY.trends)||[]; const tp=(window.PARALEX_STRATEGY&&window.PARALEX_STRATEGY.traps)||[];
  const tH=tr.map(t=>`<div class="kv"><div class="en">${esc(t.title)}</div><div class="ko">${esc(t.desc)}</div></div>`).join('')||`<div class="kv" style="color:#64748b">전략 데이터 준비중</div>`;
  const pH=tp.map(t=>`<div class="kv"><div class="en">${esc(t.part)} · ${esc(t.title)}</div><div class="ko">${esc(t.why)} → <b style="color:#5eead4">${esc(t.avoid)}</b></div></div>`).join('');
  return `<div class="h-title">Strategy &amp; Traps</div><div class="h-sub">900→950 전략·함정 (경량 참조)</div>
    <div class="sec-h"><i class="fa-solid fa-arrow-trend-up"></i>출제 경향</div>${tH}${pH?`<div class="sec-h"><i class="fa-solid fa-bomb"></i>함정</div>${pH}`:''}`;
}
function renderVocab(){
  const d=(window.PARALEX_VOCAB&&window.PARALEX_VOCAB.cards)||[];
  const h=d.map(c=>`<div class="kv"><div class="en">${esc(c.lemma)} <span class="vtag">${esc(c.listTag||'')}</span></div><div class="ko">${esc(c.glossKo)}</div>${c.collocation?`<div class="meta">▪ ${esc(c.collocation)}</div>`:''}</div>`).join('')||`<div class="kv" style="color:#64748b">어휘 덱 준비중</div>`;
  return `<div class="h-title">Vocab Deck</div><div class="h-sub">NGSL·TSL·BSL·NAWL 오픈 코퍼스</div><div class="sec-h"><i class="fa-solid fa-layer-group"></i>시드 카드</div>${h}`;
}

(function boot(){
  const q=new URLSearchParams(location.search);
  const v=q.get('view'); if(['workbench','dashboard','strategy','vocab'].includes(v)) S.view=v;
  const sid=q.get('set'); if(sid && getSet(sid)){ S.view='workbench'; S.setId=sid; }
  render();
})();
</script>
</body>
</html>
