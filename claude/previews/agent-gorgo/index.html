<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Agent Gorgo World · 부산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root{
    --ink:#3b2f55; --ink2:#6b5f8a; --paper:#fffaf0; --paper2:#fff3dc; --line:#3b2f55;
    --gold:#ffd23f; --pink:#ff8fb1; --sky:#58ade8; --mint:#7fe0c0;
    --font:'Galmuri11','Galmuri9',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#58ade8;font-family:var(--font);color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #world{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

  /* 픽셀 박스 공통 */
  .pix{background:var(--paper);border:3px solid var(--line);border-radius:4px;
    box-shadow:0 3px 0 rgba(59,47,85,.35), inset 0 -3px 0 rgba(59,47,85,.08)}

  /* 지명 라벨 */
  .place{position:absolute;left:0;top:0;white-space:nowrap;font-family:'Galmuri9',var(--font);font-size:12px;
    padding:2px 7px 3px;border-radius:3px;color:#fff;letter-spacing:.5px;
    text-shadow:1px 0 #3b2f55,-1px 0 #3b2f55,0 1px #3b2f55,0 -1px #3b2f55,1px 1px #3b2f55}
  .place.k-mt{color:#eaffd8}
  .place.k-water{color:#e3f6ff;font-style:normal;opacity:.9}
  .place.k-beach{color:#fff3b0}
  .place.k-port{color:#ffe0e8}
  .place.k-bridge{color:#ffffff;font-size:11px}
  .place.k-area{color:#fff}
  .place.k-landmark{background:rgba(59,47,85,.72);text-shadow:none;font-size:11px;border:2px solid #fff}

  /* 업무 존 태그 */
  .zone-tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:6px 12px 7px;background:var(--paper);border:3px solid var(--line);border-radius:6px;
    box-shadow:0 3px 0 rgba(59,47,85,.4);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
  .zone-tag::after{content:'';position:absolute;bottom:-9px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--line)}
  .zone-tag b{font-size:13px}
  .zone-tag small{font-family:'Galmuri9',var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px}
  .zone-tag .zt-bang{position:absolute;top:-14px;right:-10px;width:22px;height:22px;display:grid;place-items:center;
    background:var(--gold);border:3px solid var(--line);border-radius:50%;font-size:12px;font-weight:bold}
  .zone-tag.near{background:#fff6c9}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}

  .nameplate{position:absolute;left:0;top:0;white-space:nowrap;font-family:'Galmuri9',var(--font);font-size:11px;
    padding:2px 7px;background:rgba(59,47,85,.82);color:#fff;border-radius:10px}
  .prompt{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;padding:6px 10px;background:var(--paper);
    border:3px solid var(--line);border-radius:6px;box-shadow:0 3px 0 rgba(59,47,85,.35);animation:bob 1s ease-in-out infinite}
  .prompt kbd{font-family:inherit;background:var(--gold);border:2px solid var(--line);border-radius:3px;padding:0 5px;margin-right:4px;font-size:11px}

  /* HUD */
  .hud{position:fixed;z-index:5}
  #loc{left:14px;top:14px;padding:8px 14px 9px;min-width:170px}
  #loc .lbl{font-family:'Galmuri9',var(--font);font-size:10px;color:var(--ink2);letter-spacing:2px}
  #loc-name{font-size:17px;margin-top:2px;display:block}
  #loc-coord{font-family:'Galmuri9',var(--font);font-size:10px;color:var(--ink2)}
  #loc.pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
  #brand{left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;display:flex;align-items:center;gap:8px;font-size:13px}
  #brand i{font-style:normal;background:var(--pink);color:#fff;border:2px solid var(--line);border-radius:3px;padding:0 6px;font-size:11px}
  #mm-wrap{right:14px;top:14px;padding:6px}
  #minimap{display:block;width:225px;height:135px;image-rendering:pixelated;border:2px solid var(--line);border-radius:2px}
  #mm-wrap .mm-t{font-family:'Galmuri9',var(--font);font-size:10px;display:flex;justify-content:space-between;padding:0 2px 4px;color:var(--ink2)}
  #help{left:14px;bottom:14px;padding:8px 12px;font-family:'Galmuri9',var(--font);font-size:11px;line-height:1.75}
  #help kbd{font-family:inherit;background:var(--paper2);border:2px solid var(--line);border-radius:3px;padding:0 4px}

  /* 모바일 */
  #joy{position:fixed;display:none;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
    background:rgba(255,250,240,.35);border:3px solid rgba(59,47,85,.6);z-index:6;pointer-events:none}
  #joy-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--line);transform:translate(-50%,-50%)}
  #act-btn{right:18px;bottom:22px;width:74px;height:74px;border-radius:50%;font-family:var(--font);font-size:13px;color:var(--ink);
    background:var(--gold);border:3px solid var(--line);box-shadow:0 4px 0 rgba(59,47,85,.4);display:none;opacity:.45}
  #act-btn.on{opacity:1;animation:bob 1s ease-in-out infinite}
  @media (hover:none) and (pointer:coarse){ #act-btn{display:block} #help{display:none} }
  @media (max-width:720px){ #mm-wrap{display:none} #brand{display:none} #loc{min-width:0} }

  /* 업무 패널 */
  #panel-dim{position:fixed;inset:0;background:rgba(40,30,70,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
  #panel{position:fixed;z-index:9;right:18px;top:50%;width:min(420px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;
    transform:translate(120%,-50%);transition:transform .38s cubic-bezier(.2,1.3,.4,1);padding:0}
  body.panel-open #panel{transform:translate(0,-50%)}
  body.panel-open #panel-dim{opacity:1;pointer-events:auto}
  #panel .p-head{display:flex;gap:12px;align-items:center;padding:16px 18px 14px;background:var(--zc,#4f8cff);color:#fff;border-bottom:3px solid var(--line)}
  #panel .p-icon{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:#fff;border:3px solid var(--line);border-radius:8px}
  #panel .p-title{font-size:19px;text-shadow:2px 2px 0 rgba(0,0,0,.18)}
  #panel .p-en{font-family:'Galmuri9',var(--font);font-size:10px;letter-spacing:1px;opacity:.9;margin-top:3px}
  #panel .p-close{margin-left:auto;align-self:flex-start;width:32px;height:32px;font-family:var(--font);font-size:15px;cursor:pointer;
    background:#fff;border:3px solid var(--line);border-radius:5px;color:var(--ink)}
  #panel .p-body{padding:16px 18px 18px}
  #panel .p-intro{font-size:13px;line-height:1.7;margin:0 0 12px}
  #panel .p-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  #panel .p-list li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 12px;background:var(--paper2);
    border:2px solid var(--line);border-radius:6px;opacity:0;animation:slidein .35s ease-out forwards;animation-delay:calc(var(--i) * 70ms + 120ms)}
  #panel .p-list b{display:block;font-size:13px}
  #panel .p-list small{display:block;font-family:'Galmuri9',var(--font);font-size:10px;color:var(--ink2);margin-top:3px}
  .chip{flex:none;font-family:'Galmuri9',var(--font);font-size:10px;padding:3px 7px;border:2px solid var(--line);border-radius:10px;background:#fff}
  .chip.soon{background:var(--gold)} .chip.wait{background:#eee8f7;color:var(--ink2)}
  #panel .p-foot{margin-top:14px;font-family:'Galmuri9',var(--font);font-size:10px;color:var(--ink2);text-align:center}
  @keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

  /* 인트로 */
  #intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,240,.55),rgba(88,173,232,.55));
    transition:opacity .5s, visibility .5s;cursor:pointer}
  #intro.gone{opacity:0;visibility:hidden}
  #intro .card{padding:26px 34px 22px;text-align:center;max-width:calc(100vw - 32px)}
  #intro .eyebrow{font-family:'Galmuri9',var(--font);font-size:11px;letter-spacing:3px;color:var(--ink2)}
  #intro h1{font-family:'Galmuri14','Galmuri11',var(--font);font-weight:normal;font-size:34px;margin:8px 0 4px;letter-spacing:1px}
  #intro h1 span{color:#ee4458}
  #intro .sub{font-size:14px;margin-bottom:16px}
  #intro canvas{image-rendering:pixelated;width:96px;height:126px;margin:4px auto 10px;display:block;animation:bob 1.2s ease-in-out infinite}
  #intro .go{display:inline-block;font-size:13px;padding:8px 16px;background:var(--gold);border:3px solid var(--line);border-radius:6px;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="labels"></div>

  <div id="loc" class="hud pix"><span class="lbl">CURRENT · 현재 위치</span><b id="loc-name">센텀시티</b><span id="loc-coord">000 · 000</span></div>
  <div id="brand" class="hud pix"><i>BUSAN</i> AGENT GORGO WORLD</div>
  <div id="mm-wrap" class="hud pix no-joy"><div class="mm-t"><span>부산 전도</span><span>◆ 업무 존</span></div><canvas id="minimap"></canvas></div>
  <div id="help" class="hud pix">
    <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> 이동 · <kbd>Shift</kbd> 달리기<br>
    <kbd>클릭</kbd> 그곳으로 걷기 · <kbd>Space</kbd> 들어가기 · <kbd>Esc</kbd> 닫기
  </div>

  <div id="joy"><div id="joy-knob"></div></div>
  <button id="act-btn" class="hud no-joy">들어가기</button>

  <div id="panel-dim"></div>
  <aside id="panel" class="pix no-joy" aria-live="polite">
    <div class="p-head">
      <div class="p-icon">🏢</div>
      <div><div class="p-title">-</div><div class="p-en">-</div></div>
      <button class="p-close" aria-label="닫기">✕</button>
    </div>
    <div class="p-body">
      <p class="p-intro"></p>
      <ul class="p-list"></ul>
      <div class="p-foot">업무 모듈은 박사님 지시에 따라 하나씩 추가됩니다 · Esc 로 닫기</div>
    </div>
  </aside>

  <div id="intro">
    <div class="card pix">
      <div class="eyebrow">BUSAN FIELD MAP · VOL.1</div>
      <h1>AGENT <span>GORGO</span></h1>
      <div class="sub">에이전트 고르고의 부산 업무 지도</div>
      <canvas id="intro-sprite" width="16" height="21"></canvas>
      <div class="go">아무 키나 눌러 출근하기</div>
    </div>
  </div>

  <script src="js/mapgen.js"></script>
  <script src="js/art.js"></script>
  <script src="js/gorgo.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function(){ // 인트로 캐릭터 미리보기
      var c=document.getElementById('intro-sprite'), x=c.getContext('2d'), f=window.Gorgo.build(), i=0, dirs=['down','right','up','left'], d=0;
      setInterval(function(){ i=(i+1)%4; if(i===0) d=(d+1)%4; x.clearRect(0,0,16,21); x.drawImage(f[dirs[d]][0][i],0,0); }, 160);
    })();
  </script>
</body>
</html>
