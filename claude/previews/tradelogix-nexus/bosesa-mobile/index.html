<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b8a3e">
<title>보세사 기출문제 — 모바일</title>
<meta name="description" content="보세사 자격시험 기출문제 모바일 뷰어 — 1~5과목 · 2019~2025년. 문제·정답·해설 + 중요개념 · 정답해설 빠른회독 · 희소유형.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --green:#0b8a3e; --green-bg:#e7f6ec; --blue:#1f6feb; --ink:#15181d; --sub:#6b7280; --line:#e6e8eb; --bg:#f4f6f8; --card:#ffffff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); word-break:keep-all; -webkit-text-size-adjust:100%;
    line-height:1.65; font-size:16px; padding-bottom:env(safe-area-inset-bottom); }
  /* ===== 상단 고정 선택바 (작게) ===== */
  header{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
    padding:8px 12px calc(8px) 12px; box-shadow:0 1px 6px rgba(0,0,0,.04); }
  .title{ font-size:16px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:6px; }
  .title .dot{ width:8px; height:8px; border-radius:3px; background:var(--green); }
  .title small{ font-size:11px; font-weight:600; color:var(--sub); }
  .rowlabel{ font-size:10px; font-weight:700; color:var(--sub); margin:6px 2px 3px; }
  .chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer; transition:.12s; }
  .chip.sub{ font-size:12px; padding:6px 10px; }
  .chip .sname{ font-weight:500; color:var(--sub); font-size:11px; margin-left:3px; }
  .chip.on{ background:var(--green); border-color:var(--green); color:#fff; }
  .chip.on .sname{ color:rgba(255,255,255,.85); }
  .topbar2{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .meta{ font-size:11.5px; color:var(--sub); font-weight:600; flex:1; min-width:0; }
  .ansBtn{ flex:0 0 auto; border:1px solid var(--green); color:var(--green); background:var(--green-bg);
    border-radius:8px; padding:6px 10px; font-size:12px; font-weight:800; cursor:pointer; }
  .ansBtn.off{ border-color:var(--line); color:var(--sub); background:#fff; }
  /* ===== 본문 (크게) ===== */
  main{ max-width:760px; margin:0 auto; padding:12px 12px 80px; }
  .qcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 15px; margin-bottom:14px; }
  .qhead{ display:flex; gap:9px; align-items:flex-start; }
  .qno{ flex:0 0 auto; min-width:30px; height:30px; padding:0 8px; border-radius:8px; background:var(--ink); color:#fff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .qtext{ flex:1; min-width:0; font-size:17.5px; font-weight:700; line-height:1.6; letter-spacing:0; overflow-wrap:anywhere; }
  ol.choices{ list-style:none; margin:14px 0 0; padding:0; }
  ol.choices li{ display:flex; align-items:flex-start; gap:8px; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; font-size:16px; line-height:1.55; background:#fff; }
  ol.choices li .cn{ flex:0 0 auto; font-weight:800; color:var(--sub); font-size:15px; padding-top:1px; }
  ol.choices li .ctext{ flex:1; min-width:0; }
  li.correct{ background:var(--green-bg); border-color:var(--green); }
  li.correct .cn{ color:var(--green); }
  li.correct::after{ content:'정답'; flex:0 0 auto; align-self:flex-start; font-size:10px; font-weight:800;
    color:#fff; background:var(--green); border-radius:5px; padding:2px 6px; white-space:nowrap; margin-top:2px; }
  .ansbox{ margin-top:13px; border-top:1px dashed var(--line); padding-top:12px; }
  .ans-line{ font-size:15px; font-weight:800; color:var(--green); margin-bottom:8px; }
  .ans-line .k{ color:var(--sub); font-weight:700; margin-right:5px; }
  .basis{ font-size:15.5px; line-height:1.72; background:#fbfbfc; border:1px solid var(--line); border-radius:10px; padding:12px 13px; white-space:pre-wrap; }
  .basis .k{ display:block; font-size:11px; font-weight:800; color:var(--green); margin-bottom:5px; letter-spacing:.02em; }
  details.ca{ margin-top:10px; }
  details.ca>summary{ cursor:pointer; list-style:none; font-size:12.5px; font-weight:800; color:var(--blue); padding:7px 0; }
  details.ca>summary::-webkit-details-marker{ display:none; }
  details.ca>summary::before{ content:'▸ '; }
  details.ca[open]>summary::before{ content:'▾ '; }
  .caitem{ font-size:14px; line-height:1.62; padding:8px 10px; border-radius:8px; background:#fafafa; margin-bottom:6px; }
  .caitem .cn{ font-weight:800; color:var(--sub); margin-right:5px; }
  .caitem.correct{ background:var(--green-bg); }
  .hidden{ display:none; }
  #loading,#empty{ text-align:center; color:var(--sub); padding:40px 16px; font-size:14px; }
  .totop{ position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:30;
    width:46px; height:46px; border-radius:50%; background:var(--ink); color:#fff; border:none; font-size:18px;
    box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; display:none; }
  footer{ text-align:center; font-size:10.5px; color:var(--sub); padding:14px; }
  /* ===== 중요 개념 (모바일) ===== */
  .cmeta{ margin-top:5px; }
  .impb{ display:inline-block; font-size:10px; font-weight:800; color:#fff; background:#b45309; border-radius:6px; padding:1px 7px; margin-right:4px; }
  .yrb{ display:inline-block; font-size:10px; font-weight:700; color:#3730a3; background:#eef2ff; border:1px solid #c7d2fe; border-radius:5px; padding:0 5px; margin:0 3px 3px 0; }
  .qbody{ font-size:16px; line-height:1.62; margin-top:11px; padding:11px 12px; background:#fafbfc; border:1px solid var(--line); border-radius:10px; white-space:pre-wrap; }
  .cbx{ font-size:14.5px; line-height:1.66; border-radius:10px; padding:11px 12px; margin-top:8px; border:1px solid var(--line); white-space:pre-wrap; }
  .cbx b{ display:block; font-size:11px; font-weight:800; margin-bottom:4px; letter-spacing:.02em; }
  .cbx ul{ margin:4px 0 0; padding-left:18px; } .cbx li{ margin:2px 0; }
  .cbx-key{ background:#e7f6ec; border-color:#a7e0bd; } .cbx-key b{ color:#0b8a3e; }
  .cbx-con{ background:#f3f6fb; border-color:#cdd9ea; } .cbx-con b{ color:#1f4e8f; }
  .cbx-trap{ background:#fdecef; border-color:#f5b5c0; } .cbx-trap b{ color:#c81e3a; }
  .cbx-cau{ background:#fff6e6; border-color:#f3d28a; } .cbx-cau b{ color:#9a6700; }
  .cbx-memo{ background:#e9f4fe; border-color:#a8d4f5; } .cbx-memo b{ color:#1167b1; }
  .cbx-law{ background:#f3eefe; border-color:#cdb8f0; } .cbx-law b{ color:#6b3fb5; }
  .srcref{ font-size:11px; color:var(--sub); margin-top:8px; }
  .chip.cept{ border-color:#f59e0b; color:#b45309; font-weight:800; }
  .chip.cept.on{ background:#f59e0b; border-color:#f59e0b; color:#fff; }
  /* 중요개념 — 연도별 출제 이력 (모바일) */
  .cehist{ margin-top:12px; background:#fffaf0; border:1px solid #f3d28a; border-radius:12px; padding:11px 12px; }
  .cehist-h{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; font-weight:900; color:#9a6700; }
  .cehist-v{ font-size:10.5px; font-weight:800; color:#92400e; background:#fef3c7; border:1px solid #fbbf24; border-radius:999px; padding:2px 7px; }
  .cehist-note{ font-size:11px; color:#795100; line-height:1.45; margin-top:5px; }
  .cehist-row{ margin-top:8px; padding-top:8px; border-top:1px solid #f3d28a; }
  .cehist-top{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .cehist-y{ font-size:11px; font-weight:900; color:#fff; background:#b45309; border-radius:6px; padding:2px 7px; }
  .cehist-q{ font-size:11px; font-weight:800; color:#92400e; background:#fff; border:1px solid #f3d28a; border-radius:6px; padding:2px 7px; }
  .cehist-a{ font-size:11px; font-weight:900; color:#0b8a3e; background:#e7f6ec; border:1px solid #a7e0bd; border-radius:6px; padding:2px 7px; }
  .cehist-stem{ font-size:12px; line-height:1.5; color:#1f2937; margin-top:5px; overflow-wrap:anywhere; }
  .cehist-ansx{ font-size:11.5px; line-height:1.45; color:#4b5563; margin-top:4px; overflow-wrap:anywhere; }
  .cehist .seclabel{ color:#9a6700; margin-top:8px; }
  .cehist ol.choices{ margin-top:5px; }
  .cehist ol.choices li{ background:#fff; border-color:#f3d28a; padding:8px 10px; font-size:12px; line-height:1.45; }
  .cehist ol.choices li.correct{ background:#e7f6ec; border-color:#a7e0bd; color:#065f46; font-weight:800; }
  /* ===== 정답 해설 · 빠른회독 (모바일) ===== */
  .chip.ansk{ border-color:#0b8a3e; color:#0b8a3e; font-weight:800; }
  .chip.ansk.on{ background:#0b8a3e; border-color:#0b8a3e; color:#fff; }
  /* 정답해설 연도 탭 (콘텐츠 내) */
  .an-yeartabs{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .an-yeartab{ font-size:14px; font-weight:800; color:#0b8a3e; background:#fff; border:1px solid #a7e0bd;
    border-radius:10px; padding:8px 13px; cursor:pointer; line-height:1; }
  .an-yeartab small{ font-size:10px; font-weight:600; opacity:.7; margin-left:5px; }
  .an-yeartab.on{ background:#0b8a3e; border-color:#0b8a3e; color:#fff; box-shadow:0 2px 8px rgba(11,138,62,.28); }
  .an-yeartab.off{ color:#9aa3ad; background:#f4f6f8; border-color:var(--line); cursor:not-allowed; }
  .an-yeartab:active{ filter:brightness(.96); }
  /* ===== 희소 유형 (모바일) ===== */
  .chip.rare{ border-color:#db2777; color:#9d174d; font-weight:800; }
  .chip.rare.on{ background:#db2777; border-color:#db2777; color:#fff; }
  .chip.mid{ border-color:#0284c7; color:#0369a1; font-weight:800; }
  .chip.mid.on{ background:#0284c7; border-color:#0284c7; color:#fff; }
  .mb-tier{ display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#0284c7; border-radius:6px; padding:2px 8px; }
  .mb-src{ display:inline-block; font-size:10.5px; font-weight:700; color:#0369a1; background:#e0f2fe; border:1px solid #7dd3fc; border-radius:6px; padding:2px 8px; }
  .mb-mem{ display:inline-block; font-size:10.5px; font-weight:700; color:#0369a1; background:#f0f9ff; border:1px solid #bae6fd; border-radius:6px; padding:2px 7px; margin:0 4px 4px 0; }
  /* 카테고리 안내 박스 + 공통 라벨 */
  .catbar{ background:#fff; border:1px solid var(--line); border-radius:13px; padding:13px 14px; margin-bottom:13px; }
  .catbar .ct{ font-size:14px; font-weight:800; }
  .catbar .cd{ font-size:12px; color:var(--sub); margin-top:4px; line-height:1.55; }
  .catbar .cd b{ color:var(--ink); }
  .seclabel{ font-size:11px; font-weight:800; color:var(--green); margin:13px 2px 5px; letter-spacing:.02em; }
  .yearsep{ background:var(--green); color:#fff; font-size:14px; font-weight:800; border-radius:11px;
    padding:9px 14px; margin:20px 0 11px; box-shadow:0 2px 8px rgba(11,138,62,.22); }
  .yearsep small{ font-weight:600; opacity:.85; font-size:11px; margin-left:7px; }
  .anhead{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .yrtag{ display:inline-block; font-size:12px; font-weight:800; color:#0b8a3e; background:#e7f6ec; border:1px solid #a7e0bd; border-radius:7px; padding:2px 9px; }
  .formtag{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--sub); }
  .anschip{ display:flex; gap:8px; align-items:flex-start; background:#e7f6ec; border:1px solid #a7e0bd;
    border-radius:10px; padding:10px 12px; font-size:15.5px; line-height:1.55; margin-top:8px; overflow-wrap:anywhere; }
  .anschip .cn{ flex:0 0 auto; font-weight:800; color:#0b8a3e; }
  .rb-rarity{ display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#db2777; border-radius:6px; padding:2px 8px; }
  .rb-src{ display:inline-block; font-size:10.5px; font-weight:700; color:#9d174d; background:#fce7f3; border:1px solid #f9a8d4; border-radius:6px; padding:2px 8px; }
  .qnobtn{ margin-top:13px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 13px; cursor:pointer; }
  .qnobtn:active{ background:#f4f6f8; }
</style>
</head>
<body>

<header>
  <div class="title"><span class="dot"></span>보세사 기출문제 <small>모바일 뷰어 · 1~5과목 · 2019~2025</small></div>
  <div class="rowlabel">과목</div>
  <div class="chips" id="subjectChips"></div>
  <div class="rowlabel">연도 · 학습 카테고리</div>
  <div class="chips" id="yearChips"></div>
  <div id="formRow" class="hidden">
    <div class="rowlabel">유형 <small style="color:var(--sub);font-weight:600">· 2023년 1과목 A·B형</small></div>
    <div class="chips" id="formChips"></div>
  </div>
  <div class="topbar2">
    <span class="meta" id="meta">과목·연도를 선택하세요</span>
    <button class="ansBtn" id="ansToggle">정답·해설 표시</button>
  </div>
</header>

<main>
  <div id="loading" class="hidden">문제를 불러오는 중…</div>
  <div id="empty" class="hidden">데이터를 찾을 수 없습니다.</div>
  <div id="qlist"></div>
</main>

<button class="totop" id="totop" aria-label="맨 위로">↑</button>
<footer>보세사 자격시험 기출문제 · 학습용 뷰어 (정답·해설은 기출 정답표 기준) · G.M.PARK</footer>

<script>
(function(){
  "use strict";
  var SUBJECTS = [
    { no:1, name:'수출입통관절차' },
    { no:2, name:'보세구역관리' },
    { no:3, name:'화물관리' },
    { no:4, name:'수출입안전관리' },
    { no:5, name:'자율관리 및 관세벌칙' }
  ];
  var YEARS = [2025,2024,2023,2022,2021,2020,2019];
  var CN = ['①','②','③','④','⑤','⑥','⑦','⑧'];
  // view: 'exam' | 'concepts' | 'answerNotes' | 'rareTypes'
  var state = { subject:1, year:2025, answerYear:'all', form:'A', answersShown:true, view:'exam' };
  // B형 보유 여부 (현재 2023년 1과목만 A·B형 두 유형)
  function hasBForm(s,y){ return s===1 && y===2023; }

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function nn(){ for(var i=0;i<arguments.length;i++){ if(arguments[i]!=null) return arguments[i]; } return ''; }
  function subjName(s){ var o=SUBJECTS.filter(function(x){return x.no===s;})[0]; return o?o.name:''; }
  function qNoOf(q,i){ return q.no!=null?q.no:(q.id!=null?q.id:(q.number!=null?q.number:i+1)); }
  function ansArr(v){ return Array.isArray(v)? v : (v!=null?[v]:[]); }
  // 선지/선지분석은 문자열 또는 {label,text}/{reason,text} 객체 두 형태가 섞여 있어 정규화(기존 뷰어와 동일)
  function choiceText(c){ var t = (c && typeof c==='object') ? nn(c.text, c.label) : c; return String(t==null?'':t).replace(/^[①②③④⑤⑥⑦⑧]\s*/,''); }
  function analysisText(a){ var t = (a && typeof a==='object') ? nn(a.reason, a.text) : a; return String(t==null?'':t); }

  // const(전역 lexical)로 선언된 BOSESA_* 를 이름으로 가져오기 (window 속성 아님 → direct eval)
  function getData(s,y,form){
    var n='BOSESA_DATA_'+s+'_'+y;
    if(form==='B' && hasBForm(s,y)) n+='B';   // 2023 1과목 B형 = BOSESA_DATA_1_2023B
    try { return eval('typeof '+n+'!=="undefined" ? '+n+' : null'); } catch(e){ return null; }
  }
  function findQuestion(s,y,no,form){
    var src=getData(s,y,form||'A');
    if(!src || !Array.isArray(src.questions)) return null;
    for(var i=0;i<src.questions.length;i++){
      if(qNoOf(src.questions[i],i)===no) return src.questions[i];
    }
    return null;
  }
  function getConcepts(s){ var n='BOSESA_CONCEPTS_'+s; try { return eval('typeof '+n+'!=="undefined" ? '+n+' : null'); } catch(e){ return null; } }
  function getRareTypes(){ try { return eval('typeof BOSESA_RARE_TYPES!=="undefined" ? BOSESA_RARE_TYPES : null'); } catch(e){ return null; } }
  function getMidFreq(){ try { return eval('typeof BOSESA_MID_FREQ!=="undefined" ? BOSESA_MID_FREQ : null'); } catch(e){ return null; } }
  var NUM_SUBJECTS=[1,2,4];  // '숫자 정리' 데이터가 있는 과목(추가 시 갱신)
  function getNum(s){ try { var w=(typeof window!=="undefined")?window['BOSESA_NUM'+s]:null; if(w)return w; return eval('typeof BOSESA_NUM'+s+'!=="undefined" ? BOSESA_NUM'+s+' : null'); } catch(e){ return null; } }

  // ===== 데이터 파일 주입 + 폴링 로더 (script const 재선언 충돌 방지: 1회만 주입) =====
  var MOBILE_ASSET_VERSION = '20260626-concepts-history-choices';
  var injected = {};
  function versionedSrc(src){
    if(src.indexOf('../bosesa-concepts-')===0) return src + '?v=' + MOBILE_ASSET_VERSION;
    return src;
  }
  function injectOnce(src){
    var finalSrc = versionedSrc(src);
    if(injected[finalSrc]) return;
    injected[finalSrc]=true;
    var sc=document.createElement('script'); sc.src=finalSrc; document.head.appendChild(sc);
  }
  function waitFor(pred, cb){ var t=0; (function w(){ if(pred()||t>80){ cb(); return; } t++; setTimeout(w,40); })(); }

  // ===== 공통 렌더 헬퍼 (정답해설/희소유형) =====
  function answerChips(q, ans){
    return ans.map(function(n){
      var t = choiceText((q.choices||[])[n-1] || '');
      return '<div class="anschip"><span class="cn">'+(CN[n-1]||n)+'</span><span>'+esc(t)+'</span></div>';
    }).join('');
  }
  function correctAnalysis(q, ans){
    if(!Array.isArray(q.choiceAnalysis)) return [];
    return ans.map(function(n){ return analysisText(q.choiceAnalysis[n-1]); }).filter(Boolean);
  }
  function listOf(arr){ return (Array.isArray(arr)&&arr.length) ? '<ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : ''; }

  function renderChips(){
    $('subjectChips').innerHTML = SUBJECTS.map(function(s){
      return '<button class="chip'+(s.no===state.subject?' on':'')+'" data-s="'+s.no+'">'+s.no+'과목<span class="sname">'+esc(s.name)+'</span></button>';
    }).join('');
    var v = state.view;
    var yc = YEARS.map(function(y){
      return '<button class="chip sub'+(v==='exam'&&y===state.year?' on':'')+'" data-y="'+y+'">'+y+'</button>';
    }).join('');
    yc += '<button class="chip sub cept'+(v==='concepts'?' on':'')+'" data-view="concepts">⭐ 중요개념</button>';
    yc += '<button class="chip sub ansk'+(v==='answerNotes'?' on':'')+'" data-view="answerNotes">⚡ 정답해설</button>';
    yc += '<button class="chip sub rare'+(v==='rareTypes'?' on':'')+'" data-view="rareTypes">💎 희소유형</button>';
    yc += '<button class="chip sub mid'+(v==='midFreq'?' on':'')+'" data-view="midFreq">📊 중빈도</button>';
    yc += '<button class="chip sub cov'+(v==='coverage'?' on':'')+'" data-view="coverage">🗂 유형분포</button>';
    if(NUM_SUBJECTS.indexOf(state.subject)>=0) yc += '<button class="chip sub num4'+(v==='numbers'?' on':'')+'" data-view="numbers">#️⃣ 숫자정리</button>';
    $('yearChips').innerHTML = yc;
    // 유형(A형/B형) 토글 — 기출 보기 + B형 보유 연도/과목에서만 노출
    var formRow=$('formRow');
    if(v==='exam' && hasBForm(state.subject,state.year)){
      formRow.classList.remove('hidden');
      $('formChips').innerHTML = ['A','B'].map(function(f){
        return '<button class="chip sub'+(f===state.form?' on':'')+'" data-f="'+f+'">'+f+'형</button>';
      }).join('');
    } else {
      formRow.classList.add('hidden');
    }
  }

  // 현재 view에 맞는 로더 호출
  function reloadCurrent(){
    if(state.view==='concepts') loadConcepts();
    else if(state.view==='answerNotes') loadAnswerNotes();
    else if(state.view==='rareTypes') loadRareTypes();
    else if(state.view==='midFreq') loadMidFreq();
    else if(state.view==='coverage') loadCoverage();
    else if(state.view==='numbers') loadNumbers();
    else load();
  }
  function switchView(v){ state.view=v; renderChips(); syncAnsToggle(); reloadCurrent(); }
  function syncAnsToggle(){
    // 정답해설/희소유형/중빈도/유형분포는 항상 해설 노출 → 토글 숨김
    $('ansToggle').style.display = (state.view==='answerNotes'||state.view==='rareTypes'||state.view==='midFreq'||state.view==='coverage'||state.view==='numbers') ? 'none' : '';
  }

  // ===== 기출 보기 =====
  function load(){
    var s=state.subject, y=state.year;
    var src='../bosesa-data-'+s+'-'+y+((state.form==='B'&&hasBForm(s,y))?'b':'')+'.js';
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    if(getData(s,y,state.form)){ render(); return; }
    $('loading').classList.remove('hidden');
    injectOnce(src);
    waitFor(function(){ return getData(s,y,state.form)!=null; }, function(){
      $('loading').classList.add('hidden');
      if(getData(s,y,state.form)) render(); else $('empty').classList.remove('hidden');
    });
  }

  function render(){
    var data = getData(state.subject, state.year, state.form);
    var sname = subjName(state.subject);
    if (!data || !data.questions) { $('empty').classList.remove('hidden'); $('meta').textContent=state.year+'년 '+state.subject+'과목'; return; }
    $('meta').textContent = state.year+'년 · '+state.subject+'과목 '+sname+' · 총 '+(data.totalQuestions||data.questions.length)+'문항'+(data.answerForm?(' · '+data.answerForm):'');
    var show = state.answersShown;
    var html = data.questions.map(function(q,idx){
      var qno = qNoOf(q,idx);
      var qtext = nn(q.text, q.stemText, q.question);
      var ans = ansArr(q.answer);
      var basis = nn(q.answerBasis, q.explanation);
      var CA = Array.isArray(q.choiceAnalysis)? q.choiceAnalysis : null;
      var choices = (q.choices||[]).map(function(c,i){
        var isC = show && ans.indexOf(i+1)>=0;
        return '<li class="'+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span><span class="ctext">'+esc(choiceText(c))+'</span></li>';
      }).join('');
      var ansNums = ans.map(function(a){ return CN[a-1]||a; }).join(', ');
      var caHTML = CA ? ('<details class="ca"><summary>선지별 분석 보기</summary>'+CA.map(function(t,i){
        var isC = ans.indexOf(i+1)>=0;
        return '<div class="caitem '+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span>'+esc(analysisText(t))+'</div>';
      }).join('')+'</details>') : '';
      var ansbox = '<div class="ansbox'+(show?'':' hidden')+'">'
        + (ansNums?'<div class="ans-line"><span class="k">정답</span>'+ansNums+'</div>':'')
        + (basis?'<div class="basis"><span class="k">해설</span>'+esc(basis)+'</div>':'')
        + caHTML + '</div>';
      return '<div class="qcard"><div class="qhead"><span class="qno">'+esc(qno)+'</span><div class="qtext">'+esc(qtext)+'</div></div>'
        + '<ol class="choices">'+choices+'</ol>' + ansbox + '</div>';
    }).join('');
    $('qlist').innerHTML = html;
    window.scrollTo(0,0);
  }

  // ===== 중요 개념 =====
  function loadConcepts(){
    var s=state.subject;
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    if(getConcepts(s)){ renderConcepts(); return; }
    $('loading').classList.remove('hidden');
    injectOnce('../bosesa-concepts-'+s+'.js');
    waitFor(function(){ return getConcepts(s)!=null; }, function(){
      $('loading').classList.add('hidden');
      if(getConcepts(s)) renderConcepts();
      else { $('empty').classList.remove('hidden'); $('meta').textContent=s+'과목 중요개념 준비 중'; }
    });
  }

  function renderConcepts(){
    var data = getConcepts(state.subject);
    var sname = subjName(state.subject);
    if(!data || !data.concepts){ $('empty').classList.remove('hidden'); $('meta').textContent=state.subject+'과목 중요개념'; return; }
    $('meta').textContent = state.subject+'과목 '+sname+' · 중요 개념 '+data.concepts.length+'개 · 7개년 빈출';
    var show = state.answersShown;
    function sec(cls,label,txt){ return txt? '<div class="cbx '+cls+'"><b>'+label+'</b>'+esc(txt)+'</div>':''; }
    function secList(cls,label,arr){ if(!Array.isArray(arr)||!arr.length) return ''; return '<div class="cbx '+cls+'"><b>'+label+'</b><ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'; }
    var VLABEL = {
      varied:'발문·선지 변형',
      sameStemDiffChoices:'발문 동일·선지 교체',
      verbatim:'거의 동일 반복',
      single:'단일 출제'
    };
    function examHistory(c){
      var ex = Array.isArray(c.examByYear) ? c.examByYear : [];
      if(!ex.length) return '';
      var vtag = c.variation && VLABEL[c.variation]
        ? '<span class="cehist-v">'+VLABEL[c.variation]+'</span>' : '';
      var rows = ex.map(function(e){
        var q = (!Array.isArray(e.choices) || !e.choices.length) ? findQuestion(state.subject, Number(e.year), Number(e.no), e.form||'A') : null;
        var a = q ? ansArr(q.answer) : ansArr(e.answer);
        var aLbl = a.map(function(x){ return CN[x-1] || x; }).join('');
        var at = Array.isArray(e.answerText) ? e.answerText : (e.answerText ? [e.answerText] : []);
        var atHTML = at.length
          ? '<div class="cehist-ansx">→ <b>정답 '+aLbl+'</b> · '+esc(at.join(' / '))+'</div>' : '';
        var yChoices = (Array.isArray(e.choices) && e.choices.length)
          ? e.choices
          : (q && Array.isArray(q.choices) ? q.choices.map(choiceText) : []);
        var choicesHTML = yChoices.length
          ? '<div class="seclabel">선지</div><ol class="choices">'+yChoices.map(function(ch,i){
              var isC = show && a.indexOf(i+1)>=0;
              return '<li class="'+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span><span class="ctext">'+esc(String(ch).replace(/^[①②③④⑤⑥⑦⑧]\s*/,''))+'</span></li>';
            }).join('')+'</ol>'
          : '';
        return '<div class="cehist-row"><div class="cehist-top">'
          + '<span class="cehist-y">'+esc(e.year)+'</span>'
          + '<span class="cehist-q">Q'+esc(e.no)+'</span>'
          + (aLbl?'<span class="cehist-a">정답 '+aLbl+'</span>':'')
          + '</div>'
          + (e.stem?'<div class="cehist-stem">'+esc(e.stem)+'</div>':'')
          + atHTML
          + choicesHTML
          + '</div>';
      }).join('');
      return '<div class="cehist"><div class="cehist-h">↻ 연도별 출제 이력 '+vtag+'</div>'
        + (c.variationNote?'<div class="cehist-note">'+esc(c.variationNote)+'</div>':'')
        + rows
        + '</div>';
    }
    var html = data.concepts.map(function(c,idx){
      var n=idx+1;
      var ans = ansArr(c.answer);
      var yrs = Array.isArray(c.years)? c.years.slice().sort() : [];
      var choices=(c.choices||[]).map(function(ch,i){
        var isC = show && ans.indexOf(i+1)>=0;
        return '<li class="'+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span><span class="ctext">'+esc(choiceText(ch))+'</span></li>';
      }).join('');
      var ansNums = ans.map(function(a){ return CN[a-1]||a; }).join(', ');
      var box = show ? ('<div class="ansbox">'
        + (ansNums?'<div class="ans-line"><span class="k">정답</span>'+ansNums+'</div>':'')
        + sec('cbx-key','실제 정답',c.answerKey)
        + sec('cbx-con','핵심 개념',c.conceptExplanation)
        + sec('cbx-trap','오답 유도 포인트',c.trapAnalysis)
        + secList('cbx-cau','조심할 것',c.cautions)
        + secList('cbx-memo','암기 포인트',c.memorize)
        + sec('cbx-law','법령 근거',c.lawBasis)
        + (c.sourceRef?'<div class="srcref">근거 기출: '+esc(c.sourceRef)+'</div>':'')
        + '</div>') : '<div class="srcref">‘정답·해설 표시’로 해설을 펼치세요.</div>';
      var badges = '<span class="impb">'+esc(c.importance||'중요')+'</span>'+yrs.map(function(y){return '<span class="yrb">'+y+'</span>';}).join('');
      return '<div class="qcard"><div class="qhead"><span class="qno" style="background:#b45309;font-size:12px">★'+n+'</span>'
        + '<div class="qtext">'+esc(c.title||'')+'<div class="cmeta">'+badges+'</div></div></div>'
        + '<div class="qbody">'+esc(c.question||'')+'</div>'
        + '<ol class="choices">'+choices+'</ol>' + examHistory(c) + box + '</div>';
    }).join('');
    $('qlist').innerHTML = html;
    window.scrollTo(0,0);
  }

  // ===== 정답 해설 · 빠른회독 (7개년 정답·근거만) =====
  function loadAnswerNotes(){
    var s=state.subject;
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    $('loading').classList.remove('hidden');
    YEARS.forEach(function(y){ injectOnce('../bosesa-data-'+s+'-'+y+'.js'); });
    waitFor(function(){ return YEARS.every(function(y){ return getData(s,y,'A')!=null; }); }, function(){
      $('loading').classList.add('hidden'); renderAnswerNotes();
    });
  }

  // 연도별 + 전체 합본 보기 (박사 지시 2026-06-24): 「전체」 탭(2025 왼쪽) + 연도별 탭
  function renderAnswerNotes(){
    var s=state.subject;
    var avail = YEARS.filter(function(y){ var d=getData(s,y,'A'); return d && d.questions && d.questions.length; });
    var total = avail.reduce(function(sum,y){ var d=getData(s,y,'A'); return sum + ((d&&d.questions)?d.questions.length:0); }, 0);

    // 선택: 'all'(전체 합본) 또는 연도. 기본 'all'.
    var sel = state.answerYear;
    if(sel!=='all'){
      sel = (YEARS.indexOf(sel)>=0) ? sel : 'all';
      if(sel!=='all' && avail.length && avail.indexOf(sel)<0) sel = avail[0] || 'all';
    }
    state.answerYear = sel;

    function cardOf(q, idx, year, data){
      var qno=qNoOf(q,idx), qtext=nn(q.text,q.stemText,q.question);
      var ans=ansArr(q.answer);
      var basis=nn(q.answerBasis,q.explanation);
      var ca=correctAnalysis(q,ans);
      return '<div class="qcard" id="an-'+year+'-'+qno+'">'
        + '<div class="anhead"><span class="yrtag">'+year+'년 · '+esc(qno)+'번</span><span class="formtag">'+esc(data.answerForm||'A형')+'</span></div>'
        + '<div class="qtext" style="margin-top:10px">'+esc(qtext)+'</div>'
        + '<div class="seclabel">정답</div>'+answerChips(q,ans)
        + (basis?'<div class="basis" style="margin-top:10px"><span class="k">정답 근거</span>'+esc(basis)+'</div>':'')
        + (ca.length?'<div class="cbx cbx-key" style="margin-top:8px"><b>정답 선지 해설</b>'+ca.map(esc).join('<br>')+'</div>':'')
        + '</div>';
    }
    function mkTab(label, val, on, has, badge){
      return '<button class="an-yeartab'+(on?' on':'')+(has?'':' off')+'"'+(has?' data-anyear="'+val+'"':' disabled')+'>'+label+'<small>'+badge+'</small></button>';
    }
    var allTab = mkTab('전체','all', sel==='all', true, total);
    var yearTabs = YEARS.map(function(y){
      var has = avail.indexOf(y)>=0;
      return mkTab(String(y), y, sel===y, has, has?getData(s,y,'A').questions.length:'–');
    }).join('');

    var body;
    if(sel==='all'){
      body = YEARS.map(function(y){
        var data=getData(s,y,'A');
        if(!data || !data.questions) return '';
        var cards = data.questions.map(function(q,idx){ return cardOf(q,idx,y,data); }).join('');
        return '<div class="yearsep" id="an-y-'+y+'">'+y+'년 '+s+'과목<small>'+data.questions.length+'문항 · 정답·근거만</small></div>'+cards;
      }).join('');
      $('meta').textContent = s+'과목 '+subjName(s)+' · 정답 해설 빠른회독 · 전체 '+total+'문항';
    } else {
      var d2=getData(s,sel,'A');
      var cards2 = (d2 && d2.questions) ? d2.questions.map(function(q,idx){ return cardOf(q,idx,sel,d2); }).join('') : '';
      body = '<div class="yearsep">'+sel+'년 '+s+'과목<small>'+((d2&&d2.questions)?d2.questions.length:0)+'문항 · 정답·근거만</small></div>'
        + (cards2 || '<div class="srcref" style="padding:14px;text-align:center">'+sel+'년 '+s+'과목 정답 해설은 아직 준비 중입니다.</div>');
      $('meta').textContent = s+'과목 '+subjName(s)+' · 정답 해설 빠른회독 · '+sel+'년 '+((d2&&d2.questions)?d2.questions.length:0)+'문항';
    }
    var curInfo = (sel==='all')
      ? '7개년 누적 <b>'+total+'</b>문항을 한 번에. 「전체」 또는 연도 탭으로 전환.'
      : '7개년 누적 <b>'+total+'</b>문항. 현재 <b>'+sel+'년</b>. 「전체」 또는 다른 연도 탭으로 전환.';
    var intro = '<div class="catbar"><div class="ct">⚡ 정답 해설 · 빠른회독</div>'
      + '<div class="cd">'+curInfo+' 오답 선지는 숨기고 <b>공식 정답 · 정답 근거 · 정답 선지 해설</b>만 회독.</div></div>'
      + '<div class="an-yeartabs">'+allTab+yearTabs+'</div>';
    $('qlist').innerHTML = intro + body;
    window.scrollTo(0,0);
  }

  // ===== 희소 유형 · 낯선·저빈출 =====
  function loadRareTypes(){
    var s=state.subject;
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    $('loading').classList.remove('hidden');
    injectOnce('../bosesa-rare-types.js');
    YEARS.forEach(function(y){ injectOnce('../bosesa-data-'+s+'-'+y+'.js'); });
    waitFor(function(){ return getRareTypes()!=null && YEARS.every(function(y){ return getData(s,y,'A')!=null; }); }, function(){
      $('loading').classList.add('hidden'); renderRareTypes();
    });
  }

  // 전 선지 + 선지별(정답·오답) 해설 — 중빈도/희소 학습뷰 공용 (박사 지시 2026-06-25, 원본 choiceAnalysis 노출)
  function covAllChoicesHTML(q){
    if(!q || !Array.isArray(q.choices)) return '';
    var ans=ansArr(q.answer);
    var lis=q.choices.map(function(c,i){
      var isC=ans.indexOf(i+1)>=0;
      return '<li class="'+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span><span class="ctext">'+esc(choiceText(c))+'</span></li>';
    }).join('');
    return '<div class="seclabel">모든 선지 (정답 강조)</div><ol class="choices">'+lis+'</ol>';
  }
  function covChoiceAnalysisHTML(q){
    if(!q || !Array.isArray(q.choiceAnalysis)) return '';
    var ans=ansArr(q.answer);
    var rows=q.choiceAnalysis.map(function(a,i){
      var isC=ans.indexOf(i+1)>=0, t=analysisText(a); if(!t) return '';
      return '<div class="caitem '+(isC?'correct':'')+'"><span class="cn">'+(CN[i]||(i+1))+'</span>'+esc(t)+'</div>';
    }).join('');
    return rows ? '<div class="seclabel">선지별 분석 · 정답 근거 + 오답 이유</div>'+rows : '';
  }

  function renderRareTypes(){
    var s=state.subject;
    var all=getRareTypes();
    var data = (all && all.subjects) ? (all.subjects[s] || all.subjects[String(s)]) : null;
    if(!data || !Array.isArray(data.items)){ $('empty').classList.remove('hidden'); $('meta').textContent=s+'과목 희소 유형'; return; }
    var cards = data.items.map(function(item,idx){
      var src=getData(s,item.year,'A');
      var q=null;
      if(src && Array.isArray(src.questions)) q=src.questions.find(function(x,i){ return qNoOf(x,i)===item.questionNo; });
      var form=(src&&src.answerForm)||'A형';
      var ans=q?ansArr(q.answer):[];
      var qtext=q?nn(q.text,q.stemText,q.question):'';
      var basis=q?nn(q.answerBasis,q.explanation):'';
      var ca=q?correctAnalysis(q,ans):[];
      var ansHTML = q? answerChips(q,ans) : '<div class="srcref" style="color:#db2777">대표 문항을 찾지 못했습니다.</div>';
      return '<div class="qcard" id="rare-'+s+'-'+(idx+1)+'">'
        + '<div class="anhead"><span class="rb-rarity">희소유형 '+(idx+1)+'</span><span class="rb-src">'+esc(item.rarity||'저빈출')+'</span></div>'
        + '<div class="qtext" style="margin-top:9px">'+esc(item.title||'')+'</div>'
        + '<div class="srcref" style="margin-top:6px">근거 기출: <b style="color:#9d174d">'+item.year+'년 '+esc(item.questionNo)+'번 · '+esc(form)+'</b></div>'
        + '<div class="seclabel" style="color:#9d174d">대표문항</div>'
        + '<div class="qbody">'+esc(qtext)+'</div>'
        + covAllChoicesHTML(q)
        + (item.reason?'<div class="cbx cbx-trap"><b>희소성 판단</b>'+esc(item.reason)+'</div>':'')
        + (item.studyFocus?'<div class="cbx cbx-con"><b>공부 포인트</b>'+esc(item.studyFocus)+'</div>':'')
        + ((item.watch&&item.watch.length)?'<div class="cbx cbx-cau"><b>다시 나오면 볼 것</b>'+listOf(item.watch)+'</div>':'')
        + (item.ifReappears?'<div class="cbx cbx-memo"><b>재출제 대응</b>'+esc(item.ifReappears)+'</div>':'')
        + (basis?'<div class="basis" style="margin-top:8px"><span class="k">정답 근거</span>'+esc(basis)+'</div>':'')
        + covChoiceAnalysisHTML(q)
        + '<button class="qnobtn" data-goyear="'+item.year+'">→ '+item.year+'년 원문 문제로 이동</button>'
        + '</div>';
    }).join('');
    $('meta').textContent = s+'과목 '+subjName(s)+' · 희소 유형 '+data.items.length+'개 · 저빈출';
    var intro = '<div class="catbar"><div class="ct">💎 희소 유형 · 낯선·저빈출</div>'
      + '<div class="cd">'+esc((all&&all.years)||'2019~2025')+' 기출 역방향 분석 · 총 <b>'+data.items.length+'</b>개. 빈출 개념에 덜 묶이는 절차·예외·기관/기간 매칭 유형.</div></div>';
    $('qlist').innerHTML = intro + cards;
    window.scrollTo(0,0);
  }

  // ===== 중빈도 유형 · 남은 문항 =====
  function loadMidFreq(){
    var s=state.subject;
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    $('loading').classList.remove('hidden');
    injectOnce('../bosesa-midfreq.js');
    YEARS.forEach(function(y){ injectOnce('../bosesa-data-'+s+'-'+y+'.js'); });
    waitFor(function(){ return getMidFreq()!=null && YEARS.every(function(y){ return getData(s,y,'A')!=null; }); }, function(){
      $('loading').classList.add('hidden'); renderMidFreq();
    });
  }

  function renderMidFreq(){
    var s=state.subject;
    var all=getMidFreq();
    var data = (all && all.subjects) ? (all.subjects[s] || all.subjects[String(s)]) : null;
    if(!data || !Array.isArray(data.items) || !data.items.length){ $('empty').classList.remove('hidden'); $('meta').textContent=s+'과목 중빈도 유형'; return; }
    var cards = data.items.map(function(item,idx){
      var ry=item.representativeYear!=null?item.representativeYear:item.year;
      var rn=item.representativeNo!=null?item.representativeNo:item.questionNo;
      var src=getData(s,ry,'A');
      var q=null;
      if(src && Array.isArray(src.questions)) q=src.questions.find(function(x,i){ return qNoOf(x,i)===rn; });
      var form=(src&&src.answerForm)||'A형';
      var ans=q?ansArr(q.answer):[];
      var qtext=q?nn(q.text,q.stemText,q.question):'';
      var basis=q?nn(q.answerBasis,q.explanation):'';
      var ca=q?correctAnalysis(q,ans):[];
      var ansHTML = q? answerChips(q,ans) : '<div class="srcref" style="color:#0369a1">대표 문항을 찾지 못했습니다.</div>';
      var members=Array.isArray(item.members)?item.members:[];
      var memHTML=members.map(function(m){ return '<span class="mb-mem">'+m.year+' Q'+m.no+'</span>'; }).join('');
      var freqN=members.length||1;
      return '<div class="qcard" id="mid-'+s+'-'+(idx+1)+'">'
        + '<div class="anhead"><span class="mb-tier">중빈도 '+(idx+1)+'</span><span class="mb-src">'+esc(item.tier||'중빈도')+' · '+freqN+'회</span></div>'
        + '<div class="qtext" style="margin-top:9px">'+esc(item.title||'')+'</div>'
        + (memHTML?'<div class="srcref" style="margin-top:6px">출제 이력: '+memHTML+'</div>':'')
        + '<div class="srcref" style="margin-top:4px">대표 기출: <b style="color:#0369a1">'+ry+'년 '+esc(rn)+'번 · '+esc(form)+'</b></div>'
        + '<div class="seclabel" style="color:#0369a1">대표문항</div>'
        + '<div class="qbody">'+esc(qtext)+'</div>'
        + covAllChoicesHTML(q)
        + (item.clusterBasis?'<div class="cbx cbx-con"><b>묶음 근거</b>'+esc(item.clusterBasis)+'</div>':'')
        + (item.reason?'<div class="cbx cbx-memo"><b>중빈도 판단</b>'+esc(item.reason)+'</div>':'')
        + (item.studyFocus?'<div class="cbx cbx-key"><b>공부 포인트</b>'+esc(item.studyFocus)+'</div>':'')
        + ((item.watch&&item.watch.length)?'<div class="cbx cbx-cau"><b>다시 나오면 볼 것</b>'+listOf(item.watch)+'</div>':'')
        + (item.examTip?'<div class="cbx cbx-memo"><b>시험장 팁</b>'+esc(item.examTip)+'</div>':'')
        + (item.domainNote?'<div class="srcref" style="margin-top:6px;color:#0369a1">'+esc(item.domainNote)+'</div>':'')
        + (basis?'<div class="basis" style="margin-top:8px"><span class="k">정답 근거</span>'+esc(basis)+'</div>':'')
        + covChoiceAnalysisHTML(q)
        + '<button class="qnobtn" data-goyear="'+ry+'">→ '+ry+'년 원문 문제로 이동</button>'
        + '</div>';
    }).join('');
    $('meta').textContent = s+'과목 '+subjName(s)+' · 중빈도 유형 '+data.items.length+'개 · 남은문항';
    var intro = '<div class="catbar"><div class="ct">📊 중빈도 유형 · 남은 문항</div>'
      + '<div class="cd">'+esc((all&&all.years)||'2019~2025')+' 기출 · 중요개념 밖 <b>'+data.items.length+'</b>개. 빈출은 아니지만 반복·전이 가능성이 있어 공부할 가치가 있는 토픽.</div></div>';
    $('qlist').innerHTML = intro + cards;
    window.scrollTo(0,0);
  }

  // ===== 4과목 숫자 집중 정리 (박사 지시 2026-06-30) =====
  function loadNumbers(){
    var s=state.subject;
    $('empty').classList.add('hidden'); $('qlist').innerHTML='';
    if(getNum(s)){ renderNumbers(); return; }
    $('loading').classList.remove('hidden');
    injectOnce('../bosesa-num'+s+'.js');
    waitFor(function(){ return getNum(s)!=null; }, function(){
      $('loading').classList.add('hidden');
      if(getNum(s)) renderNumbers(); else { $('empty').classList.remove('hidden'); $('meta').textContent=s+'과목 숫자 정리'; }
    });
  }
  function numChip(txt, ok){
    var st = ok
      ? 'background:#e7f6ec;color:#0b7a37;border:1px solid #a7e0bd;'
      : 'background:#fdecef;color:#b3243c;border:1px solid #f3b8c2;text-decoration:line-through;text-decoration-color:#e09aa6;';
    return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px;margin:0 4px 4px 0;'+st+'">'+txt+'</span>';
  }
  function renderNumbers(){
    var D=getNum(state.subject);
    if(!D){ $('empty').classList.remove('hidden'); return; }
    var tab = (state.numbersTab==='questions')?'questions':'concepts';
    var cCount=(D.concepts||[]).reduce(function(n,t){return n+(t.items?t.items.length:0);},0);
    var qCount=(D.questions||[]).length;
    $('meta').textContent=state.subject+'과목 '+(D.subjectName||'')+' · 숫자 집중 정리 · 개념 '+cCount+' / 기출 '+qCount;
    var tabRow='<div style="display:flex;gap:8px;margin-bottom:12px">'
      + '<button data-ntab="concepts" class="chip'+(tab==='concepts'?' on':'')+'" style="font-weight:800">🔢 숫자 개념 '+cCount+'</button>'
      + '<button data-ntab="questions" class="chip'+(tab==='questions'?' on':'')+'" style="font-weight:800">📝 기출 문항 '+qCount+'</button></div>';
    var intro='<div class="catbar"><div class="ct">#️⃣ '+state.subject+'과목 숫자 집중 정리 · '+esc(D.subjectName||'')+'</div>'
      + '<div class="cd">기간·금액·점수·횟수 등 <b>숫자만 바꿔 오답을 만드는 문항</b>을 2019~2025 7개년 기출에서 전수 추출. ⚠️법령·고시 개정분 있으니 최신 원문 확인 필수.</div></div>';
    var body = (tab==='concepts') ? renderNumConcepts(D) : renderNumQuestions(D);
    $('qlist').innerHTML = intro + tabRow + body;
    window.scrollTo(0,0);
  }
  function renderNumConcepts(D){
    return (D.concepts||[]).map(function(t){
      var items=(t.items||[]).map(function(it){
        var yrs=(it.years||[]).map(function(y){return '<span class="mb-mem">'+y+'</span>';}).join('');
        var vars=(it.variants||[]).filter(Boolean);
        var varHTML=vars.length?'<div style="margin-top:5px"><span style="font-size:11px;color:#64748b;margin-right:4px">자주 바꿔 출제:</span>'+vars.map(function(v){return numChip(esc(v),false);}).join('')+'</div>':'';
        var note=it.note?'<div style="font-size:12px;color:#6b7280;margin-top:5px;line-height:1.5">'+esc(it.note)+'</div>':'';
        var basis=it.basis?'<div class="srcref" style="margin-top:5px">⚖ '+esc(it.basis)+'</div>':'';
        return '<div style="padding:10px 0;border-bottom:1px solid #e6e8eb">'
          + '<div style="display:flex;justify-content:space-between;gap:8px"><div style="font-weight:800;color:#15181d;font-size:13.5px">'+esc(it.label)+'</div><div style="flex-shrink:0">'+yrs+'</div></div>'
          + '<div style="margin-top:5px">'+numChip('✓ '+esc(it.correct),true)+'</div>'+varHTML+note+basis+'</div>';
      }).join('');
      return '<div class="qcard"><div class="qtext" style="color:#5b46b0;font-weight:800;font-size:15px;margin-bottom:4px">'+esc(t.topic)+'</div>'+items+'</div>';
    }).join('');
  }
  function renderNumQuestions(D){
    var qs=D.questions||[];
    if(!qs.length) return '<div class="qcard"><div class="qtext">기출 문항을 정리하는 중입니다.</div></div>';
    var byYear={}; qs.forEach(function(q){ (byYear[q.year]=byYear[q.year]||[]).push(q); });
    var years=Object.keys(byYear).map(Number).sort(function(a,b){return b-a;});
    return years.map(function(y){
      var cards=byYear[y].sort(function(a,b){return a.no-b.no;}).map(function(q){
        var ok=(q.correct||[]).map(function(c){return numChip('<b style="opacity:.7">'+esc(c.item)+':</b> '+esc(c.value),true);}).join('');
        var bad=(q.distractors||[]).map(function(d){return numChip('<b style="opacity:.7;text-decoration:none">'+esc(d.item)+':</b> '+esc(d.wrongValue),false);}).join('');
        return '<div style="padding:10px 0;border-bottom:1px solid #e6e8eb">'
          + '<div style="display:flex;gap:6px;align-items:flex-start"><span class="mb-tier">'+y+' #'+q.no+'</span><span style="font-weight:800;color:#15181d;font-size:13.5px">'+esc(q.concept)+'</span></div>'
          + (q.type?'<div style="font-size:10px;color:#64748b;margin-top:2px">'+esc(q.type)+'</div>':'')
          + '<div style="margin-top:7px"><div style="font-size:11px;color:#0b8a3e;font-weight:700;margin-bottom:3px">정답 수치</div><div>'+ok+'</div></div>'
          + (bad?'<div style="margin-top:5px"><div style="font-size:11px;color:#c81e3a;font-weight:700;margin-bottom:3px">바꿔 낸 오답</div><div>'+bad+'</div></div>':'')
          + (q.basis?'<div class="srcref" style="margin-top:5px">⚖ '+esc(q.basis)+'</div>':'')+'</div>';
      }).join('');
      return '<div class="qcard"><div class="qtext" style="color:#5b46b0;font-weight:800;font-size:15px;margin-bottom:4px">'+y+'년 <span style="font-size:11px;color:#64748b;font-weight:500">'+byYear[y].length+'문항</span></div>'+cards+'</div>';
    }).join('');
  }

  // ===== 유형 분포 · 개수 요약 대시보드 (박사 지시 2026-06-25) =====
  // 2026-06-24 큐레이션 4-tier 기준. 중빈도·희소는 런타임 데이터에서 집계, 버림은 매니페스트 스냅샷. 데스크톱 뷰어와 동일.
  var COV_DISCARD={1:1,2:0,3:1,4:13,5:0};
  var COVC={ concept:{bd:'#f59e0b',fg:'#fcd34d',label:'중요개념',v:'concepts'},
             mid:{bd:'#38bdf8',fg:'#7dd3fc',label:'중빈도',v:'midFreq'},
             rare:{bd:'#f43f5e',fg:'#fda4af',label:'희소',v:'rareTypes'},
             discard:{bd:'#64748b',fg:'#94a3b8',label:'버림',v:null} };
  var COV_ORDER=['concept','mid','rare','discard'];
  function covMidCount(s){ var mf=getMidFreq(); var d=mf&&mf.subjects&&(mf.subjects[s]||mf.subjects[String(s)]); if(!d||!d.items)return 0;
    var n=0; for(var i=0;i<d.items.length;i++){ var m=d.items[i].members; n+=(m&&m.length)?m.length:1; } return n; }
  function covRareCount(s){ var rt=getRareTypes(); var d=rt&&rt.subjects&&(rt.subjects[s]||rt.subjects[String(s)]); return (d&&d.items)?d.items.length:0; }
  function covCompute(s){ var mid=covMidCount(s), rare=covRareCount(s), discard=COV_DISCARD[s]||0, tot=175;
    return { tot:tot, mid:mid, rare:rare, discard:discard, concept:tot-mid-rare-discard }; }
  function covAllLoaded(){ return getMidFreq()!=null && getRareTypes()!=null; }
  function loadCoverage(){
    $('empty').classList.add('hidden'); $('qlist').innerHTML=''; $('meta').textContent='유형 분포 · 개수 요약';
    if(covAllLoaded()){ renderCoverage(); return; }
    $('loading').classList.remove('hidden');
    injectOnce('../bosesa-midfreq.js'); injectOnce('../bosesa-rare-types.js');
    waitFor(covAllLoaded, function(){ $('loading').classList.add('hidden'); renderCoverage(); });
  }
  function covPct(n,t){ return t?Math.round(n/t*100):0; }
  function covBar(r){ var t=r.tot||1, h='';
    for(var i=0;i<COV_ORDER.length;i++){ var k=COV_ORDER[i]; if(r[k]>0) h+='<div style="width:'+(r[k]/t*100)+'%;background:'+COVC[k].bd+'"></div>'; }
    return '<div style="display:flex;height:12px;border-radius:99px;overflow:hidden;background:#1e293b;border:1px solid #334155">'+h+'</div>'; }
  function covLegend(k,n,t){ return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:'+COVC[k].fg+'"><span style="width:10px;height:10px;border-radius:3px;background:'+COVC[k].bd+';display:inline-block"></span>'+COVC[k].label+' <b>'+n+'</b><span style="opacity:.6;font-weight:400">'+covPct(n,t)+'%</span></span>'; }
  function covNav(k,s,n){
    if(COVC[k].v) return '<button class="cov-nav" data-s="'+s+'" data-v="'+COVC[k].v+'" style="font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;border:1px solid '+COVC[k].bd+'66;background:'+COVC[k].bd+'1a;color:'+COVC[k].fg+'">'+COVC[k].label+' '+n+'개 →</button>';
    return '<span style="font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;border:1px solid #334155;color:#64748b">'+COVC[k].label+' '+n+'개</span>';
  }
  function renderCoverage(){
    var all=[], sum={tot:0,concept:0,mid:0,rare:0,discard:0};
    for(var s=1;s<=5;s++){ var r=covCompute(s); r.s=s; r.name=subjName(s); all.push(r);
      sum.tot+=r.tot; sum.concept+=r.concept; sum.mid+=r.mid; sum.rare+=r.rare; sum.discard+=r.discard; }
    $('meta').textContent='유형 분포 · 5과목 누적 '+sum.tot+'문항';
    var head='<div class="catbar"><div class="ct">🗂 유형 분포 · 개수 요약</div>'
      + '<div class="cd">과목당 7개년×25 = <b>175문항</b>을 <b style="color:'+COVC.concept.fg+'">중요개념</b>/<b style="color:'+COVC.mid.fg+'">중빈도</b>/<b style="color:'+COVC.rare.fg+'">희소</b>/<b style="color:'+COVC.discard.fg+'">버림</b> 4계층으로 분류한 개수. (2026-06-24 큐레이션 기준 · 중요개념=175−중빈도−희소−버림) 칩을 누르면 해당 학습 카테고리로.</div></div>';
    var lg=function(r){ var h=''; for(var i=0;i<COV_ORDER.length;i++) h+=covLegend(COV_ORDER[i],r[COV_ORDER[i]],r.tot); return h; };
    var nv=function(r){ var h=''; for(var i=0;i<COV_ORDER.length;i++) h+=covNav(COV_ORDER[i],r.s,r[COV_ORDER[i]]); return h; };
    var total='<div style="border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid rgba(56,189,248,.3);background:linear-gradient(135deg,#0c1322,#0a0f1c)">'
      + '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px"><span style="font-size:13px;font-weight:800;color:#fff">📚 전체 합계</span><span style="font-size:11px;color:#94a3b8">5과목 누적 <b style="color:#fff">'+sum.tot+'</b>문항</span></div>'
      + covBar(sum) + '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">'+lg(sum)+'</div></div>';
    var cards=all.map(function(r){
      return '<div style="border-radius:12px;background:rgba(15,23,42,.6);border:1px solid #1e293b;padding:14px;margin-bottom:10px">'
        + '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b style="font-size:13px;color:#fff">'+r.s+'과목</b> <span style="font-size:12px;color:#94a3b8">'+esc(r.name||'')+'</span></div><div style="font-size:11px;color:#64748b">총 <b style="color:#cbd5e1">'+r.tot+'</b>문항</div></div>'
        + '<div style="margin-top:8px">'+covBar(r)+'</div>'
        + '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">'+lg(r)+'</div>'
        + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid #1e293b">'+nv(r)+'</div></div>';
    }).join('');
    $('qlist').innerHTML = head + total + cards;
    window.scrollTo(0,0);
  }

  // ===== events =====
  $('subjectChips').addEventListener('click', function(e){
    var b=e.target.closest('.chip'); if(!b)return; state.subject=+b.dataset.s; state.form='A';
    if(state.view==='numbers' && NUM_SUBJECTS.indexOf(state.subject)<0) state.view='exam';
    renderChips(); syncAnsToggle(); reloadCurrent();
  });
  $('yearChips').addEventListener('click', function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    if(b.dataset.view){ switchView(b.dataset.view); return; }
    state.view='exam'; state.year=+b.dataset.y; state.form='A'; renderChips(); syncAnsToggle(); load();
  });
  $('formChips').addEventListener('click', function(e){
    var b=e.target.closest('.chip'); if(!b)return; state.form=(b.dataset.f==='B'?'B':'A'); renderChips(); load();
  });
  // 희소유형 → 원문 기출 이동
  $('qlist').addEventListener('click', function(e){
    var nt=e.target.closest('[data-ntab]'); if(nt){ state.numbersTab=nt.dataset.ntab; renderNumbers(); window.scrollTo(0,0); return; }
    var cn=e.target.closest('.cov-nav'); if(cn){ state.subject=+cn.dataset.s; switchView(cn.dataset.v); return; }
    var yt=e.target.closest('.an-yeartab'); if(yt && yt.dataset.anyear){ state.answerYear=(yt.dataset.anyear==='all')?'all':+yt.dataset.anyear; renderAnswerNotes(); return; }
    var b=e.target.closest('.qnobtn'); if(!b)return;
    state.view='exam'; state.year=+b.dataset.goyear; state.form='A'; renderChips(); syncAnsToggle(); load();
  });
  $('ansToggle').addEventListener('click', function(){
    state.answersShown=!state.answersShown;
    this.textContent = state.answersShown?'정답·해설 표시':'정답·해설 숨김(시험모드)';
    this.classList.toggle('off', !state.answersShown);
    if(state.view==='concepts'){ renderConcepts(); } else if(state.view==='exam'){ render(); }
  });
  var totop=$('totop');
  window.addEventListener('scroll', function(){ totop.style.display = window.scrollY>500?'block':'none'; });
  totop.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

  // URL 파라미터(?subject=1&year=2023&form=B&view=…&rare=1)로 직행 — 공유/딥링크용
  try {
    var q=new URLSearchParams(location.search);
    if(q.get('subject')) state.subject=+q.get('subject');
    if(q.get('year')) state.year=+q.get('year');
    if(q.get('form')) state.form=(String(q.get('form')).toUpperCase()==='B'?'B':'A');
    if(!hasBForm(state.subject,state.year)) state.form='A';
    var vw=q.get('view');
    if(vw==='concepts'||vw==='answerNotes'||vw==='rareTypes'||vw==='midFreq'||vw==='coverage') state.view=vw;
    if((vw==='numbers'||q.get('num')) && NUM_SUBJECTS.indexOf(state.subject)>=0) state.view='numbers';
    if(q.get('ntab')) state.numbersTab=(q.get('ntab')==='questions'?'questions':'concepts');
    if(q.get('rare')) state.view='rareTypes';
    if(q.get('mid')) state.view='midFreq';
    if(q.get('coverage')) state.view='coverage';
  } catch(e){}

  renderChips();
  syncAnsToggle();
  reloadCurrent();
})();
</script>
</body>
