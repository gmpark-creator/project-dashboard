name: AI Video Studio

on:
  push:
    paths:
      - "ai-video-studio/**"
      - ".github/workflows/ai-video-studio.yml"
  pull_request:
    paths:
      - "ai-video-studio/**"
      - ".github/workflows/ai-video-studio.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-video-studio/studio-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-video-studio/studio-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
